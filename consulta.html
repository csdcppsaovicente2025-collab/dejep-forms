<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consulta DEJEP — CPP São Vicente</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/6.5.0/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
<style>
/* ============================================================
   IDENTIDADE VISUAL — multicam black
   ============================================================
   A paleta vem do fardamento: preto dominante, grafite, o
   cinza-oliva do padrão, e o latão das insígnias como único
   acento de ação. É paleta, não estampa: o padrão de camuflagem
   em si é desenho proprietário, e como fundo de uma tela cheia de
   nome, data e horário deixaria tudo ilegível. Aqui ele aparece
   onde camuflagem aparece de verdade num uniforme — no tecido, ao
   fundo, quieto — e a informação fica em cima, com contraste.

   Toda cor é token. Nenhum componente tem cor literal: trocar a
   identidade inteira é trocar este bloco.
   ============================================================ */
:root {
  /* Tecido */
  --preto:         #0a0b0c;
  --grafite:       #14161a;
  --grafite-alto:  #1b1e23;
  --grafite-fundo: #101216;
  --borda:         #262a30;
  --borda-clara:   #343a42;
  /* O cinza-oliva do padrão: faixas, separadores, o que é estrutura */
  --oliva:         #4d5347;
  --oliva-claro:   #6b7363;
  /* Texto */
  --texto:         #e6e7e4;
  --texto-2:       #a6aba3;
  --texto-3:       #8a9087;
  --texto-4:       #555a52;
  /* Latão da insígnia: ação, foco, o número que importa */
  --latao:         #c9a227;
  --latao-claro:   #e0bc5a;
  --latao-escuro:  #8a6e18;
  --latao-fundo:   #2a2310;
  /* Semânticas */
  --verde:         #5f9e6e;
  --verde-fundo:   #16231a;
  --verde-borda:   #2f4a35;
  --vermelho:      #d66b60;
  --vermelho-fundo:#271614;
  --vermelho-borda:#4a2621;
  --ambar:         #d9a63c;
  --ambar-fundo:   #291f10;
  --ambar-borda:   #4a3a16;
  --roxo:          #9d82c9;
  --roxo-fundo:    #1f1a2b;
  --roxo-borda:    #3a2f4f;
  --azul:          #7aa5cc;
  --azul-fundo:    #141d26;
  --azul-borda:    #26384a;
  /* Tipografia */
  --fonte-tit: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --fonte: 'Inter', 'Segoe UI', Arial, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--fonte); background: var(--preto); color: var(--texto);
min-height: 100vh; padding: 2rem 1rem 4rem; font-variant-numeric: tabular-nums;
-webkit-font-smoothing: antialiased; }
.container { max-width: 680px; margin: 0 auto; }

/* ---- Cabeçalho ----
   Faixa de tecido com um fio de latão embaixo, como a lapela de
   um uniforme. O brasão é a imagem oficial da instituição e fica
   como está. */
.header { background: linear-gradient(170deg, var(--grafite-alto), var(--grafite));
border: 1px solid var(--borda); border-bottom: 2px solid var(--latao-escuro);
border-radius: 14px; padding: 1.25rem 2rem; margin-bottom: 1.5rem; }
.header-inner { display: flex; align-items: center; justify-content: center; gap: 1rem; }
.header-brasao { width: 110px; height: 110px; object-fit: contain; flex-shrink: 0;
filter: drop-shadow(0 2px 10px rgba(201,162,39,0.18)); }
/* Contrapeso do brasão: sem ele o texto ficaria centralizado apenas
   no espaço à direita da imagem, e não no meio do cabeçalho. */
.header-espaco { width: 110px; flex-shrink: 0; }
.header-texto { text-align: center; }
@media (max-width: 560px) {
  .header-inner { flex-direction: column; gap: 0.7rem; }
  .header-espaco { display: none; }
}
.header h1 { font-family: var(--fonte-tit); font-size: 1.35rem; font-weight: 700;
color: var(--texto); letter-spacing: 0.1em; text-transform: uppercase;
margin-bottom: 5px; line-height: 1.15; }
.header h2 { font-family: var(--fonte-tit); font-size: 1rem; font-weight: 500;
color: var(--latao); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
.header p { font-size: 0.74rem; color: var(--texto-3); margin-top: 3px;
letter-spacing: 0.02em; }

.card { background: var(--grafite); border-radius: 14px; padding: 1.5rem;
margin-bottom: 1.25rem; border: 1px solid var(--borda); }
.card-title { font-family: var(--fonte-tit); font-size: 0.95rem; font-weight: 700;
text-transform: uppercase; letter-spacing: 0.11em; color: var(--texto-2);
margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--borda); }

.abas { display: flex; gap: 8px; margin-bottom: 1.25rem; }
.aba { flex: 1; padding: 11px; border: 1px solid var(--borda-clara);
background: var(--grafite); color: var(--texto-2);
border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: center;
font-family: var(--fonte-tit); text-transform: uppercase; letter-spacing: 0.06em;
transition: border-color 0.15s, background 0.15s, color 0.15s; }
.aba:hover { border-color: var(--oliva-claro); color: var(--texto); }
.aba.ativa { background: var(--latao); color: #15120a; border-color: var(--latao);
font-weight: 700; }
.busca { width: 100%; border: 1px solid var(--borda-clara); border-radius: 8px; padding: 9px 12px;
font-size: 0.95rem; color: var(--texto); background: var(--grafite-fundo); outline: none;
margin-bottom: 1.25rem; font-family: inherit; }
.busca:focus { border-color: var(--latao); }
.busca::placeholder { color: var(--texto-4); }

.tabela-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th { background: var(--oliva); color: var(--texto); padding: 9px 8px; text-align: left;
font-family: var(--fonte-tit); font-weight: 600; white-space: nowrap;
text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.86rem; }
th:first-child { border-radius: 8px 0 0 0; }
th:last-child { border-radius: 0 8px 0 0; }
td { padding: 9px 8px; border-bottom: 1px solid var(--borda); }
tr:last-child td { border-bottom: none; }
tbody tr:nth-child(even) { background: var(--grafite-fundo); }
.pos { display: inline-block; min-width: 28px; text-align: center; background: var(--grafite-alto);
color: var(--texto); border: 1px solid var(--borda-clara);
border-radius: 6px; padding: 2px 6px; font-size: 0.78rem; font-weight: 700; }
.pos.topo { background: var(--latao); color: #15120a; border-color: var(--latao); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* Coluna de contagem: o cabeçalho é largo e o número é curto, então
   os dois centralizados é o único jeito de ficarem na mesma prumada. */
.centro, th.centro { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 5px; background: var(--roxo-fundo);
color: var(--roxo); border: 1px solid var(--roxo-borda); font-weight: 700; }
/* Marca de cancelamento na coluna DEJEPs: explica por que o número
   exibido é menor que o de quem está à frente. Diz "canc." por
   escrito — cor sozinha não se lê em impressão nem por quem enxerga
   mal — e vem em tom neutro, porque cancelar em tempo hábil é
   direito do servidor, não falta. */
.canc { font-size: 0.66rem; padding: 1px 5px; border-radius: 4px; background: var(--grafite-alto);
color: var(--texto-2); border: 1px solid var(--borda-clara);
font-weight: 700; white-space: nowrap; cursor: help; }
.empty-msg { text-align: center; color: var(--texto-3); font-size: 0.88rem;
padding: 1.5rem 1rem; line-height: 1.6; }
.aviso-info { background: var(--azul-fundo); border-left: 3px solid var(--azul); border-radius: 8px;
padding: 0.85rem 1rem; font-size: 0.8rem; color: var(--texto-2); line-height: 1.55;
margin-bottom: 1.25rem; }
.rodape { margin-top: 1.5rem; text-align: center; }
.rodape span { display: inline-block; color: var(--texto-3); font-size: 12.2px; font-weight: 600;
background: var(--grafite); border: 1px solid var(--borda); border-radius: 6px; padding: 0.5rem 1ch;
/* Crédito discreto: mesmas cores, menos presença na página. */
opacity: 0.6; }

/* ---- Botão de ajuda ----
   Os textos de instrução saíram da tela. O que carrega regra — a
   senha inicial, o prazo para cancelar, a posição preservada, a
   marca de cancelamento na fila — mora atrás deste ícone. Fica
   discreto porque é consulta de quem precisa, não aviso para
   todos; e existe porque tirar a regra da tela sem deixar onde
   lê-la transforma cada dúvida numa pergunta à Diretoria. */
.ajuda { border: 1px solid var(--borda-clara); background: var(--grafite-alto);
color: var(--texto-3); width: 20px; height: 20px; border-radius: 50%;
font-size: 0.72rem; font-weight: 700; line-height: 1; cursor: pointer; padding: 0;
font-family: var(--fonte); flex-shrink: 0; vertical-align: middle; }
.ajuda:hover { border-color: var(--latao); color: var(--latao); }
.card-title .ajuda { margin-left: 7px; }
.ajuda-corpo { font-size: 0.85rem; color: var(--texto-2); line-height: 1.65; }
.ajuda-corpo strong { color: var(--texto); }
.ajuda-corpo p + p { margin-top: 0.7rem; }

.cal-mes { text-align: center; font-family: var(--fonte-tit); font-weight: 700;
font-size: 1.2rem; color: var(--texto);
margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
.cal-semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
.cal-dia-sem { text-align: center; font-size: 0.68rem; font-weight: 700; color: var(--texto-3);
text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 0; }
.cal-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-cel { border: 1px solid var(--borda); border-radius: 8px; background: var(--grafite-fundo);
padding: 4px 3px; min-height: 62px; display: flex; flex-direction: column; gap: 2px; }
.cal-cel.vazia { border: none; background: transparent; }
.cal-cel.fds { background: var(--grafite-alto); }
.cal-cel.sem-escala { background: transparent; border-style: dashed; }
.cal-cel.hoje { border-color: var(--latao); border-width: 2px; }
.cal-num { font-size: 0.72rem; font-weight: 700; color: var(--texto-2); text-align: center;
line-height: 1.2; }
.cal-item { font-size: 0.58rem; line-height: 1.25; border-radius: 4px; padding: 2px 3px;
color: var(--texto); overflow: hidden; border-left: 2px solid transparent; }
.cal-item.apagado { opacity: 0.3; }
.cal-hora { font-weight: 700; }
/* Cada horário tem a sua cor, em tom de tecido: o fundo é escuro e o
   fio da esquerda carrega a identidade. */
.cal-item.h07 { background: var(--verde-fundo); border-left-color: var(--verde); }
.cal-item.h11 { background: var(--ambar-fundo); border-left-color: var(--ambar); }
.cal-item.h23 { background: var(--azul-fundo); border-left-color: var(--azul); }
.cal-item.h10 { background: var(--roxo-fundo); border-left-color: var(--roxo); }
.cal-item.h22 { background: var(--latao-fundo); border-left-color: var(--latao); }
.cal-legenda { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
margin-top: 0.9rem; font-size: 0.7rem; color: var(--texto-3); }
.cal-legenda span { display: flex; align-items: center; gap: 4px; }
.cal-legenda .pt { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.cal-legenda .pt.h07 { background: var(--verde); } .cal-legenda .pt.h11 { background: var(--ambar); }
.cal-legenda .pt.h23 { background: var(--azul); } .cal-legenda .pt.h10 { background: var(--roxo); }
.cal-legenda .pt.h22 { background: var(--latao); }
@media (max-width: 560px) {
  .cal-cel { min-height: 52px; padding: 3px 2px; }
  .cal-item { font-size: 0.5rem; }
}

/* ---- Painel pessoal e ações ----
   É o cartão que o servidor abre para ver a si mesmo: ganha o fio de
   latão à esquerda, que no resto da página marca o que é dele. */
.painel { background: linear-gradient(170deg, var(--grafite-alto), var(--grafite));
color: var(--texto); border: 1px solid var(--borda); border-left: 3px solid var(--latao);
border-radius: 12px; padding: 1.1rem 1.25rem; margin-bottom: 1.25rem; }
.painel-nome { font-family: var(--fonte-tit); font-size: 1.3rem; font-weight: 700;
text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.15; }
.painel-pos { font-size: 0.8rem; color: var(--texto-2); margin-top: 3px; }
.painel-item { background: var(--grafite-fundo); border: 1px solid var(--borda);
border-radius: 8px; padding: 0.6rem 0.75rem;
margin-top: 0.6rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.painel-item .pi-data { font-weight: 700; font-size: 0.95rem; min-width: 62px; color: var(--latao); }
.painel-item .pi-info { font-size: 0.8rem; color: var(--texto-2); flex: 1; min-width: 120px; }
.btn-acao { border: 1px solid var(--borda-clara); border-radius: 6px; padding: 6px 11px;
font-size: 0.76rem; font-weight: 700; cursor: pointer; background: var(--grafite-alto);
color: var(--texto); font-family: inherit; }
.btn-acao:hover { border-color: var(--latao); color: var(--latao); }
.btn-acao.cancelar { background: var(--vermelho-fundo); color: var(--vermelho);
border-color: var(--vermelho-borda); }
.btn-acao.cancelar:hover { border-color: var(--vermelho); color: var(--vermelho); }
.btn-acao:disabled { background: var(--grafite-fundo); color: var(--texto-4);
border-color: var(--borda); cursor: not-allowed; }
.btn-acao:disabled:hover { border-color: var(--borda); color: var(--texto-4); }

.dia-bloco { border: 1px solid var(--borda); border-radius: 10px; margin-bottom: 8px;
overflow: hidden; }
.dia-cab { background: var(--grafite-alto); padding: 7px 12px; font-family: var(--fonte-tit);
font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
color: var(--texto); display: flex; justify-content: space-between; }
.dia-cab .dia-fds { color: var(--latao); }
.linha-dejep { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
border-top: 1px solid var(--borda); font-size: 0.85rem; }
.linha-dejep .ld-hora { font-weight: 700; color: var(--latao); min-width: 42px; }
.linha-dejep .ld-posto { font-size: 0.72rem; color: var(--texto-3); min-width: 96px; }
.linha-dejep .ld-nome { flex: 1; min-width: 110px; }
.linha-dejep.minha { background: var(--latao-fundo); }
.linha-dejep.clicavel { cursor: pointer; }
.linha-dejep.clicavel:hover { background: var(--grafite-alto); }
.linha-dejep .ld-vaga { color: var(--vermelho); font-weight: 700; }
.linha-dejep .ld-oculto { color: var(--texto-4); font-style: italic; font-weight: 400; }

.modal-fundo { position: fixed; inset: 0; background: rgba(4,5,6,0.78); display: none;
align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
.modal-fundo.ativo { display: flex; }
.modal-cx { background: var(--grafite); border: 1px solid var(--borda-clara);
border-radius: 14px; padding: 1.5rem; max-width: 420px; width: 100%;
max-height: 86vh; overflow-y: auto; }
.modal-tit { font-family: var(--fonte-tit); font-size: 1.25rem; font-weight: 700;
text-transform: uppercase; letter-spacing: 0.07em; color: var(--texto); margin-bottom: 0.5rem; }
.modal-sub { font-size: 0.84rem; color: var(--texto-2); line-height: 1.55; margin-bottom: 1rem; }
.modal-opt { display: block; width: 100%; text-align: left; border: 1px solid var(--borda-clara);
background: var(--grafite-fundo); border-radius: 8px; padding: 10px 12px; margin-bottom: 7px;
font-size: 0.85rem; cursor: pointer; color: var(--texto); font-family: inherit; }
.modal-opt:hover { border-color: var(--latao); background: var(--grafite-alto); }
.modal-acoes { display: flex; gap: 8px; margin-top: 0.75rem; }
.modal-btn { flex: 1; border: 1px solid var(--borda-clara); border-radius: 8px; padding: 10px;
font-size: 0.85rem; font-weight: 700; cursor: pointer; background: var(--grafite-alto);
color: var(--texto-2); font-family: inherit; }
.modal-btn:hover { color: var(--texto); }
.modal-btn.principal { background: var(--latao); color: #15120a; border-color: var(--latao); }
.modal-btn.perigo { background: var(--vermelho); color: #160b09; border-color: var(--vermelho); }
/* Resposta a um pedido de troca, dentro do cartão. Mesma aparência dos
   botões do aviso, classe própria: são outro lugar e outra função. */
.btn-resp { flex: 1; border: 1px solid var(--borda-clara); border-radius: 8px; padding: 10px;
font-size: 0.85rem; font-weight: 700; cursor: pointer; background: var(--grafite-alto);
color: var(--texto-2); font-family: inherit; }
.btn-resp.aceitar { background: var(--latao); color: #15120a; border-color: var(--latao); }
/* Retirar o próprio pedido é ação de desfazer: vermelha, e sozinha na
   linha, longe de "Aceitar" e "Recusar", que ficam nos pedidos
   recebidos. Era vermelha CHEIA, para não se perder no cinza do
   cartão claro; no fundo escuro a premissa caiu — cheia virava a
   coisa mais gritante da tela, mais que o próprio Entrar. Contornada
   continua inconfundível e para de gritar. A confirmação dentro do
   modal, essa sim, segue cheia: ali o destaque é o ponto. */
.btn-resp.perigo { background: var(--vermelho-fundo); color: var(--vermelho);
border-color: var(--vermelho); }
.btn-resp.perigo:hover { background: var(--vermelho); color: #160b09; }

/* Indicador de carregamento no centro da tela. No telefone, um aviso
   no rodapé passa despercebido — e o servidor clica de novo. */
.aguardo { position: fixed; inset: 0; background: rgba(4,5,6,0.78); display: none;
align-items: center; justify-content: center; z-index: 80; padding: 1rem; }
.aguardo.ativo { display: flex; }
.aguardo-cx { background: var(--grafite); border: 1px solid var(--borda-clara);
border-radius: 14px; padding: 1.6rem 2rem; text-align: center;
box-shadow: 0 6px 30px rgba(0,0,0,0.6); max-width: 300px; }
.aguardo-roda { width: 42px; height: 42px; margin: 0 auto 0.9rem; border-radius: 50%;
border: 4px solid var(--borda-clara); border-top-color: var(--latao);
animation: girar 0.9s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.aguardo-txt { font-family: var(--fonte-tit); font-size: 1rem; font-weight: 600;
text-transform: uppercase; letter-spacing: 0.07em; color: var(--texto); }
@media (prefers-reduced-motion: reduce) { .aguardo-roda { animation-duration: 2.4s; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px;
background: var(--grafite-alto); border: 1px solid var(--latao-escuro);
color: var(--texto); padding: 12px 18px; border-radius: 10px;
font-size: 0.85rem; max-width: 92%; z-index: 60; display: none;
box-shadow: 0 4px 22px rgba(0,0,0,0.6); }
.toast.erro { border-color: var(--vermelho); }

/* ---- Impedimentos ---- */
.imp-sec { border-top: 1px solid var(--borda); margin-top: 0.9rem; padding-top: 0.8rem; }
.imp-tit { font-family: var(--fonte-tit); font-size: 0.86rem; font-weight: 700;
text-transform: uppercase; letter-spacing: 0.09em; color: var(--texto-2); margin-bottom: 0.5rem; }
.imp-item { background: var(--grafite-fundo); border: 1px solid var(--borda);
border-radius: 8px; padding: 0.5rem 0.7rem;
margin-bottom: 0.4rem; display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
font-size: 0.8rem; }
.imp-item .ii-per { font-weight: 700; white-space: nowrap; color: var(--latao); }
.imp-item .ii-mot { color: var(--texto-2); flex: 1; min-width: 100px; }
.imp-vazio { font-size: 0.78rem; color: var(--texto-3); line-height: 1.5; margin-bottom: 0.5rem; }
.btn-imp { border: 1px dashed var(--borda-clara); background: transparent; color: var(--texto-2);
border-radius: 8px; padding: 8px 12px; font-size: 0.78rem; font-weight: 700;
cursor: pointer; width: 100%; font-family: inherit; }
.btn-imp:hover { border-style: solid; border-color: var(--latao); color: var(--latao); }
.campo-lbl { display: block; font-family: var(--fonte-tit); font-size: 0.86rem; font-weight: 600;
color: var(--texto-2); text-transform: uppercase; letter-spacing: 0.08em;
margin: 0.8rem 0 0.3rem; }
.campo-ent { width: 100%; border: 1px solid var(--borda-clara); border-radius: 8px;
padding: 10px 11px; font-size: 0.95rem; font-family: inherit; color: var(--texto);
background: var(--grafite-fundo); outline: none; }
.campo-ent:focus { border-color: var(--latao); }

/* ------------------------------------------------------------
   NATAL — a única coisa nesta página que não é trabalho
   ------------------------------------------------------------
   Três regras, e elas são o projeto inteiro:

   1. DESLIGADO por padrão. Quem abre o sistema às 23h para ver se
      tem DEJEP amanhã não quer animação na cara. Quem quiser, liga.
   2. SOME SOZINHO. Só existe de 1º de dezembro a 6 de janeiro.
      Ninguém precisa lembrar de tirar em março.
   3. NÃO RODA desligado, nem com a aba em segundo plano, nem para
      quem pediu menos movimento no sistema operacional.

   Custo: o laço só existe depois do clique, e morre no clique
   seguinte. Desligado, a página é exatamente a de antes.
   ------------------------------------------------------------ */
.natal { display: none; }
body.e-natal .natal { display: inline-flex; }
/* A cordinha de luzes, ao pé do cabeçalho. Parada: é enfeite, não

.natal-luzes i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.natal-luzes i:nth-child(1) { background: #c9a227; box-shadow: 0 0 7px #c9a22788; }
.natal-luzes i:nth-child(2) { background: #5f9e6e; box-shadow: 0 0 7px #5f9e6e88; }
.natal-luzes i:nth-child(3) { background: #d66b60; box-shadow: 0 0 7px #d66b6088; }
.natal-luzes i:nth-child(4) { background: #e6e7e4; box-shadow: 0 0 7px #e6e7e488; }
.natal-luzes i:nth-child(5) { background: #5f9e6e; box-shadow: 0 0 7px #5f9e6e88; }
.natal-luzes i:nth-child(6) { background: #c9a227; box-shadow: 0 0 7px #c9a22788; }
.natal-luzes span { font-family: var(--fonte-tit); font-size: 0.78rem; font-weight: 600;
color: var(--texto-3); text-transform: uppercase; letter-spacing: 0.1em; margin-left: 5px; }
body.nevando .natal-luzes i { animation: brilho 2.6s ease-in-out infinite; }
.natal-luzes i:nth-child(2) { animation-delay: 0.4s; }
.natal-luzes i:nth-child(3) { animation-delay: 0.8s; }

@keyframes brilho { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
/* A neve fica ATRÁS DOS CARTÕES e não intercepta clique nenhum. Na
   primeira versão ela passava por cima do texto: num enfeite de
   portal isso é charme, numa tela de escala é ruído atravessando o

#neve { position: fixed; inset: 0; pointer-events: none; z-index: 0; display: none; }
.container { position: relative; z-index: 1; }

}

// "Está lento" não se conserta por palpite. Com ?diag=1 a página
// mostra, num quadro no canto, cada chamada feita ao servidor, quanto
// ela levou de ponta a ponta e quanto DISSO o servidor gastou
// calculando. A diferença entre as duas é viagem pela internet mais o
// arranque do Apps Script, que nenhum conserto no código alcança.
//
// Mostra também a versão implantada. Colar o código no editor não
// muda o que o /exec responde: só uma nova implantação muda. Se a
// versão aqui não for a esperada, o servidor no ar ainda é o antigo.
// ============================================================
const DIAG = /[?&]diag=1/.test(location.search);
const diagChamadas = [];

if (DIAG) {
  const fetchOriginal = window.fetch.bind(window);
  window.fetch = function (url) {
    const t0 = (window.performance && performance.now) ? performance.now() : Date.now();
    const acao = (String(url).match(/acao=([a-z_]+)/) || [, '?'])[1];
    const marcar = function (j) {
      const t1 = (window.performance && performance.now) ? performance.now() : Date.now();
      diagChamadas.push({
        acao: acao + (String(url).indexOf('stats=1') !== -1 ? ' +stats' : ''),
        total: Math.round(t1 - t0),
        servidor: (j && typeof j.tempoMs === 'number') ? j.tempoMs : null,
        marcos: (j && j.marcos) || null,
        versao: (j && j.versao) || '',
        bytes: j ? JSON.stringify(j).length : 0
      });
      desenharDiag();
    };
    return fetchOriginal.apply(null, arguments).then(function (r) {
      try {
        r.clone().json().then(marcar).catch(function () { marcar(null); });
      } catch (e) { marcar(null); }
      return r;
    }, function (e) { marcar(null); throw e; });
  };
}

function desenharDiag() {
  if (!DIAG || !document.body) return;
  let cx = document.getElementById('diag');
  if (!cx) {
    cx = document.createElement('div');
    cx.id = 'diag';
    cx.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:9999;max-width:330px;'
      + 'background: var(--grafite-alto);color: var(--texto);font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;'
      + 'padding:10px 12px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35)';
    document.body.appendChild(cx);
  }
  const versoes = diagChamadas.map(function (c) { return c.versao; })
    .filter(function (v) { return v; });
  // Sem chamada nenhuma ainda, o painel precisa dizer que está vivo:
  // desde que a página deixou de consultar o servidor antes do login,
  // a primeira chamada só acontece quando alguém entra, e um painel
  // invisível parece painel que não funciona.
  if (!diagChamadas.length) {
    cx.innerHTML = '<div style="font-weight:700;margin-bottom:6px">Diagnóstico</div>'
      + '<div style="color: var(--texto-2)">Nenhuma chamada ao servidor ainda.<br>'
      + 'Entre no sistema: os tempos aparecem aqui.</div>';
    return;
  }
  const v = versoes.length ? versoes[versoes.length - 1] : '(não informada)';
  const somaT = diagChamadas.reduce(function (a, c) { return a + c.total; }, 0);
  const somaS = diagChamadas.reduce(function (a, c) {
    return a + (c.servidor || 0); }, 0);
  cx.innerHTML = '<div style="font-weight:700;margin-bottom:6px">Diagnóstico</div>'
    + '<div style="color: var(--texto-2)">versão no ar: <b style="color: var(--texto)">' + v + '</b></div>'
    + '<div style="color: var(--texto-2);margin-bottom:6px">'
    + diagChamadas.length + ' chamada(s) · ' + somaT + ' ms, sendo '
    + somaS + ' ms de servidor</div>'
    + diagChamadas.map(function (c) {
        const fora = (c.servidor === null) ? '?' : (c.total - c.servidor);
        // Os marcos vêm ordenados do mais caro para o mais barato: numa
        // lista longa, o que interessa é o primeiro.
        var detalhe = '';
        if (c.marcos && c.marcos.length) {
          detalhe = '<div style="margin:4px 0 8px 10px;color: var(--texto-2)">'
            + c.marcos.slice().sort(function (a, b) { return b.ms - a.ms; })
                .slice(0, 6)
                .map(function (m) { return '· ' + m.o + ': <b>' + m.ms + ' ms</b>'; })
                .join('<br>')
            + '</div>';
        }
        return '<div>' + c.acao + ': <b>' + c.total + ' ms</b>'
          + ' <span style="color: var(--texto-2)">(' + (c.servidor === null ? '?' : c.servidor)
          + ' servidor + ' + fora + ' rede) · '
          + Math.round(c.bytes / 1024) + ' KB</span></div>' + detalhe;
      }).join('');
}

// SESSÃO — encerra sozinha depois de um tempo sem uso
//
// Os computadores da unidade são compartilhados. Sem isto, o servidor
// que esquece de sair deixa a própria escala aberta para quem sentar
// em seguida, com poder de cancelar e trocar DEJEP em nome dele.
//
// A contagem é por CARIMBO DE TEMPO, não por temporizador: se a
// máquina hibernar ou a aba ficar em segundo plano, ao voltar o
// sistema percebe o tempo passado e encerra do mesmo jeito.
// ------------------------------------------------------------
const SESSAO = { minutos: 10, avisoSegundos: 60, minutosAdm: 30 };

// O ADM apresenta e explica: dez minutos parado acontece sem que a
// sessão esteja abandonada. O prazo maior vale só para ele, e a
// sessão no servidor continua com validade própria de poucas horas.
function minutosDeSessao() {
  return (TOKEN && TOKEN.indexOf('adm-') === 0) ? SESSAO.minutosAdm : SESSAO.minutos;
}
// Conferência frequente: é só comparar dois carimbos de tempo,
// não custa nada e garante que o aviso apareça na hora certa.
const INTERVALO_CONFERE_MS = 5000;
let avisoSessaoAberto = false;

function ultimoUso() {
  try { return parseInt(sessionStorage.getItem('dejep_visto'), 10) || 0; }
  catch (e) { return 0; }
}

function marcarAtividade() {
  if (!TOKEN) return;
  try { sessionStorage.setItem('dejep_visto', String(Date.now())); } catch (e) { /* ok */ }
  if (avisoSessaoAberto) { avisoSessaoAberto = false; fecharModalForcado(); }
}

function conferirSessao() {
  if (!TOKEN) return;
  const limite = minutosDeSessao() * 60000;
  const parado = Date.now() - (ultimoUso() || Date.now());
  if (parado >= limite) { encerrarPorInatividade(); return; }
  if (parado >= limite - SESSAO.avisoSegundos * 1000 && !avisoSessaoAberto) {
    avisarFimDeSessao();
  }
}

function avisarFimDeSessao() {
  avisoSessaoAberto = true;
  abrirModal('A sua sessão vai encerrar',
    'Por segurança, o acesso é encerrado depois de <strong>' + minutosDeSessao()
    + ' minutos sem uso</strong> — estes computadores são compartilhados.',
    '',
    '<button class="modal-btn perigo" onclick="sair()">Sair agora</button>'
    + '<button class="modal-btn principal" onclick="continuarConectado()">Continuar conectado</button>');
}

function continuarConectado() {
  avisoSessaoAberto = false;
  fecharModalForcado();
  try { sessionStorage.setItem('dejep_visto', String(Date.now())); } catch (e) { /* ok */ }
}

function encerrarPorInatividade() {
  avisoSessaoAberto = false;
  fecharModalForcado();
  guardarToken(''); guardarComo('');
  telaAcesso = 'login'; trocaObrigatoria = false;
  impSel = {}; impMes = null; impObs = ''; impLotes = [];
  if (aba === 'ger') mostrar('ger');
  toast('Sessão encerrada por falta de uso. Entre novamente para gerenciar as suas DEJEPs.', true);
  carregar();
}

const TITULO_ABA = { escala: 'Escala do Mês', lista: 'Lista Corrida',
                     ger: 'Gerenciar as minhas DEJEPs',
                     agenda: 'Lista para Agendamento',
                     stats: 'Estatísticas da DEJEP' };

// O SERVIDOR PRECISA TER PRAZO PARA RESPONDER.
//
// fetch não desiste sozinho: sem limite, uma chamada que trava deixa a
// tela em "Entrando..." indefinidamente, sem erro e sem saída. Foi o
// que aconteceu em 17/11 — o acesso pareceu travado, e a impressão foi
// de que apertar Esc resolveu, quando na verdade a resposta apenas
// chegou naquele instante.
//
// 25 segundos é folgado de propósito: o Apps Script arranca o script
// inteiro a cada chamada e, com o contêiner frio, passa dos 10s. O
// limite não existe para ser atingido no uso normal — existe para que
// o travado vire mensagem em vez de espera eterna.
// 60s, não 25. O primeiro limite cortava antes de a página terminar:
// o relato foi de que o erro aparecia MAIS CEDO do que a carga levava
// quando dava certo. O prazo existe contra o travado, não contra o
// lento — cortar quem ia responder é trocar espera por erro.
var ESPERA_MAX_MS = 60000;

// ------------------------------------------------------------
// O MÊS JÁ VISTO NÃO SE PEDE DE NOVO
//
// Trocar de aba já não custava chamada nenhuma. Trocar de MÊS custava
// uma inteira, a cada seta: quem olhava novembro, dezembro e voltava a
// novembro pagava três esperas pela mesma informação.
//
// Agora a resposta de cada mês fica guardada NA MEMÓRIA DA PÁGINA
// enquanto ela está aberta, e voltar a um mês já visto é instantâneo —
// nenhuma ida ao servidor.
//
// Memória da página, e não do navegador, de propósito: boa parte do
// acesso é de plantão, em computador compartilhado, e nome e escala de
// colega não ficam guardados na máquina. Fechou a aba, acabou.
//
// A validade é curta porque a Diretoria pode lançar escala enquanto o
// servidor navega. Dois minutos é o bastante para o vai-e-vem entre
// meses e curto para não mostrar escala velha.
//
// A chave é a própria URL: ela já carrega mês, token, 'como' e se o
// pedido inclui estatísticas ou lista de agendamento. Dois pedidos
// diferentes nunca compartilham resposta por engano.
var VALIDADE_CACHE_MS = 120000;
var cacheConsulta = {};

function esquecerConsultas() { cacheConsulta = {}; }

function doCache(url) {
  var g = cacheConsulta[url];
  if (!g) return null;
  if ((Date.now() - g.quando) > VALIDADE_CACHE_MS) { delete cacheConsulta[url]; return null; }
  // Cópia: o resto da página escreve em 'dados' (anoRef, __token), e
  // sem copiar essas escritas iriam para dentro do que está guardado.
  try { return JSON.parse(JSON.stringify(g.dados)); } catch (e) { return null; }
}

function guardarNoCache(url, d) {
  if (!d || d.sucesso === false) return;
  // Só se guarda consulta de verdade, de alguém que entrou e sobre um
  // mês identificado. A resposta anônima ('precisaEntrar') não tem o
  // que reaproveitar, e guardá-la deixava sobra no cache depois de
  // sair — nada vazava, mas a regra "sair esvazia tudo" tem de ser
  // verdadeira sem asterisco.
  if (!TOKEN || d.precisaEntrar || !d.mesChave) return;
  try { cacheConsulta[url] = { dados: JSON.parse(JSON.stringify(d)), quando: Date.now() }; }
  catch (e) { /* payload estranho: segue sem guardar */ }
}

function buscar(url) {
  // PONTO ÚNICO DE INVALIDAÇÃO.
  //
  // Toda chamada que NÃO é consulta muda alguma coisa: declarar ou
  // remover impedimento, cancelar DEJEP, pedir ou responder troca,
  // entrar, sair, trocar de servidor. Qualquer uma delas torna velho
  // o que está guardado, e é aqui que elas todas passam.
  //
  // Está aqui, e não em cada ação, porque em cada ação é questão de
  // tempo alguém esquecer — e esquecer significa mostrar ao servidor
  // uma escala que já mudou.
  if (url.indexOf('acao=consulta') === -1) esquecerConsultas();
  if (typeof AbortController === 'undefined') return fetch(url);
  var ctrl = new AbortController();
  var t = setTimeout(function () { ctrl.abort(); }, ESPERA_MAX_MS);
  return fetch(url, { signal: ctrl.signal }).then(
    function (r) { clearTimeout(t); return r; },
    function (e) {
      clearTimeout(t);
      if (e && e.name === 'AbortError') {
        var err = new Error('demorou');
        err.demorou = true;
        throw err;
      }
      throw e;
    });
}
// A mensagem muda conforme o motivo: demora pede nova tentativa,
// queda de rede pede conferir a conexão.
function motivoDaFalha(e) {
  var s = segundosDeEspera();
  return (e && e.demorou)
    ? ('O servidor não respondeu em ' + s + ' segundos. Tente novamente; '
       + 'se repetir, informe este número à Diretoria.')
    : 'Não foi possível falar com o servidor. Confira a conexão e tente novamente.';
}

// A espera mostra o relógio.
//
// Sem ele, "está demorando" é impressão, e impressão não se diagnostica:
// ninguém sabe dizer se foram 4 segundos ou 40. Com o contador, quem
// está na tela lê o número e o repassa — e o número aponta se o gargalo
// é arranque frio do Apps Script ou outra coisa.
var aguardoTimer = null, aguardoInicio = 0, aguardoTexto = '';
function mostrarAguardo(txt) {
  aguardoTexto = txt || 'Carregando...';
  aguardoInicio = Date.now();
  el('aguardo-txt').textContent = aguardoTexto;
  el('aguardo').classList.add('ativo');
  if (aguardoTimer) clearInterval(aguardoTimer);
  aguardoTimer = setInterval(function () {
    var s = Math.round((Date.now() - aguardoInicio) / 1000);
    // Os primeiros segundos não ganham contador: numa carga normal o
    // número apareceria e sumiria, parecendo defeito.
    el('aguardo-txt').textContent = (s < 3) ? aguardoTexto : (aguardoTexto + ' (' + s + 's)');
  }, 500);
}
function esconderAguardo() {
  if (aguardoTimer) { clearInterval(aguardoTimer); aguardoTimer = null; }
  el('aguardo').classList.remove('ativo');
}
// Quanto durou a última espera, para a mensagem de erro poder dizê-lo.
function segundosDeEspera() {
  return aguardoInicio ? Math.round((Date.now() - aguardoInicio) / 1000) : 0;
}

function mostrar(qual) {
  const vinhaDeOutra = aba !== qual;
  aba = qual;
  ['escala','lista','ger','stats'].forEach(function (k) {
    const b = el('aba-' + k);
    if (b) b.classList.toggle('ativa', qual === k);
  });
  el('card-titulo').textContent = (qual === 'escala' && dados && dados.mes)
    ? 'Escala de ' + dados.mes : TITULO_ABA[qual];
  // A busca por nome só serve às duas primeiras abas
  // Sem nomes na tela não há o que buscar: um campo "buscar por nome"
  // sobre uma lista sem nomes parece defeito.
  render();
  // A gestão recebe a consulta sem as estatísticas, que custam caro e
  // não estão na tela em que ela entra. Ao abrir a aba, busca-as.
  if (qual === 'stats' && vinhaDeOutra && dados
      && dados.estatisticasSobDemanda && !dados.estatisticas) {
    carregar();
  }
  // A lista de lançamento, pelo mesmo motivo: percorre a escala
  // inteira e cruza com o cadastro, e só serve a quem vai lançar.
  if (qual === 'agenda' && vinhaDeOutra && dados
      && dados.agendamentoSobDemanda && !dados.agendamento) {
    carregar();
  }
}

    + '<div style="text-align:center;margin-top:1.2rem;">'
    + '<button class="link-adm" onclick="irParaAcesso(\'adm\')">Acesso de gestão</button>'
    + '</div>';
}

// Qual tela de acesso está em cena. Tudo o que não é painel passa
// por aqui, para que não haja duas portas abertas ao mesmo tempo.
function renderAcesso() {
  if (recToken) return renderDefinirSenha(true);
  if (trocaObrigatoria) return renderDefinirSenha(false);
  if (telaAcesso === 'adm') return renderLoginAdm();
  if (telaAcesso === 'recuperar') return renderRecuperar();
  return renderLogin();
}

// Pedir o link. A resposta do servidor é sempre a mesma, acerte ou

// Definir a senha: pelo link do e-mail (porLink) ou logo após entrar

        '<label class="campo-lbl" for="ds-atual">Senha atual</label>'

    + '<label class="campo-lbl" for="ds-nova">Senha nova ' + btnAjuda('novaSenha') + '</label>'

function pedirLink() {
  const rg = (el('rc-rg') ? el('rc-rg').value : '').trim();
  const email = (el('rc-email') ? el('rc-email').value : '').trim();
  if (!rg) { toast('Informe o seu RG.', true); return; }
  if (email.indexOf('@') === -1) { toast('Informe o e-mail do seu cadastro.', true); return; }

  const botao = el('rc-enviar');
  if (botao) { botao.disabled = true; botao.textContent = 'Enviando...'; }
  mostrarAguardo('Enviando...');
  buscar(URL_BASE + '?acao=recuperar&rg=' + encodeURIComponent(rg)
      + '&email=' + encodeURIComponent(email))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      if (botao) { botao.disabled = false; botao.textContent = 'Enviar o link'; }
      if (j.sucesso) irParaAcesso('login');
    })
    .catch(function () {
      esconderAguardo();
      toast('Não foi possível enviar agora. Tente novamente.', true);
      if (botao) { botao.disabled = false; botao.textContent = 'Enviar o link'; }
    });
}

function salvarSenha(porLink) {
  const nova = el('ds-nova') ? el('ds-nova').value : '';
  const rep  = el('ds-rep') ? el('ds-rep').value : '';
  const atual = el('ds-atual') ? el('ds-atual').value : '';
  if (nova.length < 6) { toast('A senha precisa ter pelo menos 6 caracteres.', true); return; }
  if (nova !== rep) { toast('As duas senhas não são iguais.', true); return; }

  const botao = el('ds-enviar');
  if (botao) { botao.disabled = true; botao.textContent = 'Salvando...'; }
  mostrarAguardo('Salvando...');
  buscar(URL_BASE + '?acao=definir_senha'
      + '&t=' + encodeURIComponent(porLink ? recToken : TOKEN)
      + '&nova=' + encodeURIComponent(nova)
      + '&atual=' + encodeURIComponent(atual))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      if (botao) { botao.disabled = false; botao.textContent = 'Salvar a senha'; }
      if (!j.sucesso) return;
      // Deu certo: limpa o link da URL para que recarregar não tente
      // usá-lo de novo, e entra com o token devolvido.
      recToken = ''; recNome = ''; trocaObrigatoria = false;
      telaAcesso = 'login';
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* ok */ }
      if (j.token) { guardarToken(j.token); marcarAtividade(); }
      mostrar('ger');
      carregar();
    })
    .catch(function () {
      esconderAguardo();
      toast('Não foi possível salvar agora. Tente novamente.', true);
      if (botao) { botao.disabled = false; botao.textContent = 'Salvar a senha'; }
    });
}

// Entrada da Diretoria. Fica atrás de um clique de propósito: não é a

    + '<label class="campo-lbl" for="ad-senha">Senha</label>'

    + '<button class="dp-enviar adm" onclick="entrarAdm()">Entrar</button>'

    + '<div style="text-align:center;margin-top:1.1rem;">'

function irParaAcesso(qual) { telaAcesso = qual; render(); }

function entrarAdm() {
  const u = (el('ad-usuario') ? el('ad-usuario').value : '').trim();
  const senha = (el('ad-senha') ? el('ad-senha').value : '');
  if (!u) { toast('Informe o usuário.', true); return; }
  if (!senha) { toast('Informe a senha.', true); return; }

  mostrarAguardo('Entrando...');
  buscar(URL_BASE + '?acao=entrar_adm&usuario=' + encodeURIComponent(u)
      + '&senha=' + encodeURIComponent(senha))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.sucesso) { esconderAguardo(); toast(j.mensagem, true); return; }
      // O indicador continua de pé: a escala ainda vai ser buscada.
      mostrarAguardo('Abrindo o painel...');
      guardarToken(j.token);
      guardarComo('');
      telaAcesso = 'login';
      marcarAtividade();
      const ehConsultaAgora = !!j.consulta, horas = j.horas;
      mostrar(ehConsultaAgora ? 'stats' : 'ger');
      carregar(function () {
        toast((ehConsultaAgora ? 'Acesso de consulta' : 'Acesso administrativo')
          + ' aberto por ' + horas + ' horas.');
      }, j.dados);
    })
    .catch(function (e) {
      esconderAguardo();
      toast(motivoDaFalha(e), true); });
}

function sairAdm() {
  const t = TOKEN;
  guardarToken(''); guardarComo('');
  telaAcesso = 'login'; trocaObrigatoria = false;
  impSel = {}; impMes = null; impObs = ''; impLotes = [];
  buscar(URL_BASE + '?acao=sair_adm&t=' + encodeURIComponent(t))
    .catch(function () { /* a sessão expira sozinha de todo modo */ });
  carregar();
}

// Escolher o servidor em nome de quem agir
function escolherServidor(rg) {
  guardarComo(rg);
  impSel = {}; impObs = ''; impLotes = [];
  mostrarAguardo('Abrindo o painel...');
  carregar();
}

function trocarDeServidor() {
  guardarComo('');
  impSel = {}; impObs = ''; impLotes = [];
  filtroAdm = '';
  carregar();
}

function renderEscolhaDeServidor() {
  const lista = (dados && dados.servidores) || [];
  const f = filtroAdm.trim().toLowerCase();
  const vis = f
    ? lista.filter(function (s) {
        return s.nome.toLowerCase().indexOf(f) !== -1 ||
               (s.rg || '').toString().replace(/\D/g, '').indexOf(f.replace(/\D/g, '')) === 0 &&
               f.replace(/\D/g, '').length > 0;
      })
    : lista;

  let h = faixaAdm()
    + '<input class="campo-ent" type="text" id="ad-busca" placeholder="Buscar por nome ou RG"'
    + ' value="' + escapar(filtroAdm) + '" oninput="filtrarAdm(this.value)" />'
    + '<div style="font-size:0.74rem;color: var(--texto-3);margin:0.6rem 0 0.9rem;">'
    + vis.length + ' de ' + lista.length + ' servidores</div>';

  if (!vis.length) {
    h += '<div class="empty-msg">Nenhum servidor com esse nome ou RG.</div>';
    return h;
  }

  vis.slice(0, 60).forEach(function (s) {
    const pos = [];
    if (s.posicaoDiurna) pos.push(s.posicaoDiurna + 'º diurna');
    if (s.posicaoNoturna) pos.push(s.posicaoNoturna + 'º noturna');
    h += '<button class="ad-item" onclick="escolherServidor(\'' + escapar(s.rg) + '\')">'
      + '<span class="ad-nome">' + escapar(s.nome) + '</span>'
      + '<span class="ad-det">' + escapar(s.tipoSeg || '') + ' &bull; Turno '
      + escapar(s.turno || '—')
      + (pos.length ? ' &bull; ' + pos.join(', ') : '') + '</span></button>';
  });
  if (vis.length > 60) {
    h += '<div style="font-size:0.74rem;color: var(--texto-3);margin-top:0.6rem;">'
      + 'Mostrando os 60 primeiros. Refine a busca.</div>';
  }
  return h;
}

function filtrarAdm(v) {
  filtroAdm = v;
  const alvo = el('conteudo');
  if (!alvo) return;
  const pos = (el('ad-busca') || {}).selectionStart;
  alvo.innerHTML = renderEscolhaDeServidor();
  const campo = el('ad-busca');
  if (campo) { campo.focus(); try { campo.setSelectionRange(pos, pos); } catch (e) { /* ok */ } }
}

// A faixa roxa que lembra, em toda tela, que quem age é o ADM.
// ============================================================
// ESTATÍSTICAS
//
// Nenhum gráfico de pizza. Em quase todos estes quadros o leitor
// precisa COMPARAR os valores — trocas contra cancelamentos, um posto
// contra outro —, e barras apoiadas na mesma linha de base comparam
// com precisão que fatias de círculo não dão. Onde se trata de um
// inteiro repartido em poucas partes, a barra segmentada mostra a
// divisão de uma vez; onde se trata de uma razão contra um limite,
// o medidor é mais direto que qualquer dos dois.
// ============================================================
const VIZ_CORES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];

// Sem título e sem subtítulo, devolve só o corpo: serve para
// encaixar um gráfico dentro de outro cartão, sem moldura dupla.
function vizCartao(titulo, sub, corpo) {
  if (!titulo && !sub) return corpo;
  return '<div class="viz-cartao">'
    + (titulo ? '<div class="viz-tit">' + escapar(titulo) + '</div>' : '')
    + (sub ? '<div class="viz-sub">' + sub + '</div>' : '')
    + corpo + '</div>';
}

function vizNumero(titulo, valor, sub) {
  return vizCartao(titulo, '', '<div class="viz-num">' + valor + '</div>'
    + (sub ? '<div class="viz-sub" style="margin:4px 0 0;">' + sub + '</div>' : ''));
}

// Barras horizontais ordenadas, uma por item, todas na mesma cor:
// aqui o que importa é o tamanho relativo, e cores diferentes
// sugeririam uma distinção que não existe.
function vizBarras(titulo, sub, itens, cor) {
  if (!itens || !itens.length) {
    return vizCartao(titulo, sub, '<div class="viz-vazio">Nada registrado neste mês.</div>');
  }
  const max = Math.max.apply(null, itens.map(function (i) { return i.valor; })) || 1;
  const corpo = itens.map(function (i) {
    const pc = Math.round(i.valor * 100 / max);
    return '<div class="viz-linha" title="' + escapar(i.rotulo) + ': ' + i.valor + '">'
      + '<div class="viz-rot">' + escapar(i.rotulo) + '</div>'
      + '<div class="viz-trilho"><div class="viz-barra" style="width:'
      + Math.max(pc, i.valor > 0 ? 3 : 0) + '%;background:' + (cor || 'var(--s1)')
      + ';"></div></div>'
      + '<div class="viz-val">' + i.valor + '</div></div>';
  }).join('');
  return vizCartao(titulo, sub, corpo);
}

// Um inteiro repartido. Cada bloco leva o número dentro quando cabe,
// e a legenda nomeia todos — a cor nunca responde sozinha.
function vizSegmentada(titulo, sub, itens) {
  const total = (itens || []).reduce(function (a, i) { return a + i.valor; }, 0);
  if (!total) {
    return vizCartao(titulo, sub, '<div class="viz-vazio">Nada registrado neste mês.</div>');
  }
  const blocos = itens.map(function (i, k) {
    const pc = i.valor * 100 / total;
    return '<span style="width:' + pc + '%;background:' + VIZ_CORES[k % VIZ_CORES.length]
      + ';" title="' + escapar(i.rotulo) + ': ' + i.valor + '">'
      + (pc >= 12 ? i.valor : '') + '</span>';
  }).join('');
  const legenda = itens.map(function (i, k) {
    return '<span class="viz-leg"><span class="viz-ponto" style="background:'
      + VIZ_CORES[k % VIZ_CORES.length] + ';"></span>' + escapar(i.rotulo)
      + ' <strong style="color: var(--texto);">' + i.valor + '</strong></span>';
  }).join('');
  return vizCartao(titulo, sub,
    '<div class="viz-seg">' + blocos + '</div>'
    + '<div class="viz-legenda">' + legenda + '</div>');
}

// Razão contra um limite: quanto do previsto foi coberto.
function vizMedidor(titulo, sub, feito, total) {
  if (!total) {
    return vizCartao(titulo, sub, '<div class="viz-vazio">Nenhuma vaga prevista neste mês.</div>');
  }
  const pc = Math.round(feito * 100 / total);
  const cor = pc >= 100 ? 'var(--s3)' : (pc >= 90 ? 'var(--s1)' : 'var(--s4)');
  return vizCartao(titulo, sub,
    '<div class="viz-num">' + pc + '<small>%</small></div>'
    + '<div class="viz-sub" style="margin:4px 0 9px;">' + feito + ' de ' + total
    + ' vagas previstas</div>'
    + '<div class="viz-trilho" style="height:16px;" title="' + feito + ' de ' + total + '">'
    + '<div class="viz-barra" style="width:' + Math.min(pc, 100)
    + '%;background:' + cor + ';"></div></div>');
}

function vizColunas(titulo, sub, itens) {
  if (!itens || !itens.length) {
    return vizCartao(titulo, sub, '<div class="viz-vazio">Sem dados neste mês.</div>');
  }
  const max = Math.max.apply(null, itens.map(function (i) { return i.valor; })) || 1;
  const cols = itens.map(function (i) {
    return '<div class="viz-col" title="' + escapar(i.rotulo) + ': ' + i.valor
      + ' servidor(es)">'
      + '<div class="viz-col-val">' + i.valor + '</div>'
      + '<div class="viz-col-barra" style="height:' + Math.max(i.valor * 100 / max, 2)
      + '%;background:var(--s1);"></div>'
      + '<div class="viz-col-rot">' + escapar(i.rotulo) + '</div></div>';
  }).join('');
  return vizCartao(titulo, sub, '<div class="viz-cols">' + cols + '</div>');
}

// O acompanhamento da cota ao longo do mês: quanto das 119 já está
// colocado, quanto falta, e se ainda cabe nos dias que restam. É o
// quadro que diz se é hora de agir, e por isso fica no topo.
function vizSaldo(e) {
  const s = e.saldo;
  if (!s) return '';
  const pc = Math.round(s.usadas * 100 / e.cotaTotal);
  const falta = e.cotaTotal - s.usadas;
  const alerta = s.mesCorrente && s.faltam > 0 && !s.cabe;
  const cor = falta === 0 ? 'var(--s3)' : (alerta ? 'var(--s4)' : 'var(--s1)');
  let nota;
  if (!s.mesCorrente) {
    nota = 'Mês fora do corrente: o número é o do que está lançado.';
  } else if (falta === 0) {
    nota = '<strong>Cota fechada.</strong> As ' + e.cotaTotal + ' estão colocadas.';
  } else if (alerta) {
    nota = '<strong style="color: var(--vermelho);">Não cabe mais tudo.</strong> Faltam '
      + s.faltam + ' e só cabem ' + s.capacidade + ' em ' + s.diasDisponiveis
      + ' dia(s) de terça a sexta com antecedência suficiente'
      + (s.ultimoDia ? ' — o último é ' + s.ultimoDia : '') + '. '
      + (s.faltam - s.capacidade) + ' vão se perder se nada for feito.';
  } else if (s.naReta) {
    nota = '<strong>Reta final.</strong> A reserva emergencial não usada ('
      + s.reservaLivre + ') já entrou na conta. Faltam <strong>' + s.faltam
      + '</strong>, e cabem ' + s.capacidade + ' nos ' + s.diasDisponiveis
      + ' dia(s) que restam.';
  } else {
    nota = 'Faltam <strong>' + s.faltam + '</strong> para a meta de ' + s.meta
      + '. A reserva de ' + s.reservaLivre + ' ainda está de pé e entra na conta na '
      + 'reta final do mês. Restam ' + s.diasAteOFim + ' dia(s).';
  }
  return '<div class="viz-cartao" style="margin-bottom:14px;">'
    + '<div class="viz-tit">Saldo da cota</div>'
    + '<div class="viz-num" style="color:' + (alerta ? 'var(--vermelho)' : 'var(--latao)') + ';">'
    + s.usadas + '<small> de ' + e.cotaTotal + '</small></div>'
    + '<div class="viz-sub" style="margin:4px 0 9px;">' + falta
    + ' por colocar até o fim do mês</div>'
    + '<div class="viz-trilho" style="height:16px;" title="' + s.usadas + ' de '
    + e.cotaTotal + '"><div class="viz-barra" style="width:' + Math.min(pc, 100)
    + '%;background:' + cor + ';"></div></div>'
    + '<div class="viz-sub" style="margin:10px 0 0;">' + nota + '</div></div>';
}

function renderEstatisticas() {
  const e = dados && dados.estatisticas;
  // A faixa de perfil acompanha TODA aba: é por ela que a chefia sai,
  // e é o que lembra, em qualquer tela, com qual acesso se está.
  if (!e) {
    return faixaAdm() + barraMes()
      + '<div class="empty-msg">Não há escala lançada neste mês, '
      + 'portanto não há o que medir. Escolha outro mês nas setas acima.</div>';
  }
  const m = e.movimentacoes.filter(function (x) { return x.valor > 0; });
  const totalMov = e.movimentacoes.reduce(function (a, x) { return a + x.valor; }, 0);

  return faixaAdm() + barraMes()
    + '<div class="viz">'

    + '<div class="viz-grade" style="margin-bottom:14px;">'
    + vizNumero('Cota do mês', e.cotaTotal,
        '<strong>' + e.previstas + '</strong> a escalar &bull; <strong>'
        + e.reservaEmergencial + '</strong> reservadas para convocação emergencial')
    + vizNumero('DEJEPs escaladas', e.agendadas,
        e.emAberto ? '<strong style="color: var(--vermelho);">' + e.emAberto
          + ' vaga(s) em aberto</strong>' : 'de ' + e.previstas + ', nenhuma em aberto')
    + vizNumero('Reserva emergencial', e.reservaEmergencial,
        '<strong>' + e.emergenciaisUsadas + '</strong> usada(s) até agora &bull; '
        + Math.max(0, e.reservaEmergencial - e.emergenciaisUsadas) + ' disponível(eis)')
    + vizNumero('Servidores na lista', e.inscritos,
        e.filaDiurna + ' no período diurno &bull; ' + e.filaNoturna + ' no noturno')
    + '</div>'
    + vizSaldo(e)
    + '<div class="viz-cartao" style="margin-bottom:14px;">'
    + '<div class="viz-tit">Como a cota do mês foi fechada</div>'
    + '<div class="viz-sub">Os postos fixos pedem um número que varia com o calendário; '
    + 'a diferença para a cota é cortada ou completada.</div>'
    + vizSegmentada('', '', [
        { rotulo: 'Postos fixos', valor: Math.max(0, e.agendadas - (e.apoio || 0)) },
        { rotulo: 'Apoio carceragem', valor: e.apoio || 0 },
        { rotulo: 'Em aberto', valor: e.emAberto || 0 }
      ].filter(function (x) { return x.valor > 0; }))
    + '<div class="viz-sub" style="margin:10px 0 0;">Os postos pediram <strong>'
    + e.vagasDosPostos + '</strong> vagas neste mês. '
    + (e.suprimidas
        ? '<strong>' + e.suprimidas + '</strong> foram suprimidas no posto das 08h de '
          + 'domingo, para o mês fechar em ' + e.previstas + '.'
        : (e.apoio
            ? 'Faltaram <strong>' + e.apoio + '</strong> para a cota, completadas no '
              + 'Apoio Carceragem, de terça a sexta às 11h.'
            : 'O número bateu com a cota, sem corte nem complemento.'))

function faixaAdm() {
  if (ehConsulta()) {
    return '<div class="faixa-adm faixa-consulta">'
      + '<div class="fa-txt"><strong>Acesso de consulta</strong> &bull; '
      + escapar(dados.gestorUsuario || '') + ' &bull; somente leitura</div>'
      + '<button class="fa-btn sair" onclick="sairAdm()">Sair</button></div>';
  }
  if (!ehAdm()) return '';
  const nome = (dados.eu && dados.eu.nome) ? dados.eu.nome : '';
  return '<div class="faixa-adm">'
    + '<div class="fa-txt"><strong>Acesso administrativo</strong>'
    + (nome
        ? ' &bull; agindo como <strong>' + escapar(nome) + '</strong>'
        : ' &bull; nenhum servidor escolhido')
    + '</div>'
    + (nome
        ? '<button class="fa-btn" onclick="trocarDeServidor()">Trocar de servidor</button>'
        : '')
    + '<button class="fa-btn sair" onclick="sairAdm()">Sair</button></div>';
}

function entrar() {
  const rg = (el('lg-rg') ? el('lg-rg').value : '').trim();
  const senha = (el('lg-senha') ? el('lg-senha').value : '').trim();
  if (!rg) { toast('Informe o seu RG.', true); return; }
  if (!senha) { toast('Informe a sua senha.', true); return; }

  mostrarAguardo('Entrando...');
  buscar(URL_BASE + '?acao=entrar&rg=' + encodeURIComponent(rg)
      + '&senha=' + encodeURIComponent(senha))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.sucesso) { esconderAguardo(); toast(j.mensagem, true); return; }
      guardarToken(j.token);
      marcarAtividade();
      // Entrou com a senha inicial: a troca vem antes de qualquer
      // outra coisa, senão ela nunca acontece.
      if (j.precisaDefinirSenha) {
        esconderAguardo();
        trocaObrigatoria = true;
        recNome = j.primeiroNome || '';
        toast(j.mensagem || 'Defina a sua senha.', true);
        mostrar('ger');
        return;
      }
      mostrarAguardo('Abrindo as suas DEJEPs...');
      const primeiro = j.primeiroNome;
      // Quem entra vem ver as próprias DEJEPs, não a escala geral.
      mostrar('ger');
      // j.dados é a consulta que veio junto com o login. Sem ela a
      // página faria uma segunda chamada para buscar o que o servidor
      // já havia calculado.
      carregar(function () { toast('Bem-vindo, ' + primeiro + '.'); }, j.dados);
    })
    .catch(function (e) {
      esconderAguardo(); toast(motivoDaFalha(e), true); });
}

function sair() {
  guardarToken(''); guardarComo('');
  telaAcesso = 'login'; trocaObrigatoria = false;
  impSel = {}; impMes = null; impObs = ''; impLotes = [];
  carregar();
}

// ------------------------------------------------------------
// Aba "Gerenciar DEJEPs": tudo o que o servidor faz, num lugar só
// ------------------------------------------------------------
// Por que o botão de cancelar está apagado nesta DEJEP.
function motivoSemCancelar(m) {
  const p = (dados && dados.prazos) || { cancelamento: 48, tardio: 24 };
  if (m.horasAte === null || m.horasAte === undefined) {
    return 'O cancelamento pela página exige ' + p.cancelamento + ' horas de antecedência.';
  }
  if (m.horasAte < 0) return 'Esta DEJEP já passou.';
  const falta = 'Faltam ' + m.horasAte + 'h — o cancelamento pela página exige '
    + p.cancelamento + 'h. ';
  return m.tardio
    ? falta + 'Com menos de ' + p.tardio + 'h o aviso é TARDIO e sujeita a penalidade. '
      + 'Procure a Diretoria de Disciplina imediatamente.'
    : falta + 'Procure a Diretoria de Disciplina, que registra e decide — avisando '
      + 'antes de faltarem ' + p.tardio + 'h não há penalidade.';
}

function renderGerenciar() {
  if (!TOKEN) return renderAcesso();
  if (!dados) return '<div class="empty-msg">Carregando os seus dados...</div>';
  // Entrou como ADM e ainda não disse em nome de quem vai agir.
  if (dados.adm && !dados.eu) return renderEscolhaDeServidor();
  if (!dados.eu) {
    return '<div class="aviso-info" style="border-left-color: var(--vermelho);background: var(--vermelho-fundo);'
      + 'color: var(--vermelho);margin-bottom:1rem;">A sua sessão expirou. Entre novamente.</div>'
      + renderAcesso();
  }

  const eu = dados.eu;
  const partes = [];
  if (eu.posicaoDiurna)  partes.push(eu.posicaoDiurna + 'º no período diurno');
  if (eu.posicaoNoturna) partes.push(eu.posicaoNoturna + 'º no período noturno');
  if (!partes.length) partes.push('fora das filas');

  let h = faixaAdm() + barraMes()
    + '<div class="painel' + (ehAdm() ? ' adm' : '') + '" style="margin-bottom:1.3rem;">'
    + '<div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;">'
    + '<div style="flex:1;min-width:170px;">'
    + '<div class="painel-nome">' + escapar(eu.nome) + '</div>'
    + '<div class="painel-pos">' + partes.join(' &nbsp;•&nbsp; ')
    + (eu.soTorre ? ' &bull; somente postos de torre' : '')
    + (eu.genero === 'Feminino' ? ' &bull; posto das 08h e jumbo' : '') + '</div>'
    + '<div style="font-size:0.7rem;color: var(--texto-2);margin-top:4px;">'
    + (ehAdm()
        ? 'Você está agindo <strong>em nome deste servidor</strong>. Tudo o que fizer '
          + 'aqui é avisado a ele por e-mail.'
        : 'O acesso encerra sozinho após ' + minutosDeSessao() + ' minutos sem uso.')
    + '</div></div>'
    + (ehAdm()
        ? '<button class="btn-acao" onclick="trocarDeServidor()">Trocar</button>'
        : '<button class="btn-acao" onclick="sair()">Sair</button>')
    + '</div>';

  if (dados.semEscalaNoMes) {
    h += '<div class="painel-item"><span class="pi-info">'
      + 'Escala de ' + escapar(dados.mes) + ' ainda não lançada. Já dá para declarar '
      + 'impedimento.</span></div>';
  } else if (!dados.minhas.length) {
    h += '<div class="painel-item"><span class="pi-info">'
      + 'Você não tem DEJEP agendada em ' + escapar(dados.mes) + '.</span></div>';
  } else {
    dados.minhas.forEach(function (m) {
      h += '<div class="painel-item">'
        + '<span class="pi-data">' + escapar(m.data) + '</span>'
        + '<span class="pi-info">' + escapar(m.posto) + ' &bull; ' + rotuloHorario(m.horario) + '</span>'
        + '<button class="btn-acao" onclick="abrirTrocaDaMinha(\'' + m.id + '\')">Trocar</button>'
        + '<button class="btn-acao cancelar"' + (m.podeCancelar ? '' : ' disabled')
        + ' onclick="confirmarCancelamento(\'' + m.id + '\')"'
        + (m.podeCancelar ? '' : ' title="' + escapar(motivoSemCancelar(m)) + '"')
        + '>Cancelar</button></div>'
        // Pela Diretoria o botão vale em qualquer prazo, mas o aviso
        // tardio precisa estar à vista de quem clica: é ele que
        // sujeita o servidor a penalidade.
        + ((ehAdm() && m.podeCancelar && m.tardio)
            ? '<div style="font-size:0.7rem;line-height:1.45;margin:-2px 0 6px;'
              + 'color: var(--vermelho);">Faltam ' + m.horasAte + 'h: cancelar aqui será '
              + 'registrado como <strong>aviso tardio</strong>, sujeito a '
              + 'penalidade.</div>'
            : '')
        // Botão apagado sem explicação vira reclamação. O motivo vai
        // escrito ao lado, e com o aviso da penalidade quando o
        // prazo já entrou na faixa tardia.
        + (m.podeCancelar ? '' :
            '<div style="font-size:0.7rem;line-height:1.45;margin:-2px 0 6px;color:'
            + (m.tardio ? 'var(--vermelho)' : 'var(--texto-2)') + ';">'
            + escapar(motivoSemCancelar(m)) + '</div>');
    });
  }

  const totalCompat = (dados.escala || []).reduce(function (s, i) {
    return s + ((i.trocaCom || []).length ? 1 : 0);
  }, 0);
  // Uma linha, não um parágrafo: quantas trocas há e onde ler a regra.
  if (dados.minhas.length) {
    h += '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;'
      + 'font-size:0.76rem;color: var(--texto-2);margin-top:0.8rem;">'
      + (totalCompat === 0
          ? '<span style="color: var(--ambar);font-weight:700;">Nenhuma troca compatível '
            + 'neste mês</span>'
          : '<strong>' + totalCompat + '</strong> para troca neste mês')
      + btnAjuda('troca')
      + '<span style="color: var(--borda-clara);">|</span>'
      + 'Cancelar' + btnAjuda('cancelar')
      + '</div>';
  }
  h += '</div>';

  h += renderSolicitacoes();

  h += '<div class="card-title" style="margin-bottom:0.3rem;">'
    + 'Dias em que não posso ser convocado' + btnAjuda('impedimento') + '</div>';
  return h + renderImpedir();
}

// ------------------------------------------------------------
// Solicitações de troca do mês — dos dois lados
//
// Sem esta seção o servidor fica no escuro: não sabe se o pedido saiu,
// se continua parado ou se foi recusado. E quem recebe um pedido só
// descobre pelo e-mail, que nem sempre chega.
// ------------------------------------------------------------
const SITUACAO_TROCA = {
  'Pendente':       { cor: 'var(--ambar)', fundo: 'var(--ambar-fundo)', texto: 'aguardando resposta' },
  'Aceita':         { cor: 'var(--verde)', fundo: 'var(--verde-fundo)', texto: 'aceita — troca feita' },
  'Recusada':       { cor: 'var(--vermelho)', fundo: 'var(--vermelho-fundo)', texto: 'recusada' },
  'Invalida':       { cor: 'var(--vermelho)', fundo: 'var(--vermelho-fundo)', texto: 'não pôde ser efetivada' },
  'Cancelada':      { cor: 'var(--texto-3)', fundo: 'var(--grafite-alto)', texto: 'cancelada por você' },
  'Falha no envio': { cor: 'var(--vermelho)', fundo: 'var(--vermelho-fundo)', texto: 'o e-mail não foi entregue' }
};

function etiquetaSituacao(sit, textoAlt) {
  const e = SITUACAO_TROCA[sit] || { cor: 'var(--texto-3)', fundo: 'var(--grafite-alto)', texto: sit };
  return '<span style="font-size:0.68rem;font-weight:700;border-radius:5px;padding:2px 8px;'
    + 'white-space:nowrap;background:' + e.fundo + ';color:' + e.cor + ';">'
    + escapar(textoAlt || e.texto) + '</span>';
}

function trechoDejep(d) {
  if (!d) return 'DEJEP de outro mês';
  return escapar(d.data) + ' — ' + escapar(d.posto);
}

        + (r.observacao ? '<div style="font-size:0.76rem;color: var(--vermelho);margin-top:5px;">'
            + escapar(r.observacao) + '</div>' : '')
        + (pendente

  if (s.feitas.length) {

      const pend = r.situacao === 'Pendente';
      h += '<div style="border:1px solid ' + (pend ? 'var(--azul-borda)' : 'var(--borda)') + ';'
        + 'border-radius:10px;padding:0.8rem 0.9rem;margin-bottom:8px;">'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">'

        + (pend

    });
  }
  return h;
