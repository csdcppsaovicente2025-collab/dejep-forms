<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consulta DEJEP — CPP São Vicente</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/6.5.0/css/all.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a2b3c;
min-height: 100vh; padding: 2rem 1rem 4rem; }
.container { max-width: 680px; margin: 0 auto; }
.header { background: #1a3a5c; color: white; border-radius: 14px; padding: 1.25rem 2rem; margin-bottom: 1.5rem; }
.header-inner { display: flex; align-items: center; justify-content: center; gap: 1rem; }
.header-brasao { width: 110px; height: 110px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4)); }
/* Contrapeso do brasão: sem ele o texto ficaria centralizado apenas
   no espaço à direita da imagem, e não no meio do cabeçalho. */
.header-espaco { width: 110px; flex-shrink: 0; }
.header-texto { text-align: center; }
@media (max-width: 560px) {
  .header-inner { flex-direction: column; gap: 0.7rem; }
  .header-espaco { display: none; }
}
.header h1 { font-size: 1rem; font-weight: 800; color: #ffffff; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; line-height: 1.3; }
.header h2 { font-size: 0.82rem; font-weight: 400; color: #a8c4e0; margin-bottom: 4px; }
.header p { font-size: 0.78rem; color: #7aaad0; margin-top: 2px; }
.card { background: white; border-radius: 14px; padding: 1.5rem; margin-bottom: 1.25rem; border: 1px solid #dde4ed; }
.card-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #6b80a0; margin-bottom: 1rem; }
.abas { display: flex; gap: 8px; margin-bottom: 1.25rem; }
.aba { flex: 1; padding: 11px; border: 1px solid #d0d9e6; background: white; color: #1a2b3c;
border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: center;
font-family: inherit; transition: border 0.15s, background 0.15s; }
.aba:hover { border-color: #2d6a9f; }
.aba.ativa { background: #1a3a5c; color: white; border-color: #1a3a5c; }
.busca { width: 100%; border: 1px solid #d0d9e6; border-radius: 8px; padding: 9px 12px;
font-size: 0.95rem; color: #1a2b3c; background: white; outline: none; margin-bottom: 1.25rem; font-family: inherit; }
.busca:focus { border-color: #2d6a9f; }
.busca::placeholder { color: #aab8c8; }
.tabela-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th { background: #2d6a9f; color: white; padding: 9px 8px; text-align: left; font-weight: 600; white-space: nowrap; }
th:first-child { border-radius: 8px 0 0 0; }
th:last-child { border-radius: 0 8px 0 0; }
td { padding: 9px 8px; border-bottom: 1px solid #eef1f5; }
tr:last-child td { border-bottom: none; }
tbody tr:nth-child(even) { background: #f7f9fc; }
.pos { display: inline-block; min-width: 28px; text-align: center; background: #1a3a5c; color: white;
border-radius: 6px; padding: 2px 6px; font-size: 0.78rem; font-weight: 700; }
.pos.topo { background: #1e7a46; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* Coluna de contagem: o cabeçalho é largo e o número é curto, então
   os dois centralizados é o único jeito de ficarem na mesma prumada. */
.centro, th.centro { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 5px; background: #ead1dc; color: #7a2348; font-weight: 700; }
.empty-msg { text-align: center; color: #8fa3ba; font-size: 0.88rem; padding: 1.5rem 1rem; line-height: 1.6; }
.aviso-info { background: #eef4fb; border-left: 4px solid #2d6a9f; border-radius: 8px;
padding: 0.85rem 1rem; font-size: 0.8rem; color: #45617f; line-height: 1.55; margin-bottom: 1.25rem; }
.rodape { margin-top: 1.5rem; text-align: center; }
.rodape span { display: inline-block; color: #ffffff; font-size: 12.2px; font-weight: 700;
background: #1a3a5c; border-radius: 6px; padding: 0.5rem 1ch;
/* Crédito discreto: mesmas cores, menos presença na página. */
opacity: 0.5; }

.cal-mes { text-align: center; font-weight: 700; font-size: 1.05rem; color: #1a3a5c;
margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
.cal-semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
.cal-dia-sem { text-align: center; font-size: 0.68rem; font-weight: 700; color: #6b80a0;
text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 0; }
.cal-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-cel { border: 1px solid #dde4ed; border-radius: 8px; background: white; padding: 4px 3px;
min-height: 62px; display: flex; flex-direction: column; gap: 2px; }
.cal-cel.vazia { border: none; background: transparent; }
.cal-cel.fds { background: #f7f9fc; }
.cal-cel.sem-escala { background: #fafbfc; border-style: dashed; }
.cal-cel.hoje { border-color: #2d6a9f; border-width: 2px; }
.cal-num { font-size: 0.72rem; font-weight: 700; color: #45617f; text-align: center; line-height: 1.2; }
.cal-item { font-size: 0.58rem; line-height: 1.25; border-radius: 4px; padding: 2px 3px;
color: #1a2b3c; overflow: hidden; }
.cal-item.apagado { opacity: 0.22; }
.cal-hora { font-weight: 700; }
.cal-item.h07 { background: #d9ead3; }
.cal-item.h11 { background: #fce5cd; }
.cal-item.h23 { background: #cfe2f3; }
.cal-item.h10 { background: #ead1dc; }
.cal-item.h22 { background: #e0d4ea; }
.cal-legenda { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
margin-top: 0.9rem; font-size: 0.7rem; color: #6b80a0; }
.cal-legenda span { display: flex; align-items: center; gap: 4px; }
.cal-legenda .pt { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.cal-legenda .pt.h07 { background: #d9ead3; } .cal-legenda .pt.h11 { background: #fce5cd; }
.cal-legenda .pt.h23 { background: #cfe2f3; } .cal-legenda .pt.h10 { background: #ead1dc; }
.cal-legenda .pt.h22 { background: #e0d4ea; }
@media (max-width: 560px) {
  .cal-cel { min-height: 52px; padding: 3px 2px; }
  .cal-item { font-size: 0.5rem; }
}

/* ---- Painel pessoal e ações ---- */
.painel { background: #1a3a5c; color: #fff; border-radius: 12px; padding: 1.1rem 1.25rem;
margin-bottom: 1.25rem; }
.painel-nome { font-size: 1rem; font-weight: 700; }
.painel-pos { font-size: 0.8rem; color: #a8c4e0; margin-top: 2px; }
.painel-item { background: rgba(255,255,255,0.08); border-radius: 8px; padding: 0.6rem 0.75rem;
margin-top: 0.6rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.painel-item .pi-data { font-weight: 700; font-size: 0.9rem; min-width: 62px; }
.painel-item .pi-info { font-size: 0.8rem; color: #c8dcf0; flex: 1; min-width: 120px; }
.btn-acao { border: 0; border-radius: 6px; padding: 6px 11px; font-size: 0.76rem;
font-weight: 700; cursor: pointer; background: #ffffff; color: #1a3a5c; }
.btn-acao.cancelar { background: #e8a0a0; color: #6a1515; }
.btn-acao:disabled { background: #7a8fa5; color: #dde4ed; cursor: not-allowed; }
.dia-bloco { border: 1px solid #dde4ed; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.dia-cab { background: #f0f4f8; padding: 7px 12px; font-size: 0.8rem; font-weight: 700;
color: #1a3a5c; display: flex; justify-content: space-between; }
.dia-cab .dia-fds { color: #a0522d; }
.linha-dejep { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
border-top: 1px solid #eef1f5; font-size: 0.85rem; }
.linha-dejep .ld-hora { font-weight: 700; color: #1a3a5c; min-width: 42px; }
.linha-dejep .ld-posto { font-size: 0.72rem; color: #6b80a0; min-width: 96px; }
.linha-dejep .ld-nome { flex: 1; min-width: 110px; }
.linha-dejep.minha { background: #eef7ee; }
.linha-dejep.clicavel { cursor: pointer; }
.linha-dejep.clicavel:hover { background: #f5f9fd; }
.linha-dejep .ld-vaga { color: #a02020; font-weight: 700; }
.linha-dejep .ld-oculto { color: #a8b4c2; font-style: italic; font-weight: 400; }
.modal-fundo { position: fixed; inset: 0; background: rgba(12,26,44,0.55); display: none;
align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
.modal-fundo.ativo { display: flex; }
.modal-cx { background: #fff; border-radius: 14px; padding: 1.5rem; max-width: 420px; width: 100%; }
.modal-tit { font-size: 1rem; font-weight: 700; color: #1a3a5c; margin-bottom: 0.4rem; }
.modal-sub { font-size: 0.84rem; color: #5a6e8a; line-height: 1.5; margin-bottom: 1rem; }
.modal-opt { display: block; width: 100%; text-align: left; border: 1px solid #d0d9e6;
background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 7px;
font-size: 0.85rem; cursor: pointer; color: #1a2b3c; }
.modal-opt:hover { border-color: #2d6a9f; background: #f5f9fd; }
.modal-acoes { display: flex; gap: 8px; margin-top: 0.75rem; }
.modal-btn { flex: 1; border: 0; border-radius: 8px; padding: 10px; font-size: 0.85rem;
font-weight: 700; cursor: pointer; background: #e8edf3; color: #45617f; }
.modal-btn.principal { background: #1a3a5c; color: #fff; }
.modal-btn.perigo { background: #a02020; color: #fff; }
/* Resposta a um pedido de troca, dentro do cartão. Mesma aparência dos
   botões do aviso, classe própria: são outro lugar e outra função. */
.btn-resp { flex: 1; border: 0; border-radius: 8px; padding: 10px; font-size: 0.85rem;
font-weight: 700; cursor: pointer; background: #e8edf3; color: #45617f; }
.btn-resp.aceitar { background: #1a3a5c; color: #fff; }
/* Retirar o próprio pedido é ação de desfazer: vermelha e cheia, para
   não se perder no cinza do cartão. Vem sozinha na linha, longe de
   "Aceitar" e "Recusar", que ficam nos pedidos recebidos. */
.btn-resp.perigo { background: #c0392b; color: #fff; }
.btn-resp.perigo:hover { background: #a93226; }
/* Indicador de carregamento no centro da tela. No telefone, um aviso
   no rodapé passa despercebido — e o servidor clica de novo. */
.aguardo { position: fixed; inset: 0; background: rgba(12,26,44,0.55); display: none;
align-items: center; justify-content: center; z-index: 80; padding: 1rem; }
.aguardo.ativo { display: flex; }
.aguardo-cx { background: #fff; border-radius: 14px; padding: 1.6rem 2rem; text-align: center;
box-shadow: 0 6px 26px rgba(0,0,0,0.3); max-width: 300px; }
.aguardo-roda { width: 42px; height: 42px; margin: 0 auto 0.9rem; border-radius: 50%;
border: 4px solid #dde4ed; border-top-color: #1a3a5c; animation: girar 0.9s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.aguardo-txt { font-size: 0.9rem; font-weight: 600; color: #1a3a5c; }
@media (prefers-reduced-motion: reduce) { .aguardo-roda { animation-duration: 2.4s; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px;
background: #1a3a5c; color: #fff; padding: 12px 18px; border-radius: 10px;
font-size: 0.85rem; max-width: 92%; z-index: 60; display: none; box-shadow: 0 4px 18px rgba(0,0,0,0.25); }
.toast.erro { background: #a02020; }

/* ---- Impedimentos ---- */
.imp-sec { border-top: 1px solid rgba(255,255,255,0.18); margin-top: 0.9rem; padding-top: 0.8rem; }
.imp-tit { font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
letter-spacing: 0.06em; color: #8fb4d8; margin-bottom: 0.5rem; }
.imp-item { background: rgba(255,255,255,0.08); border-radius: 8px; padding: 0.5rem 0.7rem;
margin-bottom: 0.4rem; display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
font-size: 0.8rem; }
.imp-item .ii-per { font-weight: 700; white-space: nowrap; }
.imp-item .ii-mot { color: #c8dcf0; flex: 1; min-width: 100px; }
.imp-pend { font-size: 0.66rem; font-weight: 700; background: #e0b040; color: #4a3600;
border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
.imp-vazio { font-size: 0.78rem; color: #a8c4e0; line-height: 1.5; margin-bottom: 0.5rem; }
.btn-imp { border: 1px dashed rgba(255,255,255,0.45); background: transparent; color: #fff;
border-radius: 8px; padding: 8px 12px; font-size: 0.78rem; font-weight: 700;
cursor: pointer; width: 100%; font-family: inherit; }
.btn-imp:hover { border-style: solid; background: rgba(255,255,255,0.08); }
.campo-lbl { display: block; font-size: 0.74rem; font-weight: 700; color: #45617f;
text-transform: uppercase; letter-spacing: 0.05em; margin: 0.7rem 0 0.25rem; }
.campo-ent { width: 100%; border: 1px solid #d0d9e6; border-radius: 8px; padding: 9px 11px;
font-size: 0.9rem; font-family: inherit; color: #1a2b3c; background: #fff; outline: none; }
.campo-ent:focus { border-color: #2d6a9f; }
.campo-dupla { display: flex; gap: 8px; }
.campo-dupla > div { flex: 1; }

/* ---- Calendário de impedimentos ---- */
/* Seletor do mês de referência, no topo das abas. */
.barra-mes { display: flex; align-items: center; gap: 10px; background: #fff;
border: 1px solid #dde4ed; border-radius: 10px; padding: 8px 10px; margin-bottom: 1.1rem; }
.barra-mes button { border: 1px solid #d0d9e6; background: #fff; color: #1a3a5c;
border-radius: 8px; width: 40px; height: 40px; font-size: 1.15rem; cursor: pointer;
font-family: inherit; flex-shrink: 0; }
.barra-mes button:hover:not(:disabled) { border-color: #2d6a9f; background: #f5f9fd; }
.barra-mes button:disabled { color: #ccd5e0; cursor: not-allowed; }
.bm-centro { flex: 1; text-align: center; min-width: 0; }
.bm-mes { font-size: 1rem; font-weight: 700; color: #1a3a5c; }
.bm-sub { font-size: 0.68rem; color: #8fa3ba; margin-top: 1px; }
.dp-nav { display: flex; align-items: center; justify-content: space-between;
margin-bottom: 0.8rem; gap: 8px; }
.dp-nav button { border: 1px solid #d0d9e6; background: #fff; color: #1a3a5c;
border-radius: 8px; width: 38px; height: 38px; font-size: 1rem; cursor: pointer;
font-family: inherit; flex-shrink: 0; }
.dp-nav button:hover:not(:disabled) { border-color: #2d6a9f; background: #f5f9fd; }
.dp-nav button:disabled { color: #ccd5e0; cursor: not-allowed; }
.dp-mes { flex: 1; text-align: center; font-weight: 700; font-size: 0.98rem;
color: #1a3a5c; text-transform: uppercase; letter-spacing: 0.04em; }
.dp-sem { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 5px; }
.dp-sem span { text-align: center; font-size: 0.66rem; font-weight: 700; color: #6b80a0;
text-transform: uppercase; letter-spacing: 0.04em; }
.dp-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.dp-dia { min-height: 46px; border: 1px solid #dde4ed; border-radius: 8px; background: #fff;
display: flex; flex-direction: column; align-items: center; justify-content: center;
font-size: 0.9rem; font-weight: 600; color: #1a2b3c; cursor: pointer; position: relative;
font-family: inherit; padding: 0; line-height: 1; }
.dp-dia:hover:not(:disabled) { border-color: #2d6a9f; background: #f5f9fd; }
.dp-dia.fora { visibility: hidden; }
.dp-dia:disabled { cursor: not-allowed; }
.dp-dia.passada { color: #c8d2de; background: #fafbfc; border-style: dashed; }
.dp-dia.marcada { background: #1a3a5c; border-color: #1a3a5c; color: #fff; }
.dp-dia.declarada { background: #fff2cc; border-color: #e0b040; color: #7a5800; }
.dp-dia.declarada.pendente { background: #fdf6e3; border-style: dashed; }
.dp-dia.em-lote { background: #dcece0; border-color: #4a8a62; color: #2c6442;
font-weight: 700; }
.dp-dia.hoje { box-shadow: inset 0 0 0 2px #2d6a9f; }
.dp-dejep { position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%;
background: #1e7a46; }
.dp-dia.marcada .dp-dejep { background: #ffd8a0; }
.dp-leg { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
margin-top: 0.9rem; font-size: 0.7rem; color: #6b80a0; }
.dp-leg span { display: flex; align-items: center; gap: 5px; }
.dp-leg i.pt { width: 12px; height: 12px; border-radius: 4px; display: inline-block;
border: 1px solid #dde4ed; }
.dp-resumo { background: #eef4fb; border-left: 4px solid #2d6a9f; border-radius: 8px;
padding: 0.8rem 1rem; margin: 1rem 0 0; font-size: 0.82rem; color: #1a3a5c; line-height: 1.55; }
.dp-resumo.vazio { background: #f7f9fc; border-left-color: #c0ccd8; color: #6b80a0; }
.dp-resumo.alerta { background: #fde8e8; border-left-color: #a02020; color: #7a1a1a; }
.dp-atalhos { display: flex; gap: 8px; margin-top: 0.8rem; flex-wrap: wrap; }
.dp-atalhos button { flex: 1; min-width: 130px; border: 1px solid #d0d9e6; background: #fff;
color: #45617f; border-radius: 8px; padding: 9px; font-size: 0.78rem; font-weight: 600;
cursor: pointer; font-family: inherit; }
.dp-atalhos button:hover { border-color: #2d6a9f; color: #1a3a5c; }
.dp-enviar { width: 100%; border: 0; border-radius: 9px; padding: 13px; margin-top: 1rem;
background: #1a3a5c; color: #fff; font-size: 0.92rem; font-weight: 700; cursor: pointer;
font-family: inherit; }
.dp-enviar:disabled { background: #c0ccd8; cursor: not-allowed; }
.dp-enviar.adm { background: #5e3a80; }
/* ---- Gráficos da aba de estatísticas ----
   Paleta conferida com o validador de contraste e de daltonismo:
   as cinco cores passam na banda de luminosidade, no piso de croma,
   na separação sob deuteranopia e no contraste contra o branco.
   Cada série também vai rotulada — cor sozinha nunca carrega a
   identidade. */
.viz { --s1:#2d6a9f; --s2:#9c6b12; --s3:#0f8f6b; --s4:#c0392b; --s5:#7c58ab;
  --neutro:#8fa3ba; --trilho:#e8edf3; }
.viz-grade { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.viz-cartao { border: 1px solid #dde4ed; border-radius: 12px; padding: 0.9rem 1rem; background: #fff; }
.viz-tit { font-size: 0.74rem; font-weight: 700; color: #1a3a5c; text-transform: uppercase;
  letter-spacing: 0.04em; margin-bottom: 2px; }
.viz-sub { font-size: 0.72rem; color: #8fa3ba; margin-bottom: 10px; line-height: 1.4; }
.viz-num { font-size: 2.1rem; font-weight: 700; color: #1a3a5c; line-height: 1.1;
  font-variant-numeric: tabular-nums; }
.viz-num small { font-size: 0.9rem; font-weight: 600; color: #6b80a0; }
.viz-linha { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.viz-rot { font-size: 0.78rem; color: #45617f; width: 47%; flex: none;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viz-trilho { flex: 1; height: 13px; background: var(--trilho); border-radius: 4px; overflow: hidden; }
.viz-barra { height: 100%; border-radius: 4px; min-width: 2px; }
.viz-val { font-size: 0.8rem; font-weight: 700; color: #1a3a5c; width: 34px;
  text-align: right; flex: none; font-variant-numeric: tabular-nums; }
/* Barra segmentada: 2px de respiro entre os blocos, para que dois
   vizinhos não se leiam como um só. */
.viz-seg { display: flex; height: 26px; border-radius: 5px; overflow: hidden;
  background: var(--trilho); gap: 2px; }
.viz-seg > span { display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; font-weight: 700; color: #fff; min-width: 2px; }
.viz-legenda { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 9px; }
.viz-leg { display: flex; align-items: center; gap: 6px; font-size: 0.74rem; color: #45617f; }
.viz-ponto { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.viz-cols { display: flex; align-items: flex-end; gap: 6px; height: 104px; margin-top: 4px; }
.viz-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
  align-items: center; gap: 4px; height: 100%; }
.viz-col-barra { width: 100%; border-radius: 4px 4px 0 0; min-height: 2px; }
.viz-col-rot { font-size: 0.68rem; color: #6b80a0; white-space: nowrap; }
.viz-col-val { font-size: 0.72rem; font-weight: 700; color: #1a3a5c; }
.viz-vazio { font-size: 0.8rem; color: #8fa3ba; padding: 6px 0; }
/* Verde, e não o roxo do administrativo: a cor da faixa é o aviso
   mais rápido de qual perfil está aberto. Precisa vir com as duas
   classes para vencer a regra de .faixa-adm. */
.faixa-adm.faixa-consulta { background: #1f5133; }

.link-adm { border: 0; background: none; color: #6b80a0; font-size: 0.8rem;
text-decoration: underline; cursor: pointer; font-family: inherit; padding: 6px; }
.link-adm:hover { color: #1a3a5c; }
/* Roxo em toda parte administrativa: a cor é o aviso de que o que
   está na tela é a DEJEP de outra pessoa. */
.faixa-adm { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
background: #5e3a80; color: #fff; border-radius: 10px; padding: 0.7rem 0.9rem;
margin-bottom: 1rem; font-size: 0.82rem; }
.fa-txt { flex: 1; min-width: 150px; line-height: 1.45; }
.fa-btn { border: 1px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.1);
color: #fff; border-radius: 7px; padding: 6px 12px; font-size: 0.76rem; font-weight: 600;
cursor: pointer; font-family: inherit; }
.fa-btn:hover { background: rgba(255,255,255,0.22); }
.fa-btn.sair { border-color: rgba(255,255,255,0.8); }
.painel.adm { box-shadow: inset 0 0 0 2px #5e3a80; }
.ad-item { display: block; width: 100%; text-align: left; border: 1px solid #dde4ed;
background: #fff; border-radius: 9px; padding: 0.7rem 0.9rem; margin-bottom: 7px;
cursor: pointer; font-family: inherit; }
.ad-item:hover { border-color: #5e3a80; background: #faf7fd; }
.ad-nome { display: block; font-weight: 700; font-size: 0.88rem; color: #1a3a5c; }
.ad-det { display: block; font-size: 0.74rem; color: #6b80a0; margin-top: 3px; }
.dp-add { width: 100%; border: 1px dashed #4a8a62; border-radius: 9px; padding: 11px;
margin-top: 1rem; background: #f3f9f5; color: #2c6442; font-size: 0.84rem; font-weight: 700;
cursor: pointer; font-family: inherit; }
.dp-add:hover:not(:disabled) { background: #e7f3eb; }
.dp-add:disabled { border-color: #d7dee6; background: #fafbfc; color: #a8b4c2;
cursor: not-allowed; }
.dp-lotes { margin-top: 1.1rem; border: 1px solid #cfe0d5; border-radius: 10px;
background: #f7fbf8; padding: 0.85rem 0.9rem; }
.dp-lotes-tit { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
color: #2c6442; font-weight: 700; margin-bottom: 0.6rem; }
.dp-lote { position: relative; display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
background: #fff; border: 1px solid #dce7e0; border-radius: 8px;
padding: 0.55rem 2rem 0.55rem 0.7rem; margin-bottom: 6px; }
.dp-lote-mot { font-weight: 700; font-size: 0.82rem; color: #2c6442; white-space: nowrap; }
.dp-lote-dias { flex: 1; min-width: 130px; font-size: 0.79rem; color: #45617f; }
.dp-lote-obs { width: 100%; font-size: 0.73rem; color: #8a99ab; font-style: italic; }
.dp-lote-x { position: absolute; top: 4px; right: 4px; border: 0; background: none;
color: #a0adbc; font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 2px 6px;
font-family: inherit; }
.dp-lote-x:hover { color: #a02020; }
.dp-lotes-pe { font-size: 0.74rem; color: #2c6442; margin-top: 0.5rem; }
.aba-curta { display: none; }
@media (max-width: 560px) {
  .aba-longa { display: none; }
  .aba-curta { display: inline; }
  .aba { padding: 11px 4px; font-size: 0.84rem; }
  .dp-dia { font-size: 0.82rem; }
}
</style>

<script>
// ============================================================
// CONSULTA DA ESCALA DEJEP — CPP SÃO VICENTE
//
// Sem token, a página é somente leitura. Com o token pessoal que
// vai no e-mail de agendamento, o servidor passa a poder solicitar
// troca e cancelar as próprias DEJEPs. O token nunca é exibido.
// ============================================================
const URL_BASE = 'https://script.google.com/macros/s/AKfycbwtHE6r5r2nOhK8po1JfLVJBYbf_CKjsJY1Gsp8E88EwWDYJ-CJW110GITNZDR3HS9oXQ/exec';

// ============================================================
// DIAGNÓSTICO DE VELOCIDADE — abra a página com ?diag=1
//
// "Está lento" não se conserta por palpite. Com ?diag=1 a página
// mostra, num quadro no canto, cada chamada feita ao servidor, quanto
// ela levou de ponta a ponta e quanto DISSO o servidor gastou
// calculando. A diferença entre as duas é viagem pela internet mais o
// arranque do Apps Script, que nenhum conserto no código alcança.
//
// Mostra também a versão implantada. Colar o código no editor não
// muda o que o /exec responde: só uma nova implantação muda. Se a
// versão aqui não for a esperada, o servidor no ar ainda é o antigo.
// ============================================================
const DIAG = /[?&]diag=1/.test(location.search);
const diagChamadas = [];

if (DIAG) {
  const fetchOriginal = window.fetch.bind(window);
  window.fetch = function (url) {
    const t0 = (window.performance && performance.now) ? performance.now() : Date.now();
    const acao = (String(url).match(/acao=([a-z_]+)/) || [, '?'])[1];
    const marcar = function (j) {
      const t1 = (window.performance && performance.now) ? performance.now() : Date.now();
      diagChamadas.push({
        acao: acao + (String(url).indexOf('stats=1') !== -1 ? ' +stats' : ''),
        total: Math.round(t1 - t0),
        servidor: (j && typeof j.tempoMs === 'number') ? j.tempoMs : null,
        versao: (j && j.versao) || '',
        bytes: j ? JSON.stringify(j).length : 0
      });
      desenharDiag();
    };
    return fetchOriginal.apply(null, arguments).then(function (r) {
      try {
        r.clone().json().then(marcar).catch(function () { marcar(null); });
      } catch (e) { marcar(null); }
      return r;
    }, function (e) { marcar(null); throw e; });
  };
}

function desenharDiag() {
  if (!DIAG || !document.body) return;
  let cx = document.getElementById('diag');
  if (!cx) {
    cx = document.createElement('div');
    cx.id = 'diag';
    cx.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:9999;max-width:330px;'
      + 'background:#1a3a5c;color:#fff;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;'
      + 'padding:10px 12px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35)';
    document.body.appendChild(cx);
  }
  const versoes = diagChamadas.map(function (c) { return c.versao; })
    .filter(function (v) { return v; });
  const v = versoes.length ? versoes[versoes.length - 1] : '(não informada)';
  const somaT = diagChamadas.reduce(function (a, c) { return a + c.total; }, 0);
  const somaS = diagChamadas.reduce(function (a, c) {
    return a + (c.servidor || 0); }, 0);
  cx.innerHTML = '<div style="font-weight:700;margin-bottom:6px">Diagnóstico</div>'
    + '<div style="color:#a8c4e0">versão no ar: <b style="color:#fff">' + v + '</b></div>'
    + '<div style="color:#a8c4e0;margin-bottom:6px">'
    + diagChamadas.length + ' chamada(s) · ' + somaT + ' ms, sendo '
    + somaS + ' ms de servidor</div>'
    + diagChamadas.map(function (c) {
        const fora = (c.servidor === null) ? '?' : (c.total - c.servidor);
        return '<div>' + c.acao + ': <b>' + c.total + ' ms</b>'
          + ' <span style="color:#a8c4e0">(' + (c.servidor === null ? '?' : c.servidor)
          + ' servidor + ' + fora + ' rede) · '
          + Math.round(c.bytes / 1024) + ' KB</span></div>';
      }).join('');
}

// A identificação vem do login por RG e senha, guardada enquanto a
// aba do navegador estiver aberta. O link pessoal antigo, que ainda
// circula em e-mails já enviados, continua valendo.
let TOKEN = (new URLSearchParams(location.search).get('t') || '').trim();
if (!TOKEN) {
  try { TOKEN = sessionStorage.getItem('dejep_token') || ''; } catch (e) { TOKEN = ''; }
}
function guardarToken(t) {
  TOKEN = t || '';
  try {
    if (TOKEN) sessionStorage.setItem('dejep_token', TOKEN);
    else sessionStorage.removeItem('dejep_token');
  } catch (e) { /* navegador sem armazenamento: vale só nesta visita */ }
}

// ------------------------------------------------------------
// ACESSO ADMINISTRATIVO
//
// A Diretoria de Disciplina entra com usuário e senha próprios e
// escolhe em nome de QUAL servidor vai agir. O RG escolhido viaja em
// 'como' em toda chamada; o token pessoal do servidor nunca sai do
// servidor. A faixa no alto da tela existe para que não se esqueça
// de que o que está na tela é a DEJEP de outra pessoa.
// ------------------------------------------------------------
let admComo = '';
try { admComo = sessionStorage.getItem('dejep_adm_como') || ''; } catch (e) { admComo = ''; }

function guardarComo(rg) {
  admComo = (rg || '').toString();
  try {
    if (admComo) sessionStorage.setItem('dejep_adm_como', admComo);
    else sessionStorage.removeItem('dejep_adm_como');
  } catch (e) { /* idem */ }
}

// Sufixo que acompanha toda chamada feita em nome de alguém.
function comoParam() {
  return admComo ? '&como=' + encodeURIComponent(admComo) : '';
}

function ehAdm() { return !!(dados && dados.adm); }
// Perfil de consulta da chefia: lê tudo, não age em nada.
function ehConsulta() { return !!(dados && dados.consulta); }
function ehGestao() { return ehAdm() || ehConsulta(); }

// Quando a escala vem sem nomes, a tela tem de dizer por quê. Sem
// este aviso, a página parece defeituosa e o servidor conclui que
// não foi escalado.
function avisoEntrar() {
  if (!dados || !dados.precisaEntrar) return '';
  return '<div class="aviso-info" style="margin-bottom:1.1rem;">'
    + '<strong>Entre para ver os nomes.</strong><br>'
    + 'A escala mostra qual servidor está em qual posto e em que horário. '
    + 'Por segurança do efetivo, esses nomes aparecem apenas para quem se identifica. '
    + 'As datas, os postos e os horários continuam à vista. '
    + 'Use a aba <strong>Gerenciar DEJEPs</strong> para entrar com o seu RG e a sua senha.'
    + '</div>';
}

// ------------------------------------------------------------
// SESSÃO — encerra sozinha depois de um tempo sem uso
//
// Os computadores da unidade são compartilhados. Sem isto, o servidor
// que esquece de sair deixa a própria escala aberta para quem sentar
// em seguida, com poder de cancelar e trocar DEJEP em nome dele.
//
// A contagem é por CARIMBO DE TEMPO, não por temporizador: se a
// máquina hibernar ou a aba ficar em segundo plano, ao voltar o
// sistema percebe o tempo passado e encerra do mesmo jeito.
// ------------------------------------------------------------
const SESSAO = { minutos: 10, avisoSegundos: 60, minutosAdm: 30 };

// O ADM apresenta e explica: dez minutos parado acontece sem que a
// sessão esteja abandonada. O prazo maior vale só para ele, e a
// sessão no servidor continua com validade própria de poucas horas.
function minutosDeSessao() {
  return (TOKEN && TOKEN.indexOf('adm-') === 0) ? SESSAO.minutosAdm : SESSAO.minutos;
}
// Conferência frequente: é só comparar dois carimbos de tempo,
// não custa nada e garante que o aviso apareça na hora certa.
const INTERVALO_CONFERE_MS = 5000;
let avisoSessaoAberto = false;

function ultimoUso() {
  try { return parseInt(sessionStorage.getItem('dejep_visto'), 10) || 0; }
  catch (e) { return 0; }
}

function marcarAtividade() {
  if (!TOKEN) return;
  try { sessionStorage.setItem('dejep_visto', String(Date.now())); } catch (e) { /* ok */ }
  if (avisoSessaoAberto) { avisoSessaoAberto = false; fecharModalForcado(); }
}

function conferirSessao() {
  if (!TOKEN) return;
  const limite = minutosDeSessao() * 60000;
  const parado = Date.now() - (ultimoUso() || Date.now());
  if (parado >= limite) { encerrarPorInatividade(); return; }
  if (parado >= limite - SESSAO.avisoSegundos * 1000 && !avisoSessaoAberto) {
    avisarFimDeSessao();
  }
}

function avisarFimDeSessao() {
  avisoSessaoAberto = true;
  abrirModal('A sua sessão vai encerrar',
    'Por segurança, o acesso é encerrado depois de <strong>' + minutosDeSessao()
    + ' minutos sem uso</strong> — estes computadores são compartilhados.',
    '',
    '<button class="modal-btn perigo" onclick="sair()">Sair agora</button>'
    + '<button class="modal-btn principal" onclick="continuarConectado()">Continuar conectado</button>');
}

function continuarConectado() {
  avisoSessaoAberto = false;
  fecharModalForcado();
  try { sessionStorage.setItem('dejep_visto', String(Date.now())); } catch (e) { /* ok */ }
}

function encerrarPorInatividade() {
  avisoSessaoAberto = false;
  fecharModalForcado();
  guardarToken(''); guardarComo('');
  telaAcesso = 'login'; trocaObrigatoria = false;
  impSel = {}; impMes = null; impObs = ''; impLotes = [];
  if (aba === 'ger') mostrar('ger');

function el(id) { return document.getElementById(id); }

function escapar(t) {
  return String(t === null || t === undefined ? '' : t).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

function rotuloHorario(h) {
  const m = { '07h':'07h às 15h','08h':'08h às 16h','11h':'11h às 19h',
              '23h':'23h às 07h' };
  return m[h] || h;
}

function toast(msg, erro) {
  const t = el('toast');
  t.textContent = msg;
  t.className = 'toast' + (erro ? ' erro' : '');
  t.style.display = 'block';
  clearTimeout(t._tm);
  t._tm = setTimeout(function () { t.style.display = 'none'; }, 6000);
}

function esconderAguardo() { el('aguardo').classList.remove('ativo'); }

function mostrar(qual) {

  aba = qual;
  ['escala','lista','ger','stats'].forEach(function (k) {

  el('card-titulo').textContent = (qual === 'escala' && dados && dados.mes)
    ? 'Escala de ' + dados.mes : TITULO_ABA[qual];
  // A busca por nome só serve às duas primeiras abas
  // Sem nomes na tela não há o que buscar: um campo "buscar por nome"

  render();
  // A gestão recebe a consulta sem as estatísticas, que custam caro e

  if (qual === 'stats' && vinhaDeOutra && dados

function pedirLink() {
  const rg = (el('rc-rg') ? el('rc-rg').value : '').trim();
  const email = (el('rc-email') ? el('rc-email').value : '').trim();
  if (!rg) { toast('Informe o seu RG.', true); return; }
  if (email.indexOf('@') === -1) { toast('Informe o e-mail do seu cadastro.', true); return; }

  const botao = el('rc-enviar');
  if (botao) { botao.disabled = true; botao.textContent = 'Enviando...'; }
  mostrarAguardo('Enviando...');
  fetch(URL_BASE + '?acao=recuperar&rg=' + encodeURIComponent(rg)
      + '&email=' + encodeURIComponent(email))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      if (botao) { botao.disabled = false; botao.textContent = 'Enviar o link'; }
      if (j.sucesso) irParaAcesso('login');
    })
    .catch(function () {
      esconderAguardo();
      toast('Não foi possível enviar agora. Tente novamente.', true);
      if (botao) { botao.disabled = false; botao.textContent = 'Enviar o link'; }
    });
}

function salvarSenha(porLink) {
  const nova = el('ds-nova') ? el('ds-nova').value : '';
  const rep  = el('ds-rep') ? el('ds-rep').value : '';
  const atual = el('ds-atual') ? el('ds-atual').value : '';
  if (nova.length < 6) { toast('A senha precisa ter pelo menos 6 caracteres.', true); return; }
  if (nova !== rep) { toast('As duas senhas não são iguais.', true); return; }

  const botao = el('ds-enviar');
  if (botao) { botao.disabled = true; botao.textContent = 'Salvando...'; }
  mostrarAguardo('Salvando...');
  fetch(URL_BASE + '?acao=definir_senha'
      + '&t=' + encodeURIComponent(porLink ? recToken : TOKEN)
      + '&nova=' + encodeURIComponent(nova)
      + '&atual=' + encodeURIComponent(atual))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      if (botao) { botao.disabled = false; botao.textContent = 'Salvar a senha'; }
      if (!j.sucesso) return;
      // Deu certo: limpa o link da URL para que recarregar não tente
      // usá-lo de novo, e entra com o token devolvido.
      recToken = ''; recNome = ''; trocaObrigatoria = false;
      telaAcesso = 'login';
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* ok */ }
      if (j.token) { guardarToken(j.token); marcarAtividade(); }
      mostrar('ger');
      carregar();
    })
    .catch(function () {
      esconderAguardo();
      toast('Não foi possível salvar agora. Tente novamente.', true);
      if (botao) { botao.disabled = false; botao.textContent = 'Salvar a senha'; }
    });
}

    h += '<div class="empty-msg">Nenhum servidor com esse nome ou RG.</div>';

  vis.slice(0, 60).forEach(function (s) {

    if (s.posicaoNoturna) pos.push(s.posicaoNoturna + 'º noturna');

      + '<span class="ad-det">' + escapar(s.tipoSeg || '') + ' &bull; Turno '

    h += '<div style="font-size:0.74rem;color:#6b80a0;margin-top:0.6rem;">'
      + 'Mostrando os 60 primeiros. Refine a busca.</div>';

// A faixa roxa que lembra, em toda tela, que quem age é o ADM.
// ============================================================
// ESTATÍSTICAS
//
// Nenhum gráfico de pizza. Em quase todos estes quadros o leitor
// precisa COMPARAR os valores — trocas contra cancelamentos, um posto
// contra outro —, e barras apoiadas na mesma linha de base comparam
// com precisão que fatias de círculo não dão. Onde se trata de um
// inteiro repartido em poucas partes, a barra segmentada mostra a
// divisão de uma vez; onde se trata de uma razão contra um limite,
// o medidor é mais direto que qualquer dos dois.
// ============================================================
const VIZ_CORES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];

// Sem título e sem subtítulo, devolve só o corpo: serve para
// encaixar um gráfico dentro de outro cartão, sem moldura dupla.
function vizCartao(titulo, sub, corpo) {
  if (!titulo && !sub) return corpo;
  return '<div class="viz-cartao">'
    + (titulo ? '<div class="viz-tit">' + escapar(titulo) + '</div>' : '')
    + (sub ? '<div class="viz-sub">' + sub + '</div>' : '')
    + corpo + '</div>';
}

function vizNumero(titulo, valor, sub) {
  return vizCartao(titulo, '', '<div class="viz-num">' + valor + '</div>'
    + (sub ? '<div class="viz-sub" style="margin:4px 0 0;">' + sub + '</div>' : ''));
}

// Barras horizontais ordenadas, uma por item, todas na mesma cor:
// aqui o que importa é o tamanho relativo, e cores diferentes
// sugeririam uma distinção que não existe.
function vizBarras(titulo, sub, itens, cor) {
  if (!itens || !itens.length) {
    return vizCartao(titulo, sub, '<div class="viz-vazio">Nada registrado neste mês.</div>');
  }
  const max = Math.max.apply(null, itens.map(function (i) { return i.valor; })) || 1;
  const corpo = itens.map(function (i) {
    const pc = Math.round(i.valor * 100 / max);
    return '<div class="viz-linha" title="' + escapar(i.rotulo) + ': ' + i.valor + '">'
      + '<div class="viz-rot">' + escapar(i.rotulo) + '</div>'
      + '<div class="viz-trilho"><div class="viz-barra" style="width:'
      + Math.max(pc, i.valor > 0 ? 3 : 0) + '%;background:' + (cor || 'var(--s1)')
      + ';"></div></div>'
      + '<div class="viz-val">' + i.valor + '</div></div>';
  }).join('');
  return vizCartao(titulo, sub, corpo);
}

// Um inteiro repartido. Cada bloco leva o número dentro quando cabe,
// e a legenda nomeia todos — a cor nunca responde sozinha.
function vizSegmentada(titulo, sub, itens) {
  const total = (itens || []).reduce(function (a, i) { return a + i.valor; }, 0);
  if (!total) {
    return vizCartao(titulo, sub, '<div class="viz-vazio">Nada registrado neste mês.</div>');
  }
  const blocos = itens.map(function (i, k) {
    const pc = i.valor * 100 / total;
    return '<span style="width:' + pc + '%;background:' + VIZ_CORES[k % VIZ_CORES.length]
      + ';" title="' + escapar(i.rotulo) + ': ' + i.valor + '">'
      + (pc >= 12 ? i.valor : '') + '</span>';
  }).join('');
  const legenda = itens.map(function (i, k) {
    return '<span class="viz-leg"><span class="viz-ponto" style="background:'
      + VIZ_CORES[k % VIZ_CORES.length] + ';"></span>' + escapar(i.rotulo)
      + ' <strong style="color:#1a3a5c;">' + i.valor + '</strong></span>';
  }).join('');
  return vizCartao(titulo, sub,
    '<div class="viz-seg">' + blocos + '</div>'
    + '<div class="viz-legenda">' + legenda + '</div>');
}

// Razão contra um limite: quanto do previsto foi coberto.
function vizMedidor(titulo, sub, feito, total) {
  if (!total) {
    return vizCartao(titulo, sub, '<div class="viz-vazio">Nenhuma vaga prevista neste mês.</div>');
  }
  const pc = Math.round(feito * 100 / total);
  const cor = pc >= 100 ? 'var(--s3)' : (pc >= 90 ? 'var(--s1)' : 'var(--s4)');
  return vizCartao(titulo, sub,
    '<div class="viz-num">' + pc + '<small>%</small></div>'
    + '<div class="viz-sub" style="margin:4px 0 9px;">' + feito + ' de ' + total
    + ' vagas previstas</div>'
    + '<div class="viz-trilho" style="height:16px;" title="' + feito + ' de ' + total + '">'
    + '<div class="viz-barra" style="width:' + Math.min(pc, 100)
    + '%;background:' + cor + ';"></div></div>');
}

function vizColunas(titulo, sub, itens) {
  if (!itens || !itens.length) {
    return vizCartao(titulo, sub, '<div class="viz-vazio">Sem dados neste mês.</div>');
  }
  const max = Math.max.apply(null, itens.map(function (i) { return i.valor; })) || 1;
  const cols = itens.map(function (i) {
    return '<div class="viz-col" title="' + escapar(i.rotulo) + ': ' + i.valor
      + ' servidor(es)">'
      + '<div class="viz-col-val">' + i.valor + '</div>'
      + '<div class="viz-col-barra" style="height:' + Math.max(i.valor * 100 / max, 2)
      + '%;background:var(--s1);"></div>'
      + '<div class="viz-col-rot">' + escapar(i.rotulo) + '</div></div>';
  }).join('');
  return vizCartao(titulo, sub, '<div class="viz-cols">' + cols + '</div>');
}

// O acompanhamento da cota ao longo do mês: quanto das 119 já está
// colocado, quanto falta, e se ainda cabe nos dias que restam. É o
// quadro que diz se é hora de agir, e por isso fica no topo.
function vizSaldo(e) {
  const s = e.saldo;
  if (!s) return '';
  const pc = Math.round(s.usadas * 100 / e.cotaTotal);
  const falta = e.cotaTotal - s.usadas;
  const alerta = s.mesCorrente && s.faltam > 0 && !s.cabe;
  const cor = falta === 0 ? 'var(--s3)' : (alerta ? 'var(--s4)' : 'var(--s1)');
  let nota;
  if (!s.mesCorrente) {
    nota = 'Mês fora do corrente: o número é o do que está lançado.';
  } else if (falta === 0) {
    nota = '<strong>Cota fechada.</strong> As ' + e.cotaTotal + ' estão colocadas.';
  } else if (alerta) {
    nota = '<strong style="color:#8a2020;">Não cabe mais tudo.</strong> Faltam '
      + s.faltam + ' e só cabem ' + s.capacidade + ' em ' + s.diasDisponiveis
      + ' dia(s) de terça a sexta com antecedência suficiente'
      + (s.ultimoDia ? ' — o último é ' + s.ultimoDia : '') + '. '
      + (s.faltam - s.capacidade) + ' vão se perder se nada for feito.';
  } else if (s.naReta) {
    nota = '<strong>Reta final.</strong> A reserva emergencial não usada ('
      + s.reservaLivre + ') já entrou na conta. Faltam <strong>' + s.faltam
      + '</strong>, e cabem ' + s.capacidade + ' nos ' + s.diasDisponiveis
      + ' dia(s) que restam.';
  } else {
    nota = 'Faltam <strong>' + s.faltam + '</strong> para a meta de ' + s.meta
      + '. A reserva de ' + s.reservaLivre + ' ainda está de pé e entra na conta na '
      + 'reta final do mês. Restam ' + s.diasAteOFim + ' dia(s).';
  }
  return '<div class="viz-cartao" style="margin-bottom:14px;">'
    + '<div class="viz-tit">Saldo da cota</div>'
    + '<div class="viz-num" style="color:' + (alerta ? '#8a2020' : '#1a3a5c') + ';">'
    + s.usadas + '<small> de ' + e.cotaTotal + '</small></div>'
    + '<div class="viz-sub" style="margin:4px 0 9px;">' + falta
    + ' por colocar até o fim do mês</div>'
    + '<div class="viz-trilho" style="height:16px;" title="' + s.usadas + ' de '
    + e.cotaTotal + '"><div class="viz-barra" style="width:' + Math.min(pc, 100)
    + '%;background:' + cor + ';"></div></div>'
    + '<div class="viz-sub" style="margin:10px 0 0;">' + nota + '</div></div>';
}

function renderEstatisticas() {
  const e = dados && dados.estatisticas;
  // A faixa de perfil acompanha TODA aba: é por ela que a chefia sai,
  // e é o que lembra, em qualquer tela, com qual acesso se está.
  if (!e) {
    return faixaAdm() + barraMes()
      + '<div class="empty-msg">Não há escala lançada neste mês, '
      + 'portanto não há o que medir. Escolha outro mês nas setas acima.</div>';
  }
  const m = e.movimentacoes.filter(function (x) { return x.valor > 0; });
  const totalMov = e.movimentacoes.reduce(function (a, x) { return a + x.valor; }, 0);

  return faixaAdm() + barraMes()
    + '<div class="viz">'

    + '<div class="viz-grade" style="margin-bottom:14px;">'
    + vizNumero('Cota do mês', e.cotaTotal,
        '<strong>' + e.previstas + '</strong> a escalar &bull; <strong>'
        + e.reservaEmergencial + '</strong> reservadas para convocação emergencial')
    + vizNumero('DEJEPs escaladas', e.agendadas,
        e.emAberto ? '<strong style="color:#8a2020;">' + e.emAberto
          + ' vaga(s) em aberto</strong>' : 'de ' + e.previstas + ', nenhuma em aberto')
    + vizNumero('Reserva emergencial', e.reservaEmergencial,
        '<strong>' + e.emergenciaisUsadas + '</strong> usada(s) até agora &bull; '
        + Math.max(0, e.reservaEmergencial - e.emergenciaisUsadas) + ' disponível(eis)')
    + vizNumero('Servidores na lista', e.inscritos,
        e.filaDiurna + ' no período diurno &bull; ' + e.filaNoturna + ' no noturno')
    + '</div>'
    + vizSaldo(e)
    + '<div class="viz-cartao" style="margin-bottom:14px;">'
    + '<div class="viz-tit">Como a cota do mês foi fechada</div>'
    + '<div class="viz-sub">Os postos fixos pedem um número que varia com o calendário; '
    + 'a diferença para a cota é cortada ou completada.</div>'
    + vizSegmentada('', '', [
        { rotulo: 'Postos fixos', valor: Math.max(0, e.agendadas - (e.apoio || 0)) },
        { rotulo: 'Apoio carceragem', valor: e.apoio || 0 },
        { rotulo: 'Em aberto', valor: e.emAberto || 0 }
      ].filter(function (x) { return x.valor > 0; }))
    + '<div class="viz-sub" style="margin:10px 0 0;">Os postos pediram <strong>'
    + e.vagasDosPostos + '</strong> vagas neste mês. '
    + (e.suprimidas
        ? '<strong>' + e.suprimidas + '</strong> foram suprimidas no posto das 08h de '
          + 'domingo, para o mês fechar em ' + e.previstas + '.'
        : (e.apoio
            ? 'Faltaram <strong>' + e.apoio + '</strong> para a cota, completadas no '
              + 'Apoio Carceragem, de terça a sexta às 11h.'
            : 'O número bateu com a cota, sem corte nem complemento.'))
    + '</div></div>'
    + '<div class="viz-grade" style="margin-bottom:14px;">'
    + vizNumero('Movimentações no mês', totalMov,
        'trocas, cancelamentos, faltas, reconvocações e emergenciais')
    + vizNumero('Impedimentos no mês', e.impedimentos,
        e.servidoresComImpedimento + ' servidor(es) declararam dias indisponíveis')
    + '</div>'

    + '<div class="viz-grade">'
    + vizMedidor('Cobertura das vagas',
        'Quanto do previsto foi efetivamente preenchido.',
        e.agendadas, e.previstas)
    + vizBarras('Movimentações',
        'O que mexeu na escala depois de gerada.', m, 'var(--s1)')
    + vizSegmentada('Pedidos de troca',
        e.solicitacoesTotal + ' pedido(s) no mês, por desfecho.', e.solicitacoes)
    + vizBarras('DEJEPs por posto',
        'Onde as vagas foram abertas.', e.porPosto, 'var(--s1)')
    + vizSegmentada('Por período',
        'Como as DEJEPs se repartem entre o diurno e o noturno.', e.porPeriodo)
    + vizSegmentada('Por tipo de segurança',
        'Quantas DEJEPs couberam a cada grupo.', e.porSeguranca)
    + vizColunas('Distribuição entre os servidores',
        'Quantos servidores ficaram com cada quantidade de DEJEPs. '
        + (e.zerados ? '<strong>' + e.zerados + '</strong> ficaram sem nenhuma.'
                     : 'Nenhum ficou sem DEJEP.'), e.faixas)
    + '</div></div>';
}

function faixaAdm() {
  if (ehConsulta()) {
    return '<div class="faixa-adm faixa-consulta">'
      + '<div class="fa-txt"><strong>Acesso de consulta</strong> &bull; '
      + escapar(dados.gestorUsuario || '') + ' &bull; somente leitura</div>'
      + '<button class="fa-btn sair" onclick="sairAdm()">Sair</button></div>';
  }
  if (!ehAdm()) return '';
  const nome = (dados.eu && dados.eu.nome) ? dados.eu.nome : '';
  return '<div class="faixa-adm">'
    + '<div class="fa-txt"><strong>Acesso administrativo</strong>'
    + (nome
        ? ' &bull; agindo como <strong>' + escapar(nome) + '</strong>'
        : ' &bull; nenhum servidor escolhido')
    + '</div>'
    + (nome
        ? '<button class="fa-btn" onclick="trocarDeServidor()">Trocar de servidor</button>'
        : '')
    + '<button class="fa-btn sair" onclick="sairAdm()">Sair</button></div>';
}

function entrar() {
  const rg = (el('lg-rg') ? el('lg-rg').value : '').trim();
  const senha = (el('lg-senha') ? el('lg-senha').value : '').trim();
  if (!rg) { toast('Informe o seu RG.', true); return; }
  if (!senha) { toast('Informe a sua senha.', true); return; }

  mostrarAguardo('Entrando...');
  fetch(URL_BASE + '?acao=entrar&rg=' + encodeURIComponent(rg)
      + '&senha=' + encodeURIComponent(senha))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.sucesso) { esconderAguardo(); toast(j.mensagem, true); return; }
      guardarToken(j.token);
      marcarAtividade();
      // Entrou com a senha inicial: a troca vem antes de qualquer
      // outra coisa, senão ela nunca acontece.
      if (j.precisaDefinirSenha) {
        esconderAguardo();
        trocaObrigatoria = true;
        recNome = j.primeiroNome || '';
        toast(j.mensagem || 'Defina a sua senha.', true);
        mostrar('ger');
        return;
      }
      mostrarAguardo('Abrindo as suas DEJEPs...');
      const primeiro = j.primeiroNome;
      // Quem entra vem ver as próprias DEJEPs, não a escala geral.
      mostrar('ger');
      // j.dados é a consulta que veio junto com o login. Sem ela a
      // página faria uma segunda chamada para buscar o que o servidor
      // já havia calculado.
      carregar(function () { toast('Bem-vindo, ' + primeiro + '.'); }, j.dados);
    })
    .catch(function () {
      esconderAguardo(); toast('Não foi possível entrar agora. Tente novamente.', true); });
}

function sair() {
  guardarToken(''); guardarComo('');
  telaAcesso = 'login'; trocaObrigatoria = false;
  impSel = {}; impMes = null; impObs = ''; impLotes = [];
  carregar();
}

// ------------------------------------------------------------
// Aba "Gerenciar DEJEPs": tudo o que o servidor faz, num lugar só
// ------------------------------------------------------------
// Por que o botão de cancelar está apagado nesta DEJEP.
function motivoSemCancelar(m) {
  const p = (dados && dados.prazos) || { cancelamento: 48, tardio: 24 };
  if (m.horasAte === null || m.horasAte === undefined) {
    return 'O cancelamento pela página exige ' + p.cancelamento + ' horas de antecedência.';
  }
  if (m.horasAte < 0) return 'Esta DEJEP já passou.';
  const falta = 'Faltam ' + m.horasAte + 'h — o cancelamento pela página exige '
    + p.cancelamento + 'h. ';
  return m.tardio
    ? falta + 'Com menos de ' + p.tardio + 'h o aviso é TARDIO e sujeita a penalidade. '
      + 'Procure a Diretoria de Disciplina imediatamente.'
    : falta + 'Procure a Diretoria de Disciplina, que registra e decide — avisando '
      + 'antes de faltarem ' + p.tardio + 'h não há penalidade.';
}

function renderGerenciar() {
  if (!TOKEN) return renderAcesso();
  if (!dados) return '<div class="empty-msg">Carregando os seus dados...</div>';
  // Entrou como ADM e ainda não disse em nome de quem vai agir.
  if (dados.adm && !dados.eu) return renderEscolhaDeServidor();
  if (!dados.eu) {
    return '<div class="aviso-info" style="border-left-color:#a02020;background:#fde8e8;'
      + 'color:#7a1a1a;margin-bottom:1rem;">A sua sessão expirou. Entre novamente.</div>'
      + renderAcesso();
  }

  const eu = dados.eu;
  const partes = [];
  if (eu.posicaoDiurna)  partes.push(eu.posicaoDiurna + 'º no período diurno');
  if (eu.posicaoNoturna) partes.push(eu.posicaoNoturna + 'º no período noturno');
  if (!partes.length) partes.push('fora das filas');

  let h = faixaAdm() + barraMes()
    + '<div class="painel' + (ehAdm() ? ' adm' : '') + '" style="margin-bottom:1.3rem;">'
    + '<div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;">'
    + '<div style="flex:1;min-width:170px;">'
    + '<div class="painel-nome">' + escapar(eu.nome) + '</div>'
    + '<div class="painel-pos">' + partes.join(' &nbsp;•&nbsp; ')
    + (eu.soTorre ? ' &bull; somente postos de torre' : '')
    + (eu.genero === 'Feminino' ? ' &bull; posto das 08h e jumbo' : '') + '</div>'
    + '<div style="font-size:0.7rem;color:#8fb4d8;margin-top:4px;">'
    + (ehAdm()
        ? 'Você está agindo <strong>em nome deste servidor</strong>. Tudo o que fizer '
          + 'aqui é avisado a ele por e-mail.'
        : 'O acesso encerra sozinho após ' + minutosDeSessao() + ' minutos sem uso.')
    + '</div></div>'
    + (ehAdm()
        ? '<button class="btn-acao" onclick="trocarDeServidor()">Trocar</button>'
        : '<button class="btn-acao" onclick="sair()">Sair</button>')
    + '</div>';

  if (dados.semEscalaNoMes) {
    h += '<div class="painel-item"><span class="pi-info">'
      + 'A escala de ' + escapar(dados.mes) + ' ainda não foi lançada. Você já pode '
      + 'declarar os dias em que não poderá ser convocado — a declaração vale quando a '
      + 'escala for gerada.</span></div>';
  } else if (!dados.minhas.length) {
    h += '<div class="painel-item"><span class="pi-info">'
      + 'Você não tem DEJEP agendada em ' + escapar(dados.mes) + '.</span></div>';
  } else {
    dados.minhas.forEach(function (m) {
      h += '<div class="painel-item">'
        + '<span class="pi-data">' + escapar(m.data) + '</span>'
        + '<span class="pi-info">' + escapar(m.posto) + ' &bull; ' + rotuloHorario(m.horario) + '</span>'
        + '<button class="btn-acao" onclick="abrirTrocaDaMinha(\'' + m.id + '\')">Trocar</button>'
        + '<button class="btn-acao cancelar"' + (m.podeCancelar ? '' : ' disabled')
        + ' onclick="confirmarCancelamento(\'' + m.id + '\')"'
        + (m.podeCancelar ? '' : ' title="' + escapar(motivoSemCancelar(m)) + '"')
        + '>Cancelar</button></div>'
        // Pela Diretoria o botão vale em qualquer prazo, mas o aviso
        // tardio precisa estar à vista de quem clica: é ele que
        // sujeita o servidor a penalidade.
        + ((ehAdm() && m.podeCancelar && m.tardio)
            ? '<div style="font-size:0.7rem;line-height:1.45;margin:-2px 0 6px;'
              + 'color:#ffb4a0;">Faltam ' + m.horasAte + 'h: cancelar aqui será '
              + 'registrado como <strong>aviso tardio</strong>, sujeito a '
              + 'penalidade.</div>'
            : '')
        // Botão apagado sem explicação vira reclamação. O motivo vai
        // escrito ao lado, e com o aviso da penalidade quando o
        // prazo já entrou na faixa tardia.
        + (m.podeCancelar ? '' :
            '<div style="font-size:0.7rem;line-height:1.45;margin:-2px 0 6px;color:'
            + (m.tardio ? '#ffb4a0' : '#8fb4d8') + ';">'
            + escapar(motivoSemCancelar(m)) + '</div>');
    });
  }

  const totalCompat = (dados.escala || []).reduce(function (s, i) {
    return s + ((i.trocaCom || []).length ? 1 : 0);
  }, 0);
  h += '<div style="font-size:0.74rem;color:#8fb4d8;margin-top:0.7rem;line-height:1.5;">';
  if (dados.minhas.length && totalCompat === 0) {
    h += '<strong style="color:#ffd8a0;">Nenhuma troca compatível neste mês.</strong> '
      + 'As demais DEJEPs esbarram no intervalo mínimo de descanso em relação ao seu '
      + 'plantão, no posto ou na composição da vaga. ';
  } else if (dados.minhas.length) {
    h += 'Há <strong>' + totalCompat + '</strong> DEJEPs compatíveis para troca, marcadas '
      + 'com "trocar" na aba Escala do Mês. As incompatíveis aparecem sem o link. ';
  }
  const pz = dados.prazos || { cancelamento: 48, tardio: 24 };
  h += 'O cancelamento pela página exige <strong>' + pz.cancelamento
    + ' horas</strong> de antecedência e <strong>não altera a sua posição</strong> na '
    + 'lista. Abaixo desse prazo, procure a Diretoria de Disciplina: com menos de '
    + '<strong>' + pz.tardio + ' horas</strong> o aviso é considerado tardio e '
    + 'sujeita o servidor a penalidade.</div></div>';

  h += renderSolicitacoes();

  h += '<div class="card-title" style="margin-bottom:0.3rem;">'
    + 'Dias em que não posso ser convocado</div>';
  return h + renderImpedir();
}

// ------------------------------------------------------------
// Solicitações de troca do mês — dos dois lados
//
// Sem esta seção o servidor fica no escuro: não sabe se o pedido saiu,
// se continua parado ou se foi recusado. E quem recebe um pedido só
// descobre pelo e-mail, que nem sempre chega.
// ------------------------------------------------------------
const SITUACAO_TROCA = {
  'Pendente':       { cor: '#8a6d1a', fundo: '#fff8e0', texto: 'aguardando resposta' },
  'Aceita':         { cor: '#276221', fundo: '#eef7ee', texto: 'aceita — troca feita' },
  'Recusada':       { cor: '#8a2020', fundo: '#fde8e8', texto: 'recusada' },
  'Invalida':       { cor: '#8a2020', fundo: '#fde8e8', texto: 'não pôde ser efetivada' },
  'Cancelada':      { cor: '#45617f', fundo: '#eef1f5', texto: 'cancelada por você' },
  'Falha no envio': { cor: '#8a2020', fundo: '#fde8e8', texto: 'o e-mail não foi entregue' }
};

function etiquetaSituacao(sit, textoAlt) {
  const e = SITUACAO_TROCA[sit] || { cor: '#45617f', fundo: '#eef1f5', texto: sit };
  return '<span style="font-size:0.68rem;font-weight:700;border-radius:5px;padding:2px 8px;'
    + 'white-space:nowrap;background:' + e.fundo + ';color:' + e.cor + ';">'
    + escapar(textoAlt || e.texto) + '</span>';
}

function trechoDejep(d) {
  if (!d) return 'DEJEP de outro mês';
  return escapar(d.data) + ' — ' + escapar(d.posto);
}

function renderSolicitacoes() {
  const s = dados.solicitacoes || { feitas: [], recebidas: [] };
  if (!s.feitas.length && !s.recebidas.length) return '';

  let h = '<div class="card-title" style="margin:1.6rem 0 0.5rem;">'
    + 'Solicitações de troca deste mês</div>';

  if (s.recebidas.length) {
    h += '<div style="font-size:0.78rem;font-weight:700;color:#1a3a5c;margin-bottom:0.4rem;">'
      + 'Pedidos que você recebeu</div>';
    s.recebidas.forEach(function (r) {
      const pendente = r.situacao === 'Pendente';
      h += '<div style="border:1px solid ' + (pendente ? '#e0b040' : '#dde4ed') + ';'
        + 'border-radius:10px;padding:0.8rem 0.9rem;margin-bottom:8px;'
        + (pendente ? 'background:#fffdf5;' : '') + '">'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">'
        + '<strong style="font-size:0.88rem;color:#1a3a5c;">' + escapar(r.outro) + '</strong>'
        + etiquetaSituacao(r.situacao, pendente ? 'aguardando a sua resposta' : null)
        + '</div>'
        + '<div style="font-size:0.82rem;color:#45617f;line-height:1.6;">'
        + 'Ele assumiria a sua DEJEP de <strong>' + trechoDejep(r.minha) + '</strong><br>'
        + 'e você ficaria com a dele de <strong>' + trechoDejep(r.dele) + '</strong></div>'
        + (r.observacao ? '<div style="font-size:0.76rem;color:#8a2020;margin-top:5px;">'
            + escapar(r.observacao) + '</div>' : '')
        + (pendente
            ? '<div style="display:flex;gap:8px;margin-top:0.7rem;">'
              + '<button class="btn-resp"'
              + ' onclick="confirmarResposta(\'' + r.id + '\',\'nao\')">Recusar</button>'
              + '<button class="btn-resp aceitar"'
              + ' onclick="confirmarResposta(\'' + r.id + '\',\'sim\')">Aceitar a troca</button>'
              + '</div>'
            : '<div style="font-size:0.72rem;color:#8fa3ba;margin-top:5px;">respondida em '
              + escapar(r.respondidaEm || '—') + '</div>')
        + '</div>';
    });
  }

  if (s.feitas.length) {
    h += '<div style="font-size:0.78rem;font-weight:700;color:#1a3a5c;'
      + 'margin:' + (s.recebidas.length ? '1rem' : '0') + ' 0 0.4rem;">'
      + 'Pedidos que você fez</div>';
    s.feitas.forEach(function (r) {
      const pend = r.situacao === 'Pendente';
      h += '<div style="border:1px solid ' + (pend ? '#cfdcea' : '#dde4ed') + ';'
        + 'border-radius:10px;padding:0.8rem 0.9rem;margin-bottom:8px;">'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">'
        + '<strong style="font-size:0.88rem;color:#1a3a5c;">' + escapar(r.outro) + '</strong>'
        + etiquetaSituacao(r.situacao) + '</div>'
        + '<div style="font-size:0.82rem;color:#45617f;line-height:1.6;">'
        + 'Você ofereceu a sua DEJEP de <strong>' + trechoDejep(r.minha) + '</strong><br>'
        + 'em troca da dele de <strong>' + trechoDejep(r.dele) + '</strong></div>'
        + (r.observacao ? '<div style="font-size:0.76rem;color:#8a2020;margin-top:5px;">'
            + escapar(r.observacao) + '</div>' : '')
        + '<div style="font-size:0.72rem;color:#8fa3ba;margin-top:5px;">'
        + 'enviado em ' + escapar(r.criadaEm)
        + (r.respondidaEm ? ' &bull; respondido em ' + escapar(r.respondidaEm) : '')
        + (r.situacao === 'Falha no envio'
            ? ' &bull; avise o colega por outro meio ou procure a Diretoria de Disciplina' : '')
        + '</div>'
        // Enquanto ninguém respondeu, o pedido é só um pedido: quem fez
        // pode retirá-lo. Depois do aceite a escala já mudou, e aí não
        // há mais pedido a cancelar.
        + (pend
            ? '<div style="margin-top:0.7rem;">'
              + '<button class="btn-resp perigo"'
              + ' onclick="confirmarCancelarPedido(\'' + r.id + '\')">'
              + '✕ Cancelar este pedido</button></div>'
            : '')
        + '</div>';
    });
  }
  return h;
}

function confirmarCancelarPedido(id) {
  const s = dados.solicitacoes || { feitas: [] };
  const r = s.feitas.find(function (x) { return x.id === id; });
  if (!r) return;
  abrirModal('Cancelar o pedido de troca',
    'O pedido enviado a <strong>' + escapar(r.outro) + '</strong> será retirado.'
    + '<br><br>Você continua com a sua DEJEP de <strong>' + trechoDejep(r.minha)
    + '</strong> e nada muda na escala. '
    + escapar(r.outro) + ' será avisado(a) de que não precisa responder.', '',
    '<button class="modal-btn" onclick="fecharModalForcado()">Voltar</button>'
    + '<button class="modal-btn perigo" onclick="cancelarPedido(\'' + id + '\')">'
    + 'Confirmar cancelamento</button>');
}

function cancelarPedido(id) {
  fecharModalForcado();
  mostrarAguardo('Cancelando o pedido...');
  fetch(URL_BASE + '?acao=cancelar_solicitacao&t=' + encodeURIComponent(TOKEN)
      + comoParam() + '&s=' + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      carregar();
    })
    .catch(function () {
      esconderAguardo();
      toast('Não foi possível cancelar o pedido. Tente de novo.', true);
    });
}

function confirmarResposta(id, resposta) {
  const s = dados.solicitacoes || { recebidas: [] };
  const r = s.recebidas.find(function (x) { return x.id === id; });
  if (!r) return;

  if (resposta !== 'sim') {
    abrirModal('Recusar a troca',
      'A escala permanece como está e <strong>' + escapar(r.outro)
      + '</strong> será avisado(a).', '',
      '<button class="modal-btn" onclick="fecharModalForcado()">Voltar</button>'
      + '<button class="modal-btn perigo" onclick="responderTroca(\'' + id + '\',\'nao\')">'
      + 'Confirmar recusa</button>');
    return;
  }
  abrirModal('Aceitar a troca',
    'Você passa a cumprir <strong>' + trechoDejep(r.dele) + '</strong> e '
    + escapar(r.outro) + ' assume a sua de <strong>' + trechoDejep(r.minha) + '</strong>.'
    + '<br><br>O horário de entrada é reapurado pelo intervalo de descanso de cada um, e a '
    + 'posição de vocês na lista <strong>não muda</strong>.', '',
    '<button class="modal-btn" onclick="fecharModalForcado()">Voltar</button>'
    + '<button class="modal-btn principal" onclick="responderTroca(\'' + id + '\',\'sim\')">'
    + 'Confirmar a troca</button>');
}

function responderTroca(id, resposta) {
  fecharModalForcado();
  mostrarAguardo(resposta === 'sim' ? 'Efetivando a troca...' : 'Registrando a recusa...');
  fetch(URL_BASE + '?acao=responder_troca&t=' + encodeURIComponent(TOKEN) + comoParam()
      + '&s=' + encodeURIComponent(id) + '&r=' + encodeURIComponent(resposta))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      carregar();
    })
    .catch(function () {
      esconderAguardo();
      toast('Não foi possível responder agora. Tente novamente.', true);
    });
}

function chaveDia(ano, mes, dia) {
  const p = n => String(n).padStart(2, '0');
  return ano + '-' + p(mes) + '-' + p(dia);
}
function chaveParaBR(k) {
  const p = k.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
function brParaChave(br) {
  const p = br.split('/');
  return p[2] + '-' + p[1] + '-' + p[0];
}

// ------------------------------------------------------------
// MÊS DE REFERÊNCIA
//
// Um seletor só governa a aba inteira. Trocar o mês recarrega os dados
// do servidor, e com eles mudam as minhas DEJEPs, as opções de troca, o
// que pode ser cancelado e o histórico de solicitações. Deixar o
// calendário num mês e o resto noutro produziria a situação em que o
// servidor pede troca achando que está em novembro e o pedido sai em
// outubro.
// ------------------------------------------------------------
function chaveMes(ano, mes) {
  return ano + '-' + (mes < 10 ? '0' : '') + mes;
}
function mesDeslocado(chave, delta) {
  const p = chave.split('-');
  const d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1 + delta, 1);
  return chaveMes(d.getFullYear(), d.getMonth() + 1);
}
function rotuloMes(chave) {
  const p = chave.split('-');
  return MESES[parseInt(p[1], 10) - 1] + ' ' + p[0];
}

// Limites da navegação: para trás, até o mês mais antigo com escala
// lançada, para o servidor poder rever o que já passou; para a frente,
// até o horizonte de declaração de impedimento, que vai além da escala
// porque é justamente para marcar férias de mês ainda não gerado.
function limitesDeMes() {
  const h = new Date();
  const atual = chaveMes(h.getFullYear(), h.getMonth() + 1);
  const comEscala = ((dados && dados.mesesEscala) || []).map(function (m) { return m.chave; });
  let primeiro = atual, ultimo = mesDeslocado(atual, MESES_A_FRENTE);
  comEscala.forEach(function (k) {
    if (k < primeiro) primeiro = k;
    if (k > ultimo) ultimo = k;
  });
  return { primeiro: primeiro, ultimo: ultimo };
}

function mesAtualDaPagina() {
  if (mesRef) return mesRef;
  const h = new Date();
  return chaveMes(h.getFullYear(), h.getMonth() + 1);
}

function barraMes() {
  const atual = mesAtualDaPagina();
  const lim = limitesDeMes();
  const temEscala = ((dados && dados.mesesEscala) || [])
    .some(function (m) { return m.chave === atual; });
  return '<div class="barra-mes">'
    + '<button onclick="irParaMes(-1)" title="Mês anterior"'
    + (atual <= lim.primeiro ? ' disabled' : '') + '>&#8249;</button>'
    + '<div class="bm-centro"><div class="bm-mes">' + rotuloMes(atual) + '</div>'
    + '<div class="bm-sub">' + (temEscala
        ? 'escala, trocas e solicitações deste mês'
        : 'escala ainda não lançada — dá para declarar impedimento')
    + '</div></div>'
    + '<button onclick="irParaMes(1)" title="Próximo mês"'
    + (atual >= lim.ultimo ? ' disabled' : '') + '>&#8250;</button>'
    + '</div>';
}

function irParaMes(delta) {
  const lim = limitesDeMes();
  const novo = mesDeslocado(mesAtualDaPagina(), delta);
  if (novo < lim.primeiro || novo > lim.ultimo) return;
  mesRef = novo;
  mostrarAguardo(rotuloMes(novo) + '...');
  carregar();
}

function mesLimite(desloc) {
  const h = new Date();
  const d = new Date(h.getFullYear(), h.getMonth() + desloc, 1);
  return { ano: d.getFullYear(), mes: d.getMonth() + 1 };
}

// Dias já declarados, expandidos a partir dos períodos
function diasDeclarados() {
  const mapa = {};
  (dadosImp().impedimentos || []).forEach(function (i) {
    const ini = new Date(brParaChave(i.ini) + 'T12:00:00');
    const fim = new Date(brParaChave(i.fim) + 'T12:00:00');
    for (let d = new Date(ini); d <= fim; d.setDate(d.getDate() + 1)) {
      mapa[chaveDia(d.getFullYear(), d.getMonth() + 1, d.getDate())] = i;
    }
  });
  return mapa;
}

    + '<span><i class="pt" style="background:#fff2cc;border-color:#e0b040;"></i> já declarado</span>'

    + 'Diretoria de Disciplina — o limite considera o conjunto dos dias do mês, não cada '
    + 'bloco isolado.</div>'

    + '<button class="dp-enviar" id="dp-enviar" onclick="enviarDias()">Declarar</button>'

    + renderDeclarados();
}

// Os blocos montados e ainda não enviados
function renderLotes() {
  if (!impLotes.length) return '';
  let h = '<div class="dp-lotes"><div class="dp-lotes-tit">A declarar</div>';
  impLotes.forEach(function (l, i) {
    h += '<div class="dp-lote">'
      + '<span class="dp-lote-mot">' + escapar(l.texto) + '</span>'
      + '<span class="dp-lote-dias">' + escapar(resumoDeDias(l.dias)) + '</span>'
      + (l.obs ? '<span class="dp-lote-obs">' + escapar(l.obs) + '</span>' : '')
      + '<button class="dp-lote-x" title="Tirar este bloco"'
      + ' onclick="removerLote(' + i + ')">&times;</button></div>';
  });
  const dias = impLotes.reduce(function (s, l) { return s + l.dias.length; }, 0);
  h += '<div class="dp-lotes-pe">' + dias + (dias === 1 ? ' dia' : ' dias') + ' em '
    + impLotes.length + (impLotes.length === 1 ? ' bloco' : ' blocos')
    + ' — tudo vai junto ao clicar em Declarar.</div></div>';
  return h;
}

// '2026-11-01,2026-11-02,2026-11-03,2026-11-15' → '1 a 3 e 15 de novembro'
function resumoDeDias(chaves) {
  const porMes = {};
  chaves.slice().sort().forEach(function (k) {
    const p = k.split('-');
    const rot = MESES[parseInt(p[1], 10) - 1] + '/' + p[0].slice(2);
    if (!porMes[rot]) porMes[rot] = [];
    porMes[rot].push(parseInt(p[2], 10));
  });
  return Object.keys(porMes).map(function (rot) {
    const ds = porMes[rot];
    const blocos = [];
    for (let i = 0; i < ds.length; i++) {
      let ini = ds[i];
      while (i + 1 < ds.length && ds[i + 1] === ds[i] + 1) i++;
      blocos.push(ini === ds[i] ? String(ini) : ini + ' a ' + ds[i]);
    }
    return blocos.join(', ') + ' de ' + rot;
  }).join(' · ');
}

// Dias que já estão dentro de algum bloco montado → o próprio bloco
function diasEmLotes() {
  const mapa = {};
  impLotes.forEach(function (l) {
    l.dias.forEach(function (k) { mapa[k] = l; });
  });
  return mapa;
}

function adicionarLote() {
  const chaves = Object.keys(impSel).sort();
  if (!chaves.length) {
    toast('Marque no calendário os dias deste motivo antes de guardá-los.', true);
    return;
  }
  if (impLotes.length >= 12) {
    toast('São no máximo 12 blocos por declaração. Envie estes antes de montar outros.', true);
    return;
  }
  const motivos = dadosImp().motivosImpedimento || [];
  const m = motivos.find(function (x) { return x.valor === impMotivo; });
  impLotes.push({ motivo: impMotivo, texto: m ? m.texto : impMotivo,
    obs: impObs, dias: chaves });
  impSel = {};
  impObs = '';
  render();
}

function removerLote(i) {
  impLotes.splice(i, 1);
  render();
}

function renderDeclarados() {
  const lista = dadosImp().impedimentos || [];
  if (!lista.length) return '';
  let h = '<div style="margin-top:1.8rem;"><div class="card-title">Já declarados</div>';
  lista.forEach(function (i) {
    h += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;'
      + 'border:1px solid #dde4ed;border-radius:9px;padding:0.65rem 0.85rem;margin-bottom:7px;">'
      + '<span style="font-weight:700;font-size:0.86rem;color:#1a3a5c;white-space:nowrap;">'
      + escapar(periodoTexto(i)) + '</span>'
      + '<span style="flex:1;min-width:110px;font-size:0.8rem;color:#6b80a0;">'
      + escapar(i.motivo) + '</span>'
      + (i.situacao === 'Pendente'
          ? '<span class="imp-pend">aguarda validação</span>' : '')
      + '<button class="btn-acao cancelar" onclick="confirmarRemocaoImpedimento(\''
      + i.id + '\')">Remover</button></div>';
  });
  return h + '</div>';
}

function pintarGrade() {
  const grade = el('dp-grade');
  if (!grade) return;

  el('dp-mes').textContent = MESES[impMes.mes - 1] + ' ' + impMes.ano;

  const hoje = new Date();
  const hojeK = chaveDia(hoje.getFullYear(), hoje.getMonth() + 1, hoje.getDate());
  const declarados = diasDeclarados();
  const emLote = diasEmLotes();
  const comDejep = {};
  (dadosImp().meusDias || []).forEach(function (d) { comDejep[brParaChave(d)] = true; });

  const primeiro = new Date(impMes.ano, impMes.mes - 1, 1);
  const total = new Date(impMes.ano, impMes.mes, 0).getDate();
  let html = '';
  for (let i = 0; i < primeiro.getDay(); i++) html += '<button class="dp-dia fora" disabled></button>';

  for (let d = 1; d <= total; d++) {
    const k = chaveDia(impMes.ano, impMes.mes, d);
    const passada = k < hojeK;
    const decl = declarados[k];
    const cls = ['dp-dia'];
    let titulo = '';
    if (passada) { cls.push('passada'); titulo = 'dia já passado'; }
    else if (decl) {
      cls.push('declarada');
      if (decl.situacao === 'Pendente') cls.push('pendente');
      titulo = 'já declarado: ' + decl.motivo
        + (decl.situacao === 'Pendente' ? ' (aguarda validação)' : '');
    } else if (emLote[k]) {
      cls.push('em-lote');
      titulo = 'em um bloco montado: ' + emLote[k].texto
        + ' — tire o bloco abaixo para mexer neste dia';
    } else if (impSel[k]) { cls.push('marcada'); }
    if (k === hojeK) cls.push('hoje');
    if (comDejep[k]) titulo += (titulo ? ' — ' : '') + 'você tem DEJEP neste dia';

    html += '<button class="' + cls.join(' ') + '"'
      + (passada || decl || emLote[k] ? ' disabled' : ' onclick="alternarDia(\'' + k + '\')"')
      + (titulo ? ' title="' + titulo + '"' : '') + '>'
      + d + (comDejep[k] ? '<i class="dp-dejep"></i>' : '') + '</button>';
  }
  grade.innerHTML = html;
  pintarResumo();
}

function pintarResumo() {
  const alvo = el('dp-resumo');
  if (!alvo) return;
  const chaves = Object.keys(impSel).sort();
  const botao = el('dp-enviar');
  // Declarar vale tanto para os dias marcados agora quanto para os
  // blocos já montados: quem montou tudo em blocos não fica travado.
  if (botao) botao.disabled = !chaves.length && !impLotes.length;
  const add = el('dp-add');
  if (add) add.disabled = !chaves.length;

  if (!chaves.length) {
    alvo.className = 'dp-resumo vazio';
    alvo.innerHTML = impLotes.length
      ? 'Nenhum dia marcado agora. Marque os dias do próximo motivo, ou clique em '
        + 'Declarar para enviar os blocos montados.'
      : 'Nenhum dia marcado. Toque nos dias do calendário para marcá-los.';
    return;
  }

  // Agrupa por mês para o servidor conferir o que está enviando
  const porMes = {};
  chaves.forEach(function (k) {
    const p = k.split('-');
    const rot = MESES[parseInt(p[1], 10) - 1] + '/' + p[0];
    if (!porMes[rot]) porMes[rot] = [];
    porMes[rot].push(parseInt(p[2], 10));
  });

  const comDejep = {};
  (dadosImp().meusDias || []).forEach(function (d) { comDejep[brParaChave(d)] = true; });
  const choques = chaves.filter(function (k) { return comDejep[k]; });

  let h = '<strong>' + chaves.length + (chaves.length === 1 ? ' dia marcado' : ' dias marcados')
    + '</strong><br>';
  h += Object.keys(porMes).map(function (m) {
    return m + ': ' + porMes[m].join(', ');
  }).join('<br>');

  if (choques.length) {
    alvo.className = 'dp-resumo alerta';
    h += '<br><br><strong>Atenção:</strong> você já tem DEJEP agendada em '
      + choques.map(chaveParaBR).join(', ') + '. O impedimento <strong>não cancela</strong> '
      + 'a escala — cancele a DEJEP no seu painel ou procure a Diretoria de Disciplina.';
  } else {
    alvo.className = 'dp-resumo';
  }
  alvo.innerHTML = h;
}

function alternarDia(k) {
  if (impSel[k]) delete impSel[k]; else impSel[k] = true;
  pintarGrade();
}

function mudarMes(delta) {
  irParaMes(delta);
}

function marcarMesInteiro() {
  const hoje = new Date();
  const hojeK = chaveDia(hoje.getFullYear(), hoje.getMonth() + 1, hoje.getDate());
  const declarados = diasDeclarados();
  const emLote = diasEmLotes();
  const total = new Date(impMes.ano, impMes.mes, 0).getDate();
  for (let d = 1; d <= total; d++) {
    const k = chaveDia(impMes.ano, impMes.mes, d);
    if (k < hojeK || declarados[k] || emLote[k]) continue;
    impSel[k] = true;
  }
  pintarGrade();
}

function limparSelecao() { impSel = {}; pintarGrade(); }

function enviarDias() {
  // O que está marcado na tela conta como mais um bloco: quem tem um
  // motivo só não precisa clicar em "guardar" antes de declarar.
  const chaves = Object.keys(impSel).sort();
  const motivos = dadosImp().motivosImpedimento || [];
  const m = motivos.find(function (x) { return x.valor === impMotivo; });
  const lotes = impLotes.slice();
  if (chaves.length) {
    lotes.push({ motivo: impMotivo, texto: m ? m.texto : impMotivo,
      obs: impObs, dias: chaves });
  }
  if (!lotes.length) { toast('Marque ao menos um dia no calendário.', true); return; }

  const dias = lotes.reduce(function (s, l) { return s + l.dias.length; }, 0);
  const carga = lotes.map(function (l) {
    return { motivo: l.motivo, obs: l.obs,
             dias: l.dias.map(chaveParaBR) };
  });

  const botao = el('dp-enviar');
  if (botao) { botao.disabled = true; botao.textContent = 'Registrando...'; }
  mostrarAguardo('Registrando ' + dias + (dias === 1 ? ' dia...' : ' dias...'));

  fetch(URL_BASE + '?acao=impedir_lotes' + '&t=' + encodeURIComponent(TOKEN) + comoParam()
      + '&lotes=' + encodeURIComponent(JSON.stringify(carga)))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      // Só limpa o que foi aceito. Numa recusa, os blocos continuam
      // montados na tela — refazer tudo seria castigo por um erro.
      if (j.sucesso) { impSel = {}; impObs = ''; impLotes = []; carregar(); }
      else if (botao) { botao.disabled = false; botao.textContent = 'Declarar'; }
    })
    .catch(function () {
      esconderAguardo();
      toast('Não foi possível registrar. Tente novamente.', true);
      if (botao) { botao.disabled = false; botao.textContent = 'Declarar'; }
    });
}

function confirmarRemocaoImpedimento(id) {
