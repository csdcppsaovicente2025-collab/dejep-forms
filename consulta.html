function confirmarCancelarPedido(id) {
  const s = dados.solicitacoes || { feitas: [] };
  const r = s.feitas.find(function (x) { return x.id === id; });
  if (!r) return;
  abrirModal('Cancelar o pedido de troca',
    'O pedido enviado a <strong>' + escapar(r.outro) + '</strong> será retirado.'
    + '<br><br>Você continua com a sua DEJEP de <strong>' + trechoDejep(r.minha)
    + '</strong> e nada muda na escala. '
    + escapar(r.outro) + ' será avisado(a) de que não precisa responder.', '',
    '<button class="modal-btn" onclick="fecharModalForcado()">Voltar</button>'
    + '<button class="modal-btn perigo" onclick="cancelarPedido(\'' + id + '\')">'
    + 'Confirmar cancelamento</button>');
}

function cancelarPedido(id) {
  fecharModalForcado();
  mostrarAguardo('Cancelando o pedido...');
  buscar(URL_BASE + '?acao=cancelar_solicitacao&t=' + encodeURIComponent(TOKEN)
      + comoParam() + '&s=' + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      carregar();
    })
    .catch(function () {
      esconderAguardo();
      toast('Não foi possível cancelar o pedido. Tente de novo.', true);
    });
}

function confirmarResposta(id, resposta) {
  const s = dados.solicitacoes || { recebidas: [] };
  const r = s.recebidas.find(function (x) { return x.id === id; });
  if (!r) return;

  if (resposta !== 'sim') {
    abrirModal('Recusar a troca',
      'A escala permanece como está e <strong>' + escapar(r.outro)
      + '</strong> será avisado(a).', '',
      '<button class="modal-btn" onclick="fecharModalForcado()">Voltar</button>'
      + '<button class="modal-btn perigo" onclick="responderTroca(\'' + id + '\',\'nao\')">'
      + 'Confirmar recusa</button>');
    return;
  }
  abrirModal('Aceitar a troca',
    'Você passa a cumprir <strong>' + trechoDejep(r.dele) + '</strong> e '
    + escapar(r.outro) + ' assume a sua de <strong>' + trechoDejep(r.minha) + '</strong>.'
    + '<br><br>A posição de vocês na lista <strong>não muda</strong>. '
    + btnAjuda('troca'), '',
    '<button class="modal-btn" onclick="fecharModalForcado()">Voltar</button>'
    + '<button class="modal-btn principal" onclick="responderTroca(\'' + id + '\',\'sim\')">'
    + 'Confirmar a troca</button>');
}

function responderTroca(id, resposta) {
  fecharModalForcado();
  mostrarAguardo(resposta === 'sim' ? 'Efetivando a troca...' : 'Registrando a recusa...');
  buscar(URL_BASE + '?acao=responder_troca&t=' + encodeURIComponent(TOKEN) + comoParam()
      + '&s=' + encodeURIComponent(id) + '&r=' + encodeURIComponent(resposta))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      carregar();
    })
    .catch(function () {
      esconderAguardo();
      toast('Não foi possível responder agora. Tente novamente.', true);
    });
}

function chaveDia(ano, mes, dia) {
  const p = n => String(n).padStart(2, '0');
  return ano + '-' + p(mes) + '-' + p(dia);
}
function chaveParaBR(k) {
  const p = k.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
function brParaChave(br) {
  const p = br.split('/');
  return p[2] + '-' + p[1] + '-' + p[0];
}

// ------------------------------------------------------------
// MÊS DE REFERÊNCIA
//
// Um seletor só governa a aba inteira. Trocar o mês recarrega os dados
// do servidor, e com eles mudam as minhas DEJEPs, as opções de troca, o
// que pode ser cancelado e o histórico de solicitações. Deixar o
// calendário num mês e o resto noutro produziria a situação em que o
// servidor pede troca achando que está em novembro e o pedido sai em
// outubro.
// ------------------------------------------------------------
function chaveMes(ano, mes) {
  return ano + '-' + (mes < 10 ? '0' : '') + mes;
}
function mesDeslocado(chave, delta) {
  const p = chave.split('-');
  const d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1 + delta, 1);
  return chaveMes(d.getFullYear(), d.getMonth() + 1);
}
function rotuloMes(chave) {
  const p = chave.split('-');
  return MESES[parseInt(p[1], 10) - 1] + ' ' + p[0];
}

// Limites da navegação: para trás, até o mês mais antigo com escala
// lançada, para o servidor poder rever o que já passou; para a frente,
// até o horizonte de declaração de impedimento, que vai além da escala
// porque é justamente para marcar férias de mês ainda não gerado.
function limitesDeMes() {
  const h = new Date();
  const atual = chaveMes(h.getFullYear(), h.getMonth() + 1);
  const comEscala = ((dados && dados.mesesEscala) || []).map(function (m) { return m.chave; });
  let primeiro = atual, ultimo = mesDeslocado(atual, MESES_A_FRENTE);
  comEscala.forEach(function (k) {
    if (k < primeiro) primeiro = k;
    if (k > ultimo) ultimo = k;
  });
  return { primeiro: primeiro, ultimo: ultimo };
}

function mesAtualDaPagina() {
  if (mesRef) return mesRef;
  const h = new Date();
  return chaveMes(h.getFullYear(), h.getMonth() + 1);
}

function barraMes() {
  const atual = mesAtualDaPagina();
  const lim = limitesDeMes();
  const temEscala = ((dados && dados.mesesEscala) || [])
    .some(function (m) { return m.chave === atual; });
  return '<div class="barra-mes">'
    + '<button onclick="irParaMes(-1)" title="Mês anterior"'
    + (atual <= lim.primeiro ? ' disabled' : '') + '>&#8249;</button>'
    + '<div class="bm-centro"><div class="bm-mes">' + rotuloMes(atual) + '</div>'
    + '<div class="bm-sub">' + (temEscala
        ? 'escala, trocas e solicitações deste mês'
        : 'escala ainda não lançada — dá para declarar impedimento')
    + '</div></div>'
    + '<button onclick="irParaMes(1)" title="Próximo mês"'
    + (atual >= lim.ultimo ? ' disabled' : '') + '>&#8250;</button>'
    + '</div>';
}

function irParaMes(delta) {
  const lim = limitesDeMes();
  const novo = mesDeslocado(mesAtualDaPagina(), delta);
  if (novo < lim.primeiro || novo > lim.ultimo) return;
  const naMemoria = temNaMemoria(novo);
  mesRef = novo;
  // Tela de espera só quando há o que esperar. Mês já visto troca na
  // hora, e um "Dezembro..." piscando antes seria ruído.
  if (!naMemoria) mostrarAguardo(rotuloMes(novo) + '...');
  carregar();
}

// ------------------------------------------------------------
// ADIANTAR O MÊS VIZINHO
//
// O primeiro clique numa seta ainda custava a espera inteira. Este
// pedido acontece quando ninguém está esperando — o servidor está
// lendo a tela que já abriu —, e só enche o cache: não aplica nada,
// não redesenha, não mexe em 'dados'. É o que torna o primeiro clique
// instantâneo também.
//
// Nada de aplicarConsulta aqui. Uma resposta chegando por trás e
// redesenhando a tela já apagou RG e senha digitados uma vez; o
// conserto foi tirar a chamada, não aprender a conviver com ela.
function adiantarMesVizinho() {
  if (!TOKEN) return;
  const lim = limitesDeMes();
  const atual = mesAtualDaPagina();
  // O próximo mês primeiro: é onde a escala nova aparece. Se não
  // houver, o anterior, que é para onde se olha ao conferir o que
  // passou.
  const candidatos = [mesDeslocado(atual, 1), mesDeslocado(atual, -1)];
  for (let i = 0; i < candidatos.length; i++) {
    const m = candidatos[i];
    if (m < lim.primeiro || m > lim.ultimo) continue;
    if (temNaMemoria(m)) continue;
    const url = urlDaConsulta(m, 'escala');
    buscar(url)
      .then(function (r) { return r.json(); })
      .then(function (d) { guardarNoCache(url, d); })
      .catch(function () { /* adiantamento é cortesia: falhou, não faz falta */ });
    return;
  }
}

function mesLimite(desloc) {
  const h = new Date();
  const d = new Date(h.getFullYear(), h.getMonth() + desloc, 1);
  return { ano: d.getFullYear(), mes: d.getMonth() + 1 };
}

// Dias já declarados, expandidos a partir dos períodos
function diasDeclarados() {
  const mapa = {};
  (dadosImp().impedimentos || []).forEach(function (i) {
    const ini = new Date(brParaChave(i.ini) + 'T12:00:00');
    const fim = new Date(brParaChave(i.fim) + 'T12:00:00');
    for (let d = new Date(ini); d <= fim; d.setDate(d.getDate() + 1)) {
      mapa[chaveDia(d.getFullYear(), d.getMonth() + 1, d.getDate())] = i;
    }
  });
  return mapa;
}

function renderImpedir() {
  if (!impMes) impMes = mesLimite(0);

  const motivos = dadosImp().motivosImpedimento || [];
  const opts = motivos.map(function (m) {
    return '<option value="' + escapar(m.valor) + '"'
      + (m.valor === impMotivo ? ' selected' : '') + '>' + escapar(m.texto) + '</option>';
  }).join('');

  return ''
    + '<div class="dp-nav" style="justify-content:center;">'
    + '<div class="dp-mes" id="dp-mes"></div></div>'
    + '<div class="dp-sem">' + DIAS_SEM_LONGO.map(function (d) {
        return '<span>' + d + '</span>'; }).join('') + '</div>'
    + '<div class="dp-grade" id="dp-grade"></div>'
    + '<div class="dp-leg">'
    + '<span><i class="pt" style="background: var(--grafite-alto);border-color: var(--borda-clara);"></i> marcado agora</span>'
    + '<span><i class="pt" style="background: var(--verde-fundo);border-color: var(--verde);"></i> em um bloco montado</span>'
    + '<span><i class="pt" style="background: var(--ambar-fundo);border-color: var(--ambar);"></i> já declarado</span>'
    + '<span><i class="pt" style="background: var(--grafite);"></i><i class="dp-dejep" style="position:static;"></i> DEJEP sua</span>'
    + '</div>'

    + '<div class="dp-atalhos">'
    + '<button onclick="marcarMesInteiro()">Marcar o mês inteiro</button>'
    + '<button onclick="limparSelecao()">Limpar seleção</button>'
    + '</div>'

    + '<div id="dp-resumo"></div>'

    + '<label class="campo-lbl" for="dp-motivo">Motivo destes dias</label>'
    + '<select class="campo-ent" id="dp-motivo" onchange="impMotivo=this.value">' + opts + '</select>'
    + '<label class="campo-lbl" for="dp-obs">Observação (opcional)</label>'
    + '<input class="campo-ent" type="text" id="dp-obs" maxlength="140"'
    + ' value="' + escapar(impObs) + '" oninput="impObs=this.value"'
    + ' placeholder="Ex.: troca de plantão com o colega Fulano" />'

    + '<button class="dp-add" id="dp-add" onclick="adicionarLote()">'
    + 'Guardar estes dias e marcar outro motivo</button>'

    + renderLotes()

    + '<button class="dp-enviar" id="dp-enviar" onclick="enviarDias()">Declarar</button>'

    + renderDeclarados();
}

// Os blocos montados e ainda não enviados
function renderLotes() {
  if (!impLotes.length) return '';
  let h = '<div class="dp-lotes"><div class="dp-lotes-tit">A declarar</div>';
  impLotes.forEach(function (l, i) {
    h += '<div class="dp-lote">'
      + '<span class="dp-lote-mot">' + escapar(l.texto) + '</span>'
      + '<span class="dp-lote-dias">' + escapar(resumoDeDias(l.dias)) + '</span>'
      + (l.obs ? '<span class="dp-lote-obs">' + escapar(l.obs) + '</span>' : '')
      + '<button class="dp-lote-x" title="Tirar este bloco"'
      + ' onclick="removerLote(' + i + ')">&times;</button></div>';
  });
  const dias = impLotes.reduce(function (s, l) { return s + l.dias.length; }, 0);
  h += '<div class="dp-lotes-pe">' + dias + (dias === 1 ? ' dia' : ' dias') + ' em '
    + impLotes.length + (impLotes.length === 1 ? ' bloco' : ' blocos')
    + ' — tudo vai junto ao clicar em Declarar.</div></div>';
  return h;
}

// '2026-11-01,2026-11-02,2026-11-03,2026-11-15' → '1 a 3 e 15 de novembro'
function resumoDeDias(chaves) {
  const porMes = {};
  chaves.slice().sort().forEach(function (k) {
    const p = k.split('-');
    const rot = MESES[parseInt(p[1], 10) - 1] + '/' + p[0].slice(2);
    if (!porMes[rot]) porMes[rot] = [];
    porMes[rot].push(parseInt(p[2], 10));
  });
  return Object.keys(porMes).map(function (rot) {
    const ds = porMes[rot];
    const blocos = [];
    for (let i = 0; i < ds.length; i++) {
      let ini = ds[i];
      while (i + 1 < ds.length && ds[i + 1] === ds[i] + 1) i++;
      blocos.push(ini === ds[i] ? String(ini) : ini + ' a ' + ds[i]);
    }
    return blocos.join(', ') + ' de ' + rot;
  }).join(' · ');
}

// Dias que já estão dentro de algum bloco montado → o próprio bloco
function diasEmLotes() {
  const mapa = {};
  impLotes.forEach(function (l) {
    l.dias.forEach(function (k) { mapa[k] = l; });
  });
  return mapa;
}

function adicionarLote() {
  const chaves = Object.keys(impSel).sort();
  if (!chaves.length) {
    toast('Marque no calendário os dias deste motivo antes de guardá-los.', true);
    return;
  }
  if (impLotes.length >= 12) {
    toast('São no máximo 12 blocos por declaração. Envie estes antes de montar outros.', true);
    return;
  }
  const motivos = dadosImp().motivosImpedimento || [];
  const m = motivos.find(function (x) { return x.valor === impMotivo; });
  impLotes.push({ motivo: impMotivo, texto: m ? m.texto : impMotivo,
    obs: impObs, dias: chaves });
  impSel = {};
  impObs = '';
  render();
}

function removerLote(i) {
  impLotes.splice(i, 1);
  render();
}

function renderDeclarados() {
  const lista = dadosImp().impedimentos || [];
  if (!lista.length) return '';
  let h = '<div style="margin-top:1.8rem;"><div class="card-title">Já declarados</div>';
  lista.forEach(function (i) {
    h += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;'
      + 'border:1px solid var(--borda);border-radius:9px;padding:0.65rem 0.85rem;margin-bottom:7px;">'
      + '<span style="font-weight:700;font-size:0.86rem;color: var(--texto);white-space:nowrap;">'
      + escapar(periodoTexto(i)) + '</span>'
      + '<span style="flex:1;min-width:110px;font-size:0.8rem;color: var(--texto-3);">'
      + escapar(i.motivo) + '</span>'
      + '<button class="btn-acao cancelar" onclick="confirmarRemocaoImpedimento(\''
      + i.id + '\')">Remover</button></div>';
  });
  return h + '</div>';
}

function pintarGrade() {
  const grade = el('dp-grade');
  if (!grade) return;

  el('dp-mes').textContent = MESES[impMes.mes - 1] + ' ' + impMes.ano;

  const hoje = new Date();
  const hojeK = chaveDia(hoje.getFullYear(), hoje.getMonth() + 1, hoje.getDate());
  const declarados = diasDeclarados();
  const emLote = diasEmLotes();
  const comDejep = {};
  (dadosImp().meusDias || []).forEach(function (d) { comDejep[brParaChave(d)] = true; });

  const primeiro = new Date(impMes.ano, impMes.mes - 1, 1);
  const total = new Date(impMes.ano, impMes.mes, 0).getDate();
  let html = '';
  for (let i = 0; i < primeiro.getDay(); i++) html += '<button class="dp-dia fora" disabled></button>';

  for (let d = 1; d <= total; d++) {
    const k = chaveDia(impMes.ano, impMes.mes, d);
    const passada = k < hojeK;
    const decl = declarados[k];
    const cls = ['dp-dia'];
    let titulo = '';
    if (passada) { cls.push('passada'); titulo = 'dia já passado'; }
    else if (decl) {
      cls.push('declarada');
      titulo = 'já declarado: ' + decl.motivo;
    } else if (emLote[k]) {
      cls.push('em-lote');
      titulo = 'em um bloco montado: ' + emLote[k].texto
        + ' — tire o bloco abaixo para mexer neste dia';
    } else if (impSel[k]) { cls.push('marcada'); }
    if (k === hojeK) cls.push('hoje');
    if (comDejep[k]) titulo += (titulo ? ' — ' : '') + 'você tem DEJEP neste dia';

    html += '<button class="' + cls.join(' ') + '"'
      + (passada || decl || emLote[k] ? ' disabled' : ' onclick="alternarDia(\'' + k + '\')"')
      + (titulo ? ' title="' + titulo + '"' : '') + '>'
      + d + (comDejep[k] ? '<i class="dp-dejep"></i>' : '') + '</button>';
  }
  grade.innerHTML = html;
  pintarResumo();
}

function pintarResumo() {
  const alvo = el('dp-resumo');
  if (!alvo) return;
  const chaves = Object.keys(impSel).sort();
  const botao = el('dp-enviar');
  // Declarar vale tanto para os dias marcados agora quanto para os
  // blocos já montados: quem montou tudo em blocos não fica travado.
  if (botao) botao.disabled = !chaves.length && !impLotes.length;
  const add = el('dp-add');
  if (add) add.disabled = !chaves.length;

  if (!chaves.length) {
    alvo.className = 'dp-resumo vazio';
    alvo.innerHTML = impLotes.length
      ? 'Nenhum dia marcado agora. Marque os dias do próximo motivo, ou clique em '
        + 'Declarar para enviar os blocos montados.'
      : 'Nenhum dia marcado. Toque nos dias do calendário para marcá-los.';
    return;
  }

  // Agrupa por mês para o servidor conferir o que está enviando
  const porMes = {};
  chaves.forEach(function (k) {
    const p = k.split('-');
    const rot = MESES[parseInt(p[1], 10) - 1] + '/' + p[0];
    if (!porMes[rot]) porMes[rot] = [];
    porMes[rot].push(parseInt(p[2], 10));
  });

  const comDejep = {};
  (dadosImp().meusDias || []).forEach(function (d) { comDejep[brParaChave(d)] = true; });
  const choques = chaves.filter(function (k) { return comDejep[k]; });

  let h = '<strong>' + chaves.length + (chaves.length === 1 ? ' dia marcado' : ' dias marcados')
    + '</strong><br>';
  h += Object.keys(porMes).map(function (m) {
    return m + ': ' + porMes[m].join(', ');
  }).join('<br>');

  if (choques.length) {
    alvo.className = 'dp-resumo alerta';
    h += '<br><br><strong>Atenção:</strong> você já tem DEJEP agendada em '
      + choques.map(chaveParaBR).join(', ') + '. O impedimento <strong>não cancela</strong> '
      + 'a escala — cancele a DEJEP no seu painel ou procure a Diretoria de Disciplina.';
  } else {
    alvo.className = 'dp-resumo';
  }
  alvo.innerHTML = h;
}

function alternarDia(k) {
  if (impSel[k]) delete impSel[k]; else impSel[k] = true;
  pintarGrade();
}

function mudarMes(delta) {
  irParaMes(delta);
}

function marcarMesInteiro() {
  const hoje = new Date();
  const hojeK = chaveDia(hoje.getFullYear(), hoje.getMonth() + 1, hoje.getDate());
  const declarados = diasDeclarados();
  const emLote = diasEmLotes();
  const total = new Date(impMes.ano, impMes.mes, 0).getDate();
  for (let d = 1; d <= total; d++) {
    const k = chaveDia(impMes.ano, impMes.mes, d);
    if (k < hojeK || declarados[k] || emLote[k]) continue;
    impSel[k] = true;
  }
  pintarGrade();
}

function limparSelecao() { impSel = {}; pintarGrade(); }

function enviarDias() {
  // O que está marcado na tela conta como mais um bloco: quem tem um
  // motivo só não precisa clicar em "guardar" antes de declarar.
  const chaves = Object.keys(impSel).sort();
  const motivos = dadosImp().motivosImpedimento || [];
  const m = motivos.find(function (x) { return x.valor === impMotivo; });
  const lotes = impLotes.slice();
  if (chaves.length) {
    lotes.push({ motivo: impMotivo, texto: m ? m.texto : impMotivo,
      obs: impObs, dias: chaves });
  }
  if (!lotes.length) { toast('Marque ao menos um dia no calendário.', true); return; }

  const dias = lotes.reduce(function (s, l) { return s + l.dias.length; }, 0);
  const carga = lotes.map(function (l) {
    return { motivo: l.motivo, obs: l.obs,
             dias: l.dias.map(chaveParaBR) };
  });

  const botao = el('dp-enviar');
  if (botao) { botao.disabled = true; botao.textContent = 'Registrando...'; }
  mostrarAguardo('Registrando ' + dias + (dias === 1 ? ' dia...' : ' dias...'));

  buscar(URL_BASE + '?acao=impedir_lotes' + '&t=' + encodeURIComponent(TOKEN) + comoParam()
      + '&lotes=' + encodeURIComponent(JSON.stringify(carga)))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      // Só limpa o que foi aceito. Numa recusa, os blocos continuam
      // montados na tela — refazer tudo seria castigo por um erro.
      if (j.sucesso) { impSel = {}; impObs = ''; impLotes = []; carregar(); }
      else if (botao) { botao.disabled = false; botao.textContent = 'Declarar'; }
    })
    .catch(function () {
      esconderAguardo();
      toast('Não foi possível registrar. Tente novamente.', true);
      if (botao) { botao.disabled = false; botao.textContent = 'Declarar'; }
    });
}

function confirmarRemocaoImpedimento(id) {
  const i = (dadosImp().impedimentos || []).find(function (x) { return x.id === id; });
  if (!i) return;
  abrirModal('Remover impedimento',
    'O período <strong>' + escapar(periodoTexto(i)) + '</strong> deixará de '
    + 'constar, e você volta a ser convocável nesses dias.',
    '',
    '<button class="modal-btn" onclick="fecharModalForcado()">Voltar</button>'
    + '<button class="modal-btn perigo" onclick="executarRemocaoImpedimento(\'' + id + '\')">Confirmar</button>');
}

function executarRemocaoImpedimento(id) {
  fecharModalForcado();
  mostrarAguardo('Removendo...');
  buscar(URL_BASE + '?acao=remover_impedimento' + '&t=' + encodeURIComponent(TOKEN) + comoParam()
      + '&id=' + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      if (j.sucesso) carregar();
    })
    .catch(function () {
      esconderAguardo(); toast('Não foi possível remover.', true); });
}

// ------------------------------------------------------------
// Escala do mês, agrupada por dia
// ------------------------------------------------------------
const DIAS_SEM = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function renderEscala(filtro) {
  const itens = (dados.escala || []).slice();
  // A mesma barra da aba Gerenciar. Sem ela, quem trocasse o mês lá e
  // voltasse para cá veria outro mês sem entender por quê.
  // A faixa do ADM aparece em toda aba: clicar numa DEJEP aqui
  // oferece troca em nome do servidor escolhido, e isso precisa estar
  // visível o tempo todo.
  const barra = faixaAdm() + (TOKEN ? barraMes() : '') + avisoEntrar();
  if (!itens.length) {
    return barra + '<div class="empty-msg">'
      + (dados.semEscalaNoMes
          ? 'A escala de ' + escapar(dados.mes) + ' ainda não foi lançada.'
          : 'Nenhuma escala publicada no momento.') + '</div>';
  }

  const porDia = {};
  itens.forEach(function (i) {
    if (!porDia[i.data]) porDia[i.data] = [];
    porDia[i.data].push(i);
  });

  // Ordem dos postos dentro de um mesmo dia, por horário de entrada.
  // O apoio não constava e caía no 9 do fim; agora os dois horários
  // dele entram no lugar certo, e o rótulo antigo ("Apoio
  // carceragem", sem hora) segue reconhecido por causa das linhas
  // já gravadas na escala.
  const ordemPosto = { '07 às 15h': 1, '08 às 16h': 2, 'Jumbo 08 às 16h': 3,
                       'Apoio carceragem': 4, 'Apoio carceragem 11h': 4,
                       'Torre/Sub diurna': 5, 'Torre/Sub noturna': 6,
                       'Torre diurna': 5, 'Torre noturna': 6,
                       'Apoio carceragem 23h': 7 };
  const datas = Object.keys(porDia).sort(function (a, b) {
    const pa = a.split('/'), pb = b.split('/');
    return (pa[1] + pa[0]).localeCompare(pb[1] + pb[0]);
  });

  const meuNome = dados.eu ? dados.eu.nome.toLowerCase() : null;
  let html = '';

  datas.forEach(function (d) {
    const lista = porDia[d].slice().sort(function (a, b) {
      return (ordemPosto[a.posto] || 9) - (ordemPosto[b.posto] || 9);
    });
    const visiveis = filtro
      ? lista.filter(function (i) { return (i.nome || '').toLowerCase().includes(filtro); })
      : lista;
    if (!visiveis.length) return;

    const p = d.split('/');
    const dt = new Date(2000 + 0, parseInt(p[1], 10) - 1, parseInt(p[0], 10));
    const dow = dados.anoRef
      ? new Date(dados.anoRef, parseInt(p[1], 10) - 1, parseInt(p[0], 10)).getDay()
      : dt.getDay();
    const fds = (dow === 0 || dow === 6);

    html += '<div class="dia-bloco"><div class="dia-cab">'
      + '<span' + (fds ? ' class="dia-fds"' : '') + '>' + escapar(d) + ' &bull; '
      + DIAS_SEM[dow] + '</span>'
      + '<span style="color: var(--texto-3);font-weight:400;">' + visiveis.length + '</span></div>';

    visiveis.forEach(function (i) {
      const ehMinha = meuNome && (i.nome || '').toLowerCase() === meuNome;
      // Sem identificação o nome vem vazio do servidor. Isso NÃO é
      // vaga em aberto: confundir as duas coisas faria a escala
      // parecer desfalcada para quem está só olhando.
      const oculto = dados.precisaEntrar && i.situacao !== 'Vaga';
      const vaga = !oculto && (!i.nome || i.situacao === 'Vaga');
      // O servidor já apurou com quais das minhas DEJEPs esta pode ser
      // trocada. Vazio significa troca incompatível — não se oferece.
      const compat = (i.trocaCom || []).length;
      const podeClicar = dados.eu && !ehMinha && !vaga &&
        i.situacao === 'Agendada' && compat > 0;

      html += '<div class="linha-dejep' + (ehMinha ? ' minha' : '')
        + (podeClicar ? ' clicavel' : '') + '"'
        + (podeClicar ? ' onclick="abrirTrocaComAlvo(\'' + i.id + '\')"' : '') + '>'
        + '<span class="ld-hora">' + escapar(i.horario) + '</span>'
        + '<span class="ld-posto">' + escapar(i.posto) + '</span>'
        + '<span class="ld-nome' + (vaga ? ' ld-vaga' : '')
        + (oculto ? ' ld-oculto' : '') + '">'
        + (oculto ? 'preenchida' : (vaga ? 'VAGA' : escapar(i.nome))) + '</span>'
        + (ehMinha ? '<span style="font-size:0.7rem;color: var(--verde);font-weight:700;">você</span>'
                   : (podeClicar ? '<span style="font-size:0.7rem;color: var(--azul);">trocar</span>'
                   : (dados.eu && !vaga && dados.minhas.length
                      ? '<span style="font-size:0.68rem;color: var(--texto-3);" title="Troca incompatível com o intervalo de descanso, o posto ou a sua situação">—</span>'
                      : '')))
        + (i.situacao === 'Falta' ? '<span style="font-size:0.7rem;color: var(--vermelho);font-weight:700;">falta</span>' : '')
        + '</div>';
    });
    html += '</div>';
  });

  return barra + (html
    || '<div class="empty-msg">Nenhum servidor encontrado com esse nome.</div>');
}

function tabelaFila(titulo, itens, filtro, subtitulo, ajuda) {
  const visiveis = filtro
    ? itens.filter(function (i) { return i.nome.toLowerCase().includes(filtro); })
    : itens;
  let html = '<div style="font-family:var(--fonte-tit);font-size:1.05rem;font-weight:700;'
    + 'color: var(--texto);text-transform:uppercase;letter-spacing:0.09em;'
    + 'margin:18px 0 4px;display:flex;align-items:center;gap:7px;">' + titulo
    + ' <span style="color: var(--texto-3);font-weight:500;">(' + itens.length + ')</span>'
    + (ajuda ? btnAjuda(ajuda) : '') + '</div>'
    + '<div style="font-size:0.74rem;color: var(--texto-3);margin-bottom:8px;">' + subtitulo + '</div>';

  if (!visiveis.length) {
    return html + '<div class="empty-msg">' + (itens.length
      ? 'Nenhum servidor encontrado com esse nome.'
      : 'Nenhum servidor nesta fila.') + '</div>';
  }

  const meuNome = dados.eu ? dados.eu.nome.toLowerCase() : null;
  // A contagem é o que ordena a fila. Mostrá-la é o que permite a
  // cada um conferir a própria posição sem precisar perguntar.
  const comContagem = !!dados.porContagem;
  html += '<div class="tabela-wrap"><table><thead><tr>'
    + '<th style="width:60px;">#</th><th>Servidor</th>'
    + (comContagem ? '<th class="centro" style="width:86px;">DEJEPs</th>' : '')
    + '<th class="centro" style="width:90px;">Turno</th>'
    + '</tr></thead><tbody>';
  visiveis.forEach(function (i) {
    const eu = meuNome && i.nome.toLowerCase() === meuNome;
    html += '<tr' + (eu
      ? ' style="background: var(--latao-fundo);font-weight:700;'
        + 'box-shadow: inset 3px 0 0 var(--latao);"' : '') + '>'
      + '<td class="num">' + i.posicao + 'º</td>'
      + '<td>' + escapar(i.nome)
      + (i.soTorre ? ' <span class="tag">torre</span>' : '')
      + (i.listas === 'Ambas' ? ' <span class="tag" style="background: var(--azul-fundo);color: var(--texto);">nos dois períodos</span>' : '')
      + '</td>'
      + (comContagem
          ? '<td class="centro">' + (i.dejeps === null || i.dejeps === undefined
              ? '—' : i.dejeps)
            // A marca de cancelamento. Sem ela a coluna se contradiz:
            // quem cancelou aparece com menos DEJEPs e ainda assim
            // atrás de quem tem mais. O cancelamento em tempo hábil
            // não faz perder nem ganhar posição, e é isso que o número
            // exibido, sozinho, não consegue dizer.
            + (i.canceladas
                ? ' <span class="canc" title="' + i.canceladas + ' DEJEP'
                  + (i.canceladas > 1 ? 's canceladas' : ' cancelada')
                  + ' por ele. Contam na ordem da fila, para que o cancelamento '
                  + 'não faça perder nem ganhar posição.">+' + i.canceladas
                  + ' canc.</span>'
                : '')
            + '</td>'
          : '')
      + '<td class="centro">' + escapar(i.turno || '—') + '</td></tr>';
  });
  return html + '</tbody></table></div>';
}

function renderLista(filtro) {
  const diurna  = dados.filaDiurna  || dados.fila || [];
  const noturna = dados.filaNoturna || [];
  if (dados.filaOculta) return avisoEntrar();
  if (!diurna.length && !noturna.length) {
    return '<div class="empty-msg">A lista corrida ainda não foi constituída.</div>';
  }
  // A explicação da ordem — que era o texto mais longo da página —
  // mora no "?" ao lado do título de cada período. Quem discute a
  // própria posição precisa dela; quem só quer ver a lista, não.
  return avisoEntrar() + tabelaFila('Período diurno', diurna, filtro,
      'Postos das 07h e das 08h, jumbo e torre diurna.', 'fila')
    + tabelaFila('Período noturno', noturna, filtro,
      'Torre noturna. Depende de manifestação na inscrição.', 'fila');
}

// Identificado = servidor com token válido, ou acesso administrativo.
function autenticado() { return !!(dados && (dados.eu || dados.adm || dados.consulta)); }

// A cota do mês, acima das abas. Aparece em qualquer aba e para quem
// entrou: é número de controle, não de relatório — ter de abrir a aba
// de estatísticas para saber quantas DEJEPs faltam é o mesmo que não
// ter o número.
function desenharCota() {
  const cx = el('cota');
  if (!cx) return;
  const c = dados && dados.cota;
  if (!autenticado() || !c || !c.total) { cx.innerHTML = ''; return; }

  // O caminho que interessa é até as 119. A meta de 110 é a regra
  // interna de quando a reserva emergencial se abre; quem acompanha o
  // mês quer as duas informações, sem confundi-las.
  const usadas = c.usadas || 0;
  const emg = c.emergenciais || 0;
  const ordinarias = Math.max(0, usadas - emg);
  const pct = n => (c.total ? (n * 100 / c.total) : 0).toFixed(2) + '%';

  let faltaTxt;
  if (c.restantes === 0) {
    faltaTxt = '<span class="cota-faltam">cota completa</span>';
  } else if (c.naReta && !c.cabe) {
    faltaTxt = '<span class="cota-aviso">faltam ' + c.restantes
      + ' e não cabem mais nos dias que restam</span>';
  } else {
    faltaTxt = '<span class="cota-faltam">faltam ' + c.restantes + '</span>';
  }

  // A reserva só é notícia enquanto está de pé. Na reta final ela já
  // entrou na escala, e repeti-la ali viraria número sem função.
  const reservaTxt = (!c.naReta && c.reservaLivre > 0)
    ? '<span class="cota-sep">·</span> <span>' + c.reservaLivre
      + ' de reserva emergencial ainda livres</span>'
    : (emg > 0
        ? '<span class="cota-sep">·</span> <span>' + emg + ' '
          + (emg > 1 ? 'emergenciais usadas' : 'emergencial usada') + '</span>'
        : '');

  const abertoTxt = c.emAberto > 0
    ? '<span class="cota-sep">·</span> <span class="cota-aviso">'
      + c.emAberto + ' vaga' + (c.emAberto > 1 ? 's' : '') + ' em aberto</span>'
    : '';

  cx.innerHTML = '<div class="cota">'
    + '<div class="cota-linha">'
    +   '<span class="cota-mes">' + c.mes + '</span>'
    +   '<span class="cota-sep">·</span>'
    +   '<span class="cota-num">' + usadas + '</span>'
    +   '<span class="cota-de">de ' + c.total + ' DEJEPs agendadas</span>'
    +   '<span class="cota-sep">·</span>' + faltaTxt
    +   reservaTxt + abertoTxt
    + '</div>'
    + '<div class="cota-barra" role="img" aria-label="' + usadas + ' de '
    +   c.total + ' DEJEPs do mês já agendadas">'
    +   '<span class="cb-usadas" style="width:' + pct(ordinarias) + '"></span>'
    +   '<span class="cb-emg" style="width:' + pct(emg) + '"></span>'
    + '</div>'
    + (emg > 0
        ? '<div class="cota-leg">'
          + '<span><i class="cb-usadas"></i>' + ordinarias + ' pela lista corrida</span>'
          + '<span><i class="cb-emg"></i>' + emg + ' '
          + (emg > 1 ? 'emergenciais' : 'emergencial') + '</span>'
          + '</div>'
        : '')
    + '</div>';
}

// Nome vem do cadastro, que é digitado à mão: escapar antes de pôr
// na página é barato e evita que um caractere solto quebre o HTML.
function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// A escala virada do avesso, para o lançamento no sistema oficial:
// por horário, dentro dele por segurança, e em ordem alfabética. A
// escala normal é por dia, que é como a unidade trabalha; para lançar,
// essa ordem obriga a percorrer o mês inteiro atrás de quem é das 07h.
function renderAgendamento() {
  const a = dados && dados.agendamento;
  if (!a) {
    return '<div class="empty-msg"><i class="fa-solid fa-spinner fa-spin"></i> '
      + 'Montando a lista...</div>';
  }
  if (!a.grupos || !a.grupos.length) {
    return '<div class="empty-msg">Não há DEJEPs agendadas em ' + a.mes + '.</div>';
  }
  // A explicação de como a lista é organizada foi para o "?". O que
  // fica é o número, que é o que o operador confere antes de lançar.
  let h = '<div class="ag-ajuda" style="display:flex;align-items:center;gap:8px;'
    + 'flex-wrap:wrap;"><strong>' + a.total + '</strong> lançamentos em '
    + a.mes + btnAjuda('lancamento') + '</div>';

  a.grupos.forEach(g => {
    h += '<div class="ag-grupo"><div class="ag-seg-cab">'
      + '<span>Segurança ' + esc(g.seguranca) + '</span>'
      + '<small>' + g.servidores + ' servidor' + (g.servidores > 1 ? 'es' : '')
      + ' · ' + g.lancamentos + ' lançamento' + (g.lancamentos > 1 ? 's' : '')
      + '</small></div>';
    g.horarios.forEach(ho => {
      const idCopia = 'ag-' + g.seguranca.replace(/[^A-Za-z]/g, '') + '-' + ho.hora;
      h += '<div class="ag-seg"><div class="ag-seg-tit">'
        + '<span>' + ho.chave + '</span>'
        + '<small>' + ho.rotulo + ' · ' + ho.servidores.length + ' servidor'
        + (ho.servidores.length > 1 ? 'es' : '') + ' · ' + ho.lancamentos
        + ' lançamento' + (ho.lancamentos > 1 ? 's' : '') + '</small>'
        + '<button class="ag-copiar" onclick="copiarGrupo(\'' + idCopia + '\', this)">'
        + 'Copiar</button>'
        + '</div><div id="' + idCopia + '">';
      if (!ho.servidores.length) {
        h += '<div class="ag-vazio">Ninguém neste horário.</div>';
      }
      ho.servidores.forEach((sv, i) => {
        h += '<div class="ag-li">'
          + '<span class="ag-n">' + (i + 1) + '</span>'
          + '<span class="ag-nome">' + esc(sv.nome) + '</span>'
          + '<span class="ag-datas">' + sv.datas.map(d => d.substring(0, 5)).join('  ')
          + '</span></div>';
      });
      h += '</div></div>';
    });
    h += '</div>';
  });
  return h;
}

// Copiar em texto simples: é assim que o conteúdo entra numa planilha
// ou num campo do sistema oficial sem arrastar a formatação da página.
function copiarGrupo(id, botao) {
  const cx = el(id);
  if (!cx) return;
  const linhas = Array.from(cx.querySelectorAll('.ag-li')).map(li => {
    const nome = li.querySelector('.ag-nome').textContent.trim();
    const datas = li.querySelector('.ag-datas').textContent.trim().replace(/\s+/g, ' ');
    return nome + (datas ? '\t' + datas : '');
  });
  const texto = linhas.join('\n');
  const avisar = ok => {
    const antes = botao.textContent;
    botao.textContent = ok ? 'Copiado' : 'Não deu';
    setTimeout(() => { botao.textContent = antes; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(() => avisar(true), () => avisar(false));
    return;
  }
  // Navegador antigo, ou página aberta sem HTTPS: o caminho velho.
  try {
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    avisar(ok);
  } catch (e) { avisar(false); }
}

function render() {
  // MURO DE ACESSO. Sem identificação não há escala, fila nem nome:
  // a página inteira é a tela de entrada. É mais simples de explicar
  // do que uma página meio aberta, e não deixa sobra para discutir.
  const dentro = autenticado();
  el('abas').style.display = dentro ? '' : 'none';
  // A aba de estatísticas vale para quem entrou — servidor, gestão ou
  // chefia. O conteúdo dela é todo agregado: contagens do mês, nenhum
  // nome. Fora do login ela não aparece, como a escala.
  //
  // O perfil de consulta não tem o que gerenciar: a aba de gerenciar
  // some, em vez de abrir numa tela que só recusaria o que ele
  // tentasse fazer.
  const atual = !!(dados && dados.__token === TOKEN);
  const bStats = el('aba-stats'), bGer = el('aba-ger');
  if (bStats) bStats.style.display = dentro ? '' : 'none';
  if (bGer)   bGer.style.display   = (dentro && ehConsulta()) ? 'none' : '';
  // A lista de lançamento é ferramenta de quem lança no sistema
  // oficial, e quem lança é a Diretoria: só o acesso ADM. Para o
  // servidor não teria uso, e seria mais uma aba a atrapalhar quem
  // só quer ver a própria DEJEP; a chefia, que consulta e não age,
  // também não lança.
  //
  // Esconder a aba é conforto, não controle: quem manda na resposta
  // é o servidor, que só entrega a lista ao acesso ADM.
  const bAg = el('aba-agenda');
  if (bAg) bAg.style.display = (dentro && ehAdm()) ? '' : 'none';
  desenharCota();
  // A correção de aba só vale quando os dados já são desta sessão.
  if (atual) {
    if (ehConsulta() && aba === 'ger') aba = 'stats';
    if (!dentro && aba === 'stats') aba = 'escala';
    if (aba === 'agenda' && !(dentro && ehAdm())) aba = 'escala';
  }
  // A lista de lançamento já vem agrupada e ordenada: um campo de
  // busca ali faria o operador filtrar justamente o que ele precisa
  // conferir por inteiro.
  el('busca').style.display =
    (dentro && !dados.precisaEntrar && aba !== 'ger' && aba !== 'stats'
     && aba !== 'agenda') ? '' : 'none';
  if (!dentro) {
    el('card-titulo').textContent = recToken || trocaObrigatoria
      ? 'Definir a senha' : 'Acesso à DEJEP';
    el('conteudo').innerHTML = renderAcesso();
    return;
  }

  if (aba === 'ger') {
    el('conteudo').innerHTML = renderGerenciar();
    if (dados && dados.eu) pintarGrade();
    return;
  }
  if (!dados) return;
  el('card-titulo').textContent = (aba === 'escala' && dados.mes)
    ? 'Escala de ' + dados.mes : TITULO_ABA[aba];
  if (aba === 'stats') { el('conteudo').innerHTML = renderEstatisticas(); return; }
  if (aba === 'agenda') { el('conteudo').innerHTML = renderAgendamento(); return; }
  const filtro = el('busca').value.trim().toLowerCase();
  el('conteudo').innerHTML = (aba === 'escala') ? renderEscala(filtro) : renderLista(filtro);
}

// O "?" ao lado do assunto. 'onclick' em vez de link: a ajuda é
// consulta, não navegação, e não tira o servidor de onde ele está.
function btnAjuda(chave) {
  return '<button class="ajuda" type="button" title="Como funciona" '
    + 'onclick="verAjuda(\'' + chave + '\')">?</button>';
}
function verAjuda(chave) {
  var a = AJUDA[chave];
  if (!a) return;
  var txt = (typeof a.txt === 'function') ? a.txt() : a.txt;
  abrirModal(a.tit, '', '<div class="ajuda-corpo">' + txt + '</div>',
    '<button class="modal-btn principal" onclick="fecharModalForcado()">Entendi</button>');
}

function abrirModal(tit, sub, corpo, acoes) {
  el('modal-tit').textContent = tit;
  el('modal-sub').innerHTML = sub || '';
  // Sem subtítulo o div vazio ainda ocupava a sua margem, abrindo um
  // vão entre o título e o corpo.
  el('modal-sub').hidden = !sub;
  el('modal-corpo').innerHTML = corpo || '';
  el('modal-acoes').innerHTML = acoes || '';
  el('modal').classList.add('ativo');
}

function fecharModal(ev) {
  if (ev && ev.target !== el('modal')) return;
  el('modal').classList.remove('ativo');
}

function fecharModalForcado() { el('modal').classList.remove('ativo'); }

// Clique no nome de outro servidor na escala
function abrirTrocaComAlvo(idAlvo) {
  if (!dados.eu) {
    toast('Abra a página pelo link do seu e-mail para solicitar troca.', true);
    return;
  }
  const alvo = (dados.escala || []).find(function (i) { return i.id === idAlvo; });
  if (!alvo) return;
  if (!dados.minhas.length) {
    toast('Você não tem DEJEP neste mês para oferecer em troca.', true);
    return;
  }
  trocaAlvo = idAlvo;

  const compat = alvo.trocaCom || [];
  const ofertaveis = dados.minhas.filter(function (m) { return compat.indexOf(m.id) !== -1; });
  if (!ofertaveis.length) {
    toast('Nenhuma das suas DEJEPs é compatível com essa.', true);
    return;
  }
  const opcoes = ofertaveis.map(function (m) {
    return '<button class="modal-opt" onclick="enviarTroca(\'' + m.id + '\')">'
      + '<strong>' + escapar(m.data) + '</strong> &nbsp; ' + escapar(m.posto)
      + ' &bull; ' + rotuloHorario(m.horario) + '</button>';
  }).join('');

  abrirModal('Solicitar troca com ' + alvo.nome,
    'Você assumiria <strong>' + escapar(alvo.data) + '</strong> — ' + escapar(alvo.posto)
    + '. Escolha qual das suas oferece em troca. ' + btnAjuda('troca'),
    opcoes,
    '<button class="modal-btn" onclick="fecharModalForcado()">Cancelar</button>');
}

// Botão "Trocar" no painel pessoal: escolhe primeiro o alvo
function abrirTrocaDaMinha(idMinha) {
  const minha = dados.minhas.find(function (m) { return m.id === idMinha; });
  if (!minha) return;
  const candidatos = (dados.escala || []).filter(function (i) {
    return (i.trocaCom || []).indexOf(idMinha) !== -1;
  });
  if (!candidatos.length) {
    toast('Nenhuma troca compatível com a sua DEJEP de ' + minha.data + ' neste mês.', true);
    return;
  }
  const opcoes = candidatos.map(function (c) {
    return '<button class="modal-opt" onclick="enviarTrocaCom(\'' + idMinha + '\',\'' + c.id + '\')">'
      + '<strong>' + escapar(c.data) + '</strong> &nbsp; ' + escapar(c.posto)
      + ' &bull; ' + rotuloHorario(c.horario) + '<br>'
      + '<span style="color: var(--texto-3);font-size:0.8rem;">' + escapar(c.nome) + '</span></button>';
  }).join('');

  abrirModal('Trocar a DEJEP de ' + minha.data,
    '<strong>' + candidatos.length + ' trocas compatíveis</strong> com a sua DEJEP de '
    + escapar(minha.data) + '. ' + btnAjuda('troca'),
    '<div style="max-height:320px;overflow-y:auto;">' + opcoes + '</div>',
    '<button class="modal-btn" onclick="fecharModalForcado()">Cancelar</button>');
}

function enviarTroca(idMinha) { enviarTrocaCom(idMinha, trocaAlvo); }

function enviarTrocaCom(idMinha, idAlvo) {
  fecharModalForcado();
  mostrarAguardo('Enviando solicitação...');
  buscar(URL_BASE + '?acao=solicitar&t=' + encodeURIComponent(TOKEN) + comoParam()
      + '&minha=' + encodeURIComponent(idMinha) + '&alvo=' + encodeURIComponent(idAlvo))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      if (j.sucesso) carregar();
    })
    .catch(function () {
      esconderAguardo(); toast('Não foi possível enviar a solicitação.', true); });
}

// ------------------------------------------------------------
// Cancelamento
// ------------------------------------------------------------
function confirmarCancelamento(id) {
  const m = dados.minhas.find(function (x) { return x.id === id; });
  if (!m) return;
  abrirModal('Cancelar a DEJEP de ' + m.data,
    'Você deixará de cumprir <strong>' + escapar(m.data) + '</strong> — ' + escapar(m.posto)
    + ', ' + rotuloHorario(m.horario) + '.<br><br>'
    + 'A sua <strong>posição na lista é preservada</strong>. ' + btnAjuda('cancelar'),
    '',
    '<button class="modal-btn" onclick="fecharModalForcado()">Voltar</button>'
    + '<button class="modal-btn perigo" onclick="executarCancelamento(\'' + id + '\')">Confirmar cancelamento</button>');
}

function executarCancelamento(id) {
  fecharModalForcado();
  mostrarAguardo('Cancelando...');
  buscar(URL_BASE + '?acao=cancelar_dejep&t=' + encodeURIComponent(TOKEN) + comoParam()
      + '&id=' + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      if (j.sucesso) carregar();
    })
    .catch(function () {
      esconderAguardo(); toast('Não foi possível cancelar.', true); });
}

// ------------------------------------------------------------
// Entrar são DUAS chamadas: a que confere a senha e a que busca a
// escala. Esconder o indicador ao fim da primeira deixava a tela
// parada e sem sinal durante a segunda, que é a demorada. O
// indicador agora atravessa as duas, e quem chamou pode pedir algo
// para depois de a tela estar pronta — o aviso da sessão, por
// exemplo, que aparecia antes de a página existir.
// Aproveita a consulta que veio dentro da resposta do login, em vez de
// pedi-la de novo. 'carregar' continua existindo para todo o resto —
// trocar de mês, recarregar depois de uma ação — mas entrar não paga
// mais duas viagens ao servidor.
// semBloquear: busca sem cobrir a tela com "Carregando...". Serve a
// quem ainda não entrou — a tela de login aparece na hora e a consulta
// anônima corre atrás, em vez de o servidor digitar o RG depois de
// esperar um arranque frio do Apps Script inteiro.
// A URL do pedido de consulta, montada num lugar só: é ela que serve
// de chave do cache, e se a navegação montasse a sua própria versão as
// duas se desencontrariam no primeiro parâmetro novo.
function urlDaConsulta(mes, qualAba) {
  const m = (mes === undefined) ? mesRef : mes;
  const a = (qualAba === undefined) ? aba : qualAba;
  return URL_BASE + '?acao=consulta'
    + (TOKEN ? '&t=' + encodeURIComponent(TOKEN) : '')
    + (m ? '&mes=' + encodeURIComponent(m) : '')
    // As estatísticas são caras de apurar no servidor e não aparecem
    // nas outras abas: só se pedem quando é a aba aberta.
    + (a === 'stats' ? '&stats=1' : '')
    + (a === 'agenda' ? '&agenda=1' : '')
    + comoParam();
}

// Só confere se está lá e se ainda vale: não copia o payload, que
// pode passar de 50 KB, só para responder sim ou não.
function temNaMemoria(mes, qualAba) {
  const g = cacheConsulta[urlDaConsulta(mes, qualAba)];
  return !!(g && (Date.now() - g.quando) <= VALIDADE_CACHE_MS);
}

function carregar(aoTerminar, prontos, semBloquear) {
  const url = urlDaConsulta();
  if (prontos) {
    // Payload que veio junto com o login: vale como resposta deste mês.
    guardarNoCache(url, prontos);
    if (!semBloquear && !el('aguardo').classList.contains('ativo')) mostrarAguardo('Carregando...');
    aplicarConsulta(prontos, aoTerminar);
    return;
  }
  // Mês já visto nesta sessão: responde na hora, sem servidor e sem
  // nem piscar a tela de espera.
  const guardado = doCache(url);
  if (guardado) {
    esconderAguardo();
    aplicarConsulta(guardado, aoTerminar);
    return;
  }
  if (!semBloquear && !el('aguardo').classList.contains('ativo')) mostrarAguardo('Carregando...');
  buscar(url).then(function (r) { return r.json(); })
    .then(function (d) { guardarNoCache(url, d); aplicarConsulta(d, aoTerminar); })
    .catch(function (e) {
      esconderAguardo();
      // Em segundo plano, na tela de login, a falha não vira aviso: o
      // servidor está digitando o RG e nada do que falhou lhe faria
      // falta. O erro aparece quando ele entrar.
      if (semBloquear) return;
      el('conteudo').innerHTML = '<div class="empty-msg">' + motivoDaFalha(e) + '</div>';
    });
}

function aplicarConsulta(d, aoTerminar) {
  {
    esconderAguardo();
    dados = d;
    // De qual token estes dados são. Sem isso, logo após entrar a
    // página ainda tem em mãos o payload da sessão anterior, e
    // decidir qual aba mostrar por ele leva à aba errada.
    dados.__token = TOKEN;
    // O servidor manda de volta qual mês atendeu. Guardar o que ELE
    // disse, e não o que foi pedido, evita a página achar que está num
    // mês e mostrar outro.
    if (d.mesChave) mesRef = d.mesChave;
    // E guarda também sob a URL do mês que o servidor REALMENTE
    // atendeu. O primeiro pedido vai sem '&mes=' — a página ainda não
    // sabe em que mês está —, de modo que a resposta ficava guardada
    // sob uma chave que nenhuma navegação volta a montar: voltar ao
    // mês de entrada pedia tudo de novo.
    if (d.mesChave) guardarNoCache(urlDaConsulta(), d);
    // O calendário de impedimento acompanha o mês de referência.
    if (d.mesChave) {
      const pm = d.mesChave.split('-');
      impMes = { ano: parseInt(pm[0], 10), mes: parseInt(pm[1], 10) };
    }
    if (d.mes) {
      const partes = d.mes.split(' ');
      dados.anoRef = parseInt(partes[partes.length - 1], 10) || new Date().getFullYear();
      el('card-titulo').textContent = (aba === 'escala')
        ? 'Escala de ' + d.mes : TITULO_ABA[aba];
    }
    render();
    if (aoTerminar) aoTerminar(d);
    agendarAdiantamento();
  }
}

// O adiantamento espera a tela assentar: pedir junto com o primeiro
// desenho é disputar banda com o que o servidor está esperando ver.
// E um temporizador só, reiniciado, para que navegar depressa entre
// meses não dispare uma rajada de pedidos.
var tempoAdiantar = null;
function agendarAdiantamento() {
  if (!TOKEN) return;
  if (tempoAdiantar) clearTimeout(tempoAdiantar);
  tempoAdiantar = setTimeout(function () {
    tempoAdiantar = null;
    adiantarMesVizinho();
  }, 1500);
}

// ------------------------------------------------------------
// NATAL
//
// A temporada se abre sozinha em 1º de dezembro e se fecha em 6 de
// janeiro. Fora dela nada disto existe na tela, e o laço de animação
// nunca chega a ser criado.
//
// A escolha de ligar ou não fica no navegador de quem clicou — e só
// nele. Em computador compartilhado de plantão, o que o colega ligou
// não se impõe ao próximo: cada um liga o seu, e some ao limpar os
// dados. Nada disso sai da máquina nem chega ao servidor.
// ------------------------------------------------------------
function ehTemporada(hoje) {
  // ?natal=1 força a temporada, ?natal=0 desliga. Existe por um
  // motivo prático: em novembro não há como ver o enfeite para
  // aprová-lo, e abrir o console do navegador não é jeito de mostrar
  // uma coisa a alguém. Serve também no sentido contrário — se em
  // dezembro a Diretoria achar que não cabe, ?natal=0 resolve na
  // hora, sem republicar a página.
  var forcado = (new URLSearchParams(location.search).get('natal') || '').trim();
  if (forcado === '1') return true;
  if (forcado === '0') return false;
  // De 20 de novembro a 6 de janeiro, TODO ano. É regra de calendário,
  // não data deste ano: entra e sai sozinho enquanto a página existir,
  // sem ninguém precisar lembrar de nada em março.
  var d = hoje || new Date();
  var m = d.getMonth(), dia = d.getDate();
  if (m === 10) return dia >= 20;    // novembro, da véspera do fim
  if (m === 11) return true;         // dezembro inteiro
  if (m === 0)  return dia <= 6;     // até o Dia de Reis
  return false;
}

// A neve cai durante toda a temporada, sem chave para ligar ou
// desligar: decisão da Diretoria, 22/11/2026. Sobram duas guardas,
// e nenhuma das duas é preferência de enfeite:
//
//   - aba em segundo plano não desenha. É só economia; na tela não
//     muda nada, porque não há tela à vista.
//   - quem configurou o PRÓPRIO sistema para menos movimento não
//     recebe animação. Essa configuração costuma existir por enjoo
//     ou tontura com movimento na tela, e respeitá-la não é opinião
//     sobre o enfeite.
//
// E a chave geral continua: ?natal=0 tira tudo na hora, sem
// republicar a página.
var neveLaco = null;
var neveFlocos = [];
var neveCtx = null;

function pararNeve() {
  if (neveLaco) { cancelAnimationFrame(neveLaco); neveLaco = null; }
  neveFlocos = [];
  var c = el('neve');
  if (c && neveCtx) neveCtx.clearRect(0, 0, c.width, c.height);
}

function comecarNeve() {
  var c = el('neve');
  if (!c || !c.getContext) return;
  // Quem configurou o próprio sistema para menos movimento fica com
  // as luzes e sem a neve.
  var quieto = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (quieto) return;
  if (neveLaco) return;

  neveCtx = c.getContext('2d');
  function medir() {
    // Um só pixel por pixel de tela: em telefone antigo, dobrar a
    // resolução do enfeite é gastar o que a página acabou de economizar.
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  }
  medir();
  window.addEventListener('resize', medir);

  // Quarenta flocos. Mais que isso ninguém distingue, e cada um é
  // uma conta por quadro.
  var n = Math.min(40, Math.round(window.innerWidth / 11));
  neveFlocos = [];
  for (var i = 0; i < n; i++) {
    neveFlocos.push({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: 0.8 + Math.random() * 1.9,
      vy: 0.25 + Math.random() * 0.55,
      vx: -0.18 + Math.random() * 0.36,
      o: 0.25 + Math.random() * 0.45
    });
  }

  var ultimo = 0;
  function quadro(agora) {
    // Aba em segundo plano não desenha. O navegador já segura o
    // requestAnimationFrame, mas a guarda é barata e explícita.
    if (document.hidden) { neveLaco = requestAnimationFrame(quadro); return; }
    // Trinta quadros por segundo bastam para neve e custam metade de
    // sessenta. Ninguém vai julgar a fluidez do floco.
    if (agora - ultimo < 33) { neveLaco = requestAnimationFrame(quadro); return; }
    ultimo = agora;

    neveCtx.clearRect(0, 0, c.width, c.height);
    for (var i = 0; i < neveFlocos.length; i++) {
      var f = neveFlocos[i];
      f.y += f.vy;
      f.x += f.vx;
      if (f.y > c.height + 4) { f.y = -4; f.x = Math.random() * c.width; }
      if (f.x < -4) f.x = c.width + 4;
      if (f.x > c.width + 4) f.x = -4;
      neveCtx.beginPath();
      neveCtx.arc(f.x, f.y, f.r, 0, 6.2832);
      neveCtx.fillStyle = 'rgba(230,231,228,' + f.o + ')';
      neveCtx.fill();
    }
    neveLaco = requestAnimationFrame(quadro);
  }
  neveLaco = requestAnimationFrame(quadro);
}

function prepararNatal() {
  if (!ehTemporada()) return;          // fora da temporada, nada acontece
  document.body.classList.add('e-natal');
  document.body.classList.add('nevando');
  comecarNeve();
}

// O ENFEITE NÃO DERRUBA O SISTEMA.
//
// Em 22/11/2026, ao tirar a chave de ligar e desligar, apaguei sem
// querer a função que começa a neve. O erro subiu e abortou o script
// INTEIRO: a página parou em "Carregando dados...", sem login, sem
// escala. Uma animação de Natal derrubou o sistema de escala.
//
// Daí esta casca. Ela não conserta o enfeite — conserta a relação
// entre ele e o resto: o que acontecer aqui dentro morre aqui dentro,
// e a página segue. É a última coisa que roda, e a mais dispensável
// de todas; não há motivo para ter poder sobre as outras.
try { prepararNatal(); } catch (e) { /* sem enfeite, com sistema */ }

// Qualquer interação do servidor adia o encerramento
['click', 'keydown', 'touchstart', 'scroll'].forEach(function (ev) {
  document.addEventListener(ev, marcarAtividade, { passive: true });
});
setInterval(conferirSessao, INTERVALO_CONFERE_MS);

// Sessão deixada aberta num acesso anterior não vale: quem sentar
// agora no computador começa deslogado.
if (TOKEN) {
  const parado = ultimoUso() ? (Date.now() - ultimoUso()) : 0;
  if (parado >= minutosDeSessao() * 60000) { guardarToken(''); guardarComo(''); }
  else marcarAtividade();
}

// Chegou pelo link de recuperação: a tela de definir a senha vem
// antes de tudo, e o link é conferido antes de o servidor digitar —
// descobrir que o link venceu depois de escolher a senha irrita.
if (recToken) {
  guardarToken(''); guardarComo('');
  mostrar('ger');
  mostrarAguardo('Conferindo o link...');
  buscar(URL_BASE + '?acao=conferir_link&r=' + encodeURIComponent(recToken))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      if (j.sucesso) { recNome = j.primeiroNome || ''; }
      else {
        recToken = '';
        try { history.replaceState(null, '', location.pathname); } catch (e) { /* ok */ }
        toast(j.mensagem, true);
      }
      carregar();
    })
    .catch(function () {
      esconderAguardo();
      recToken = '';
      toast('Não foi possível conferir o link agora. Tente novamente.', true);
      carregar();
    });
} else if (!TOKEN) {
  // SEM TOKEN NÃO HÁ O QUE ESPERAR DO SERVIDOR.
  //
  // A página chamava o Apps Script antes mesmo de o servidor digitar o
  // RG. Isso custava um arranque frio inteiro — segundos — e trazia de
  // útil uma única informação: "precisaEntrar", que a página já sabe
  // pela ausência do token. Depois o login custava OUTRO arranque.
  // Eram duas esperas para uma entrada.
  //
  // Nem em segundo plano vale a pena: a resposta anônima não tem o que
  // mostrar na tela de entrada, e ao chegar redesenhava a tela, APAGANDO
  // o RG e a senha já digitados. A chamada sai inteira.
  //
  // Isto vale porque a escala desta unidade exige login
  // (CFG.ESCALA_SO_AUTENTICADA). Numa unidade que deixe a escala
  // pública, esta é a linha a rever.
  mostrar('ger');
  if (DIAG) desenharDiag();
} else {
  carregar();
  if (DIAG) desenharDiag();
}
</script>
