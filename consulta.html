// Escala do mês, agrupada por dia
// ------------------------------------------------------------
const DIAS_SEM = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function renderEscala(filtro) {
  const itens = (dados.escala || []).slice();
  // A mesma barra da aba Gerenciar. Sem ela, quem trocasse o mês lá e
  // voltasse para cá veria outro mês sem entender por quê.
  // A faixa do ADM aparece em toda aba: clicar numa DEJEP aqui
  // oferece troca em nome do servidor escolhido, e isso precisa estar
  // visível o tempo todo.
  const barra = faixaAdm() + (TOKEN ? barraMes() : '') + avisoEntrar();
  if (!itens.length) {
    return barra + '<div class="empty-msg">'
      + (dados.semEscalaNoMes
          ? 'A escala de ' + escapar(dados.mes) + ' ainda não foi lançada.'
          : 'Nenhuma escala publicada no momento.') + '</div>';
  }

  const porDia = {};
  itens.forEach(function (i) {
    if (!porDia[i.data]) porDia[i.data] = [];
    porDia[i.data].push(i);
  });

  const ordemPosto = { '07 às 15h': 1, '08 às 16h': 2, 'Jumbo 08 às 16h': 3,
                       'Torre diurna': 4, 'Torre noturna': 5 };
  const datas = Object.keys(porDia).sort(function (a, b) {
    const pa = a.split('/'), pb = b.split('/');
    return (pa[1] + pa[0]).localeCompare(pb[1] + pb[0]);
  });

  const meuNome = dados.eu ? dados.eu.nome.toLowerCase() : null;
  let html = '';

  datas.forEach(function (d) {
    const lista = porDia[d].slice().sort(function (a, b) {
      return (ordemPosto[a.posto] || 9) - (ordemPosto[b.posto] || 9);
    });
    const visiveis = filtro
      ? lista.filter(function (i) { return (i.nome || '').toLowerCase().includes(filtro); })
      : lista;
    if (!visiveis.length) return;

    const p = d.split('/');
    const dt = new Date(2000 + 0, parseInt(p[1], 10) - 1, parseInt(p[0], 10));
    const dow = dados.anoRef
      ? new Date(dados.anoRef, parseInt(p[1], 10) - 1, parseInt(p[0], 10)).getDay()
      : dt.getDay();
    const fds = (dow === 0 || dow === 6);

    html += '<div class="dia-bloco"><div class="dia-cab">'
      + '<span' + (fds ? ' class="dia-fds"' : '') + '>' + escapar(d) + ' &bull; '
      + DIAS_SEM[dow] + '</span>'
      + '<span style="color:#8fa3ba;font-weight:400;">' + visiveis.length + '</span></div>';

    visiveis.forEach(function (i) {
      const ehMinha = meuNome && (i.nome || '').toLowerCase() === meuNome;
      // Sem identificação o nome vem vazio do servidor. Isso NÃO é
      // vaga em aberto: confundir as duas coisas faria a escala
      // parecer desfalcada para quem está só olhando.
      const oculto = dados.precisaEntrar && i.situacao !== 'Vaga';
      const vaga = !oculto && (!i.nome || i.situacao === 'Vaga');
      // O servidor já apurou com quais das minhas DEJEPs esta pode ser
      // trocada. Vazio significa troca incompatível — não se oferece.
      const compat = (i.trocaCom || []).length;
      const podeClicar = dados.eu && !ehMinha && !vaga &&
        i.situacao === 'Agendada' && compat > 0;

      html += '<div class="linha-dejep' + (ehMinha ? ' minha' : '')
        + (podeClicar ? ' clicavel' : '') + '"'
        + (podeClicar ? ' onclick="abrirTrocaComAlvo(\'' + i.id + '\')"' : '') + '>'
        + '<span class="ld-hora">' + escapar(i.horario) + '</span>'
        + '<span class="ld-posto">' + escapar(i.posto) + '</span>'
        + '<span class="ld-nome' + (vaga ? ' ld-vaga' : '')
        + (oculto ? ' ld-oculto' : '') + '">'
        + (oculto ? 'preenchida' : (vaga ? 'VAGA' : escapar(i.nome))) + '</span>'
        + (ehMinha ? '<span style="font-size:0.7rem;color:#276221;font-weight:700;">você</span>'
                   : (podeClicar ? '<span style="font-size:0.7rem;color:#2d6a9f;">trocar</span>'
                   : (dados.eu && !vaga && dados.minhas.length
                      ? '<span style="font-size:0.68rem;color:#c0ccd8;" title="Troca incompatível com o intervalo de descanso, o posto ou a sua situação">—</span>'
                      : '')))
        + (i.situacao === 'Falta' ? '<span style="font-size:0.7rem;color:#a02020;font-weight:700;">falta</span>' : '')
        + '</div>';
    });
    html += '</div>';
  });

  return barra + (html
    || '<div class="empty-msg">Nenhum servidor encontrado com esse nome.</div>');
}

function tabelaFila(titulo, itens, filtro, subtitulo) {
  const visiveis = filtro
    ? itens.filter(function (i) { return i.nome.toLowerCase().includes(filtro); })
    : itens;
  let html = '<div style="font-size:0.78rem;font-weight:700;color:#1a3a5c;'
    + 'text-transform:uppercase;letter-spacing:0.06em;margin:16px 0 4px;">' + titulo
    + ' <span style="color:#8fa3ba;font-weight:400;">(' + itens.length + ')</span></div>'
    + '<div style="font-size:0.74rem;color:#6b80a0;margin-bottom:8px;">' + subtitulo + '</div>';

  if (!visiveis.length) {
    return html + '<div class="empty-msg">' + (itens.length
      ? 'Nenhum servidor encontrado com esse nome.'
      : 'Nenhum servidor nesta fila.') + '</div>';
  }

  const meuNome = dados.eu ? dados.eu.nome.toLowerCase() : null;
  // A contagem é o que ordena a fila. Mostrá-la é o que permite a
  // cada um conferir a própria posição sem precisar perguntar.
  const comContagem = !!dados.porContagem;
  html += '<div class="tabela-wrap"><table><thead><tr>'
    + '<th style="width:60px;">#</th><th>Servidor</th>'
    + (comContagem ? '<th class="centro" style="width:86px;">DEJEPs</th>' : '')
    + '<th class="centro" style="width:90px;">Turno</th>'
    + '</tr></thead><tbody>';
  visiveis.forEach(function (i) {
    const eu = meuNome && i.nome.toLowerCase() === meuNome;
    html += '<tr' + (eu ? ' style="background:#eef7ee;font-weight:700;"' : '') + '>'
      + '<td class="num">' + i.posicao + 'º</td>'
      + '<td>' + escapar(i.nome)
      + (i.soTorre ? ' <span class="tag">torre</span>' : '')
      + (i.listas === 'Ambas' ? ' <span class="tag" style="background:#d9e8f5;color:#1a3a5c;">nos dois períodos</span>' : '')
      + '</td>'
      + (comContagem
          ? '<td class="centro">' + (i.dejeps === null || i.dejeps === undefined
              ? '—' : i.dejeps) + '</td>'
          : '')
      + '<td class="centro">' + escapar(i.turno || '—') + '</td></tr>';
  });
  return html + '</tbody></table></div>';
}

function renderLista(filtro) {
  const diurna  = dados.filaDiurna  || dados.fila || [];
  const noturna = dados.filaNoturna || [];
  if (dados.filaOculta) return avisoEntrar();
  if (!diurna.length && !noturna.length) {
    return '<div class="empty-msg">A lista corrida ainda não foi constituída.</div>';
  }
  return avisoEntrar() + tabelaFila('Período diurno', diurna, filtro,
      'Atende os postos das 07h e das 08h, o jumbo e a torre diurna.')
    + tabelaFila('Período noturno', noturna, filtro,
      'Atende a torre noturna. A participação depende de manifestação na inscrição.')
    + '<div style="font-size:0.76rem;color:#6b80a0;line-height:1.5;margin-top:14px;">'
    + (dados.porContagem
        ? 'Lista única, separada nos períodos diurno e noturno, na forma da Resolução SAP nº 048, de 24 de agosto de 2026.<br><br>'
          + 'A ordem é dada pela <strong>quantidade de DEJEPs</strong> de cada um: quem fez '
          + 'menos vem primeiro. A coluna DEJEPs mostra esse número, e ele é o '
          + '<strong>total do servidor</strong> — diurnas e noturnas somadas. Por isso quem '
          + 'atua nos dois períodos aparece com o mesmo número nos dois: a DEJEP é a mesma, '
          + 'de dia ou de noite.<br><br>'
          + 'Conta desde que o sistema entrou em operação, e não entram as canceladas nem as '
          + 'faltas. Quem empata na mesma quantidade fica na ordem do rodízio daquele '
          + 'período, e dentro do mês vale o rodízio de sempre: quem pega uma vaga passa '
          + 'para o fim. Quem se inscreve depois entra com a média do efetivo, para não '
          + 'passar à frente de quem já está na lista.'
        : 'Lista única, separada nos períodos diurno e noturno. A ordem foi definida na '
          + 'inscrição e é contínua — quem realiza uma DEJEP passa para o fim do seu '
          + 'período, e o mês seguinte começa de onde o anterior parou. A falta e a '
          + 'convocação emergencial também recolocam o servidor no fim.')
    + '</div>';
}

// Identificado = servidor com token válido, ou acesso administrativo.
function autenticado() { return !!(dados && (dados.eu || dados.adm || dados.consulta)); }

function render() {
  // MURO DE ACESSO. Sem identificação não há escala, fila nem nome:
  // a página inteira é a tela de entrada. É mais simples de explicar
  // do que uma página meio aberta, e não deixa sobra para discutir.
  const dentro = autenticado();
  el('abas').style.display = dentro ? '' : 'none';
  // A aba de estatísticas vale para quem entrou — servidor, gestão ou
  // chefia. O conteúdo dela é todo agregado: contagens do mês, nenhum
  // nome. Fora do login ela não aparece, como a escala.
  //
  // O perfil de consulta não tem o que gerenciar: a aba de gerenciar
  // some, em vez de abrir numa tela que só recusaria o que ele
  // tentasse fazer.
  const atual = !!(dados && dados.__token === TOKEN);
  const bStats = el('aba-stats'), bGer = el('aba-ger');
  if (bStats) bStats.style.display = dentro ? '' : 'none';
  if (bGer)   bGer.style.display   = (dentro && ehConsulta()) ? 'none' : '';
  // A correção de aba só vale quando os dados já são desta sessão.
  if (atual) {
    if (ehConsulta() && aba === 'ger') aba = 'stats';
    if (!dentro && aba === 'stats') aba = 'escala';
  }
  el('busca').style.display =
    (dentro && !dados.precisaEntrar && aba !== 'ger' && aba !== 'stats') ? '' : 'none';
  if (!dentro) {
    el('card-titulo').textContent = recToken || trocaObrigatoria
      ? 'Definir a senha' : 'Acesso à DEJEP';
    el('conteudo').innerHTML = renderAcesso();
    return;
  }

  if (aba === 'ger') {
    el('conteudo').innerHTML = renderGerenciar();
    if (dados && dados.eu) pintarGrade();
    return;
  }
  if (!dados) return;
  el('card-titulo').textContent = (aba === 'escala' && dados.mes)
    ? 'Escala de ' + dados.mes : TITULO_ABA[aba];
  if (aba === 'stats') { el('conteudo').innerHTML = renderEstatisticas(); return; }
  const filtro = el('busca').value.trim().toLowerCase();
  el('conteudo').innerHTML = (aba === 'escala') ? renderEscala(filtro) : renderLista(filtro);
}

let trocaAlvo = null;

function abrirModal(tit, sub, corpo, acoes) {
  el('modal-tit').textContent = tit;
  el('modal-sub').innerHTML = sub;
  el('modal-corpo').innerHTML = corpo || '';
  el('modal-acoes').innerHTML = acoes || '';
  el('modal').classList.add('ativo');
}

function fecharModal(ev) {
  if (ev && ev.target !== el('modal')) return;
  el('modal').classList.remove('ativo');
}

function fecharModalForcado() { el('modal').classList.remove('ativo'); }

// Clique no nome de outro servidor na escala
function abrirTrocaComAlvo(idAlvo) {
  if (!dados.eu) {
    toast('Abra a página pelo link do seu e-mail para solicitar troca.', true);
    return;
  }
  const alvo = (dados.escala || []).find(function (i) { return i.id === idAlvo; });
  if (!alvo) return;
  if (!dados.minhas.length) {
    toast('Você não tem DEJEP neste mês para oferecer em troca.', true);
    return;
  }
  trocaAlvo = idAlvo;

  const compat = alvo.trocaCom || [];
  const ofertaveis = dados.minhas.filter(function (m) { return compat.indexOf(m.id) !== -1; });
  if (!ofertaveis.length) {
    toast('Nenhuma das suas DEJEPs é compatível com essa.', true);
    return;
  }
  const opcoes = ofertaveis.map(function (m) {
    return '<button class="modal-opt" onclick="enviarTroca(\'' + m.id + '\')">'
      + '<strong>' + escapar(m.data) + '</strong> &nbsp; ' + escapar(m.posto)
      + ' &bull; ' + rotuloHorario(m.horario) + '</button>';
  }).join('');

  abrirModal('Solicitar troca com ' + alvo.nome,
    'Você assumiria <strong>' + escapar(alvo.data) + '</strong> — ' + escapar(alvo.posto)
    + '. Escolha abaixo <strong>qual das suas DEJEPs</strong> oferece em troca. '
    + 'Só aparecem as compatíveis: o intervalo de descanso dos dois já foi conferido. '
    + 'A troca só se efetiva se o colega aceitar — pelo e-mail ou na aba '
    + 'Gerenciar DEJEPs dele. Enquanto isso, o pedido fica visível aqui.',
    opcoes,
    '<button class="modal-btn" onclick="fecharModalForcado()">Cancelar</button>');
}

// Botão "Trocar" no painel pessoal: escolhe primeiro o alvo
function abrirTrocaDaMinha(idMinha) {
  const minha = dados.minhas.find(function (m) { return m.id === idMinha; });
  if (!minha) return;
  const candidatos = (dados.escala || []).filter(function (i) {
    return (i.trocaCom || []).indexOf(idMinha) !== -1;
  });
  if (!candidatos.length) {
    toast('Nenhuma troca compatível com a sua DEJEP de ' + minha.data + ' neste mês.', true);
    return;
  }
  const opcoes = candidatos.map(function (c) {
    return '<button class="modal-opt" onclick="enviarTrocaCom(\'' + idMinha + '\',\'' + c.id + '\')">'
      + '<strong>' + escapar(c.data) + '</strong> &nbsp; ' + escapar(c.posto)
      + ' &bull; ' + rotuloHorario(c.horario) + '<br>'
      + '<span style="color:#6b80a0;font-size:0.8rem;">' + escapar(c.nome) + '</span></button>';
  }).join('');

  abrirModal('Trocar a DEJEP de ' + minha.data,
    'Estas são as <strong>' + candidatos.length + ' trocas compatíveis</strong> com a sua '
    + 'DEJEP de ' + escapar(minha.data) + ' — o intervalo de descanso dos dois já foi '
    + 'conferido. O colega receberá um e-mail e a troca só se efetiva se ele aceitar.',
    '<div style="max-height:320px;overflow-y:auto;">' + opcoes + '</div>',
    '<button class="modal-btn" onclick="fecharModalForcado()">Cancelar</button>');
}

function enviarTroca(idMinha) { enviarTrocaCom(idMinha, trocaAlvo); }

function enviarTrocaCom(idMinha, idAlvo) {
  fecharModalForcado();
  mostrarAguardo('Enviando solicitação...');
  fetch(URL_BASE + '?acao=solicitar&t=' + encodeURIComponent(TOKEN) + comoParam()
      + '&minha=' + encodeURIComponent(idMinha) + '&alvo=' + encodeURIComponent(idAlvo))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      toast(j.mensagem, !j.sucesso);
      if (j.sucesso) carregar();
    })
    .catch(function () {
      esconderAguardo(); toast('Não foi possível enviar a solicitação.', true); });
}

    .then(function (r) { return r.json(); })

      esconderAguardo();

// ------------------------------------------------------------
// Entrar são DUAS chamadas: a que confere a senha e a que busca a
// escala. Esconder o indicador ao fim da primeira deixava a tela
// parada e sem sinal durante a segunda, que é a demorada. O
// indicador agora atravessa as duas, e quem chamou pode pedir algo
// para depois de a tela estar pronta — o aviso da sessão, por
// exemplo, que aparecia antes de a página existir.
// Aproveita a consulta que veio dentro da resposta do login, em vez de
// pedi-la de novo. 'carregar' continua existindo para todo o resto —
// trocar de mês, recarregar depois de uma ação — mas entrar não paga
// mais duas viagens ao servidor.
function carregar(aoTerminar, prontos) {
  if (!el('aguardo').classList.contains('ativo')) mostrarAguardo('Carregando...');
  if (prontos) { aplicarConsulta(prontos, aoTerminar); return; }
  const url = URL_BASE + '?acao=consulta'
    + (TOKEN ? '&t=' + encodeURIComponent(TOKEN) : '')
    + (mesRef ? '&mes=' + encodeURIComponent(mesRef) : '')
    // As estatísticas são caras de apurar no servidor e não aparecem
    // nas outras abas: só se pedem quando é a aba aberta.
    + (aba === 'stats' ? '&stats=1' : '')
    + comoParam();
  fetch(url).then(function (r) { return r.json(); })
    .then(function (d) { aplicarConsulta(d, aoTerminar); })
    .catch(function () {
      esconderAguardo();
      el('conteudo').innerHTML = '<div class="empty-msg">Não foi possível carregar os dados '
        + 'no momento.<br>Tente novamente em alguns instantes.</div>';
    });
}

function aplicarConsulta(d, aoTerminar) {
  {
    esconderAguardo();
    dados = d;
    // De qual token estes dados são. Sem isso, logo após entrar a
    // página ainda tem em mãos o payload da sessão anterior, e
    // decidir qual aba mostrar por ele leva à aba errada.
    dados.__token = TOKEN;
    // O servidor manda de volta qual mês atendeu. Guardar o que ELE
    // disse, e não o que foi pedido, evita a página achar que está num
    // mês e mostrar outro.
    if (d.mesChave) mesRef = d.mesChave;
    // O calendário de impedimento acompanha o mês de referência.
    if (d.mesChave) {
      const pm = d.mesChave.split('-');
      impMes = { ano: parseInt(pm[0], 10), mes: parseInt(pm[1], 10) };
    }
    if (d.mes) {
      const partes = d.mes.split(' ');
      dados.anoRef = parseInt(partes[partes.length - 1], 10) || new Date().getFullYear();
      el('card-titulo').textContent = (aba === 'escala')
        ? 'Escala de ' + d.mes : TITULO_ABA[aba];
    }
    render();
    if (aoTerminar) aoTerminar(d);
  }
}

// Qualquer interação do servidor adia o encerramento
['click', 'keydown', 'touchstart', 'scroll'].forEach(function (ev) {
  document.addEventListener(ev, marcarAtividade, { passive: true });
});
setInterval(conferirSessao, INTERVALO_CONFERE_MS);

// Sessão deixada aberta num acesso anterior não vale: quem sentar
// agora no computador começa deslogado.
if (TOKEN) {
  const parado = ultimoUso() ? (Date.now() - ultimoUso()) : 0;
  if (parado >= minutosDeSessao() * 60000) { guardarToken(''); guardarComo(''); }
  else marcarAtividade();
}

// Chegou pelo link de recuperação: a tela de definir a senha vem
// antes de tudo, e o link é conferido antes de o servidor digitar —
// descobrir que o link venceu depois de escolher a senha irrita.
if (recToken) {
  guardarToken(''); guardarComo('');
  mostrar('ger');
  mostrarAguardo('Conferindo o link...');
  fetch(URL_BASE + '?acao=conferir_link&r=' + encodeURIComponent(recToken))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      esconderAguardo();
      if (j.sucesso) { recNome = j.primeiroNome || ''; }
      else {
        recToken = '';
        try { history.replaceState(null, '', location.pathname); } catch (e) { /* ok */ }
        toast(j.mensagem, true);
      }
      carregar();
    })
    .catch(function () {
      esconderAguardo();
      recToken = '';
      toast('Não foi possível conferir o link agora. Tente novamente.', true);
      carregar();
    });
} else {
  carregar();
}
</script>
</body>
</html>
